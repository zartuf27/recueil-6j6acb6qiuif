"Exclusivement autour du Temple du Feu; grottes à côté du lac au-dessus de la vallée de la fin (lecture 'vallée de da fin' - AMBIGUOUS)","description":"Larges pétales noirs et rouges rappelant des braises consumées; cœur émettant une lueur jaune dorée semblable à une flamme vivante; chaleur naturelle perceptible même la nuit.","culture":"Ombre; modérée à chaude (résiste à la chaleur); sol rocheux, humide, riche en minéraux volcaniques; arrosage et humidité moyens; aucun engrais (énergie spirituelle naturelle). Suivi de croissance 15/08/25 (15 cm, 12 feuilles) au 12/09/25 (25 cm, 32 feuilles).","floraison":"Oui; pétales noir et rouge, cœur jaune doré lumineux; parfum moyen; pas de fruit","proprietes":"Renforce le moral et la volonté; apaise peur et fatigue mentale; stimule la détermination des shinobi; stabilité émotionnelle en période critique.","preparation":"Employée par les anciens du Temple du Feu en infusion et encens médicinal","mythe":"La lumière de son cœur devient plus intense lorsque son porteur retrouve sa détermination."},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 4"},"contenu_journal_de_plante_temple_du_feu":{"l":"Temple du Feu","c":"lieu","a":{"description":"Lieu sacré autour duquel pousse exclusivement l'Ishi no Shinzou; ses anciens l'emploient en infusion et encens."},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 4"},"contenu_journal_de_plante_nokagiri_uta":{"l":"Nokagiri Uta","c":"plante","a":{"page":5,"nom_scientifique":"Nokagiri Uta","nom_commun":"? (inconnu)","famille":"Liliacées (à confirmer)","type":"Plante médicale et plante psychologique","lieu":"Forêt interdite, proche des gros arbres, dans des buissons à l'ombre","description":"Larges feuilles bleu foncé dissimulant une fleur rose à trois longs pétales élégants; allure mystérieuse et raffinée.","culture":"Ombre; fraîche à tempérée (10-20 °C); sol riche en matières organiques, humide, bien drainé; arrosage régulier; humidité élevée; ne supporte ni sols secs ni soleil direct.","floraison":"Rose, parfum doux; floraison rare et discrète cachée au cœur des feuilles; pas de fruit","proprietes":"Calme les angoisses, régule le sommeil; paix intérieure et clarté émotionnelle; utilisée en méditation et recentrage.","dangers":"Surconsommation: somnolence excessive, rêves intenses, léthargie, léger brouillard mental.","preparation":"Distillation (huile essentielle, aromathérapie ou application diluée, jamais pure sur la peau); macération (huile végétale ou alcool, massage ou petite quantité); infusion 5-7 min avant le coucher, max une tasse par jour."},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 5"},"contenu_journal_de_plante_ryuumet_kuusa":{"l":"Ryuumet Kuusa","c":"plante","a":{"page":6,"type":"Plante médicale","description":"Tige très fine surmontée d'une grande corolle rouge éclatant; centre dense entouré de pétales délicats et de fins filaments (aspect de lys araignée).","floraison":"Rouge éclatant; sans parfum; pas de fruit","proprietes":"Léger stimulant cardiaque apportant de l'énergie aux shinobi lors des missions périlleuses.","dangers":"Spasmes, troubles cognitifs, séquelles neurologiques et pertes de mémoire après consommation.","lieu":"Non renseigné"},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 6"},"contenu_journal_de_plante_gekka_yuuki":{"l":"Gekka Yuuki","c":"plante","a":{"page":7,"autres_noms":"L'éclat glacial","type":"Plante médicale","description":"Pétales blanc éclatant, apparence froide et givrée; cœur coloré et lumineux; semble figée dans le gel sous un voile de givre permanent.","culture":"Plein soleil; froide à très froide; sol rocheux, pauvre, bien drainé; arrosage moyen; pousse en environnements extrêmement froids, résiste au gel permanent.","proprietes":"Anesthésique local (selon les écrits).","dangers":"Récupération lente de la sensibilité; cauchemars aux teintes glaciales induisant un refroidissement involontaire du corps.","floraison":"AMBIGUOUS (floraison 'non' cochée mais couleur blanc éclatant, cœur lumineux); sans parfum"},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 7"},"contenu_journal_de_plante_emma_le_charme_sombre":{"l":"Emma : le charme sombre","c":"plante","a":{"page":8,"autres_noms":"Le charme sombre","type":"Plante psychologique","lieu":"Pays des cerisiers, dans les lisières","description":"Grandes fleurs étoilées à six pétales rose et mauve sur fines tiges; cœur sombre et boutons floraux foncés qui se referment la nuit.","culture":"Plein soleil; tempérée à douce; sol humifère, léger, bien drainé; arrosage moyen; éviter sols trop secs ou argileux.","proprietes":"Remède apaisant pour le chagrin, lueur d'espoir dans la mélancolie des souvenirs nostalgiques des shinobis.","floraison":"Rose et mauve; parfum moyen; pas de fruit"},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 8"},"contenu_journal_de_plante_renoncule_des_glaciers":{"l":"Renoncule des Glaciers","c":"plante","a":{"page":10,"autres_noms":"Fleur des Cinglantes","rarete":"Rare","provenance":"Pays du Fer","lieu":"Rochers d'altitude, moraines glaciaires, bords des névés","description":"Petites fleurs blanches ou rosées en coupe en petits groupes; tiges courtes et épaisses; feuillage épais, charnu, vert foncé.","observation":"Fleurit du milieu de l'été aux premières fraîcheurs d'automne; résistante à la sécheresse; fleurs s'ouvrent au soleil et se ferment la nuit; pollinisée par insectes; se ressème naturellement.","empreintes":"Graines fusiformes dispersées par vent/animaux; racines fibreuses peu profondes.","habitat_liste":"Prairies ensoleillées, bords de chemins, terrains vagues, jardins naturels, sols bien drainés","proprietes":"Symbolique: résilience, liberté, espoir; soutient la biodiversité (pas de propriété médicinale indiquée).","note":"Note et devise de Mikaku Nara: « Comme l'eau trace son chemin sans force ni bruit, la beauté s'épanouit en liberté. »","nom_scientifique":"Ranunculus glacialis","type":"Herbacée","taille":"5 à 15 cm","morphologie":{"feuilles":"Épaisses, vert foncé, compactes et robustes, parfois couvertes d'une fine cire protectrice.","fleurs":"Blanches ou légèrement rosées, en coupe, avec un cœur jaune.","fruits":"Non observés à ce stade.","tiges":"Courtes et épaisses, souvent velues à la base.","racines":"Fibreuses, peu profondes, adaptées aux sols rocheux et pauvres en matières organiques.","couleurs":"Blanc (fleurs), vert (feuilles), jaune (cœur)","odeur":"Légère, fraîche et herbacée.","texture":"Épaisses, charnues, légèrement cireuses."},"habitat":{"environnement":"Terrains rocheux d'altitude, moraines glaciaires, bords des névés.","sol":"Sols pauvres, bien drainés, caillouteux.","climat":"Froid, vents forts, variations brutales de température.","altitude":"Élevée (au-delà de 2 000 m).","voisinage":"Mousses, lichens, saxifrages, edelweiss.","remarques":"Espèce très résistante aux conditions extrêmes. Pousse en petits groupes."},"affinite_chakra":{"reaction":"Oui","natures":"Suiton, Fûton","reactions":"L'extrait diffuse légèrement lors d'un contact avec du chakra Suiton. Le Fûton semble accélérer l'extraction des principes actifs.","hypotheses":"La plante concentre des composés sensibles au froid, qui interagissent avec la circulation nerveuse.","precautions":"Manipuler avec des gants. La plante fraîche peut provoquer des irritations."},"usages":"Anesthésiant local, potentiel agent incapacitant (immobilisation temporaire).","effets":"Réduction de la sensation de douleur, engourdissement temporaire, à forte dose diminution de la réponse musculaire.","dangerosite":"Moyenne","dangers":"Irritante à l'état frais. Un surdosage peut entraîner une paralysie temporaire de la zone touchée.","experiences":["10/09/2026 — 1. Analyse sang + extrait : Aucun changement visible. Conclusion : Aucune propriété.","10/09/2026 — 2. Mélange avec poison connu : Aucun effet. Conclusion : Échec (pas d'antidote).","10/09/2026 — 3. Contact cutané (frais) : Irritation, rougeurs, engourdissement. Conclusion : Potentiellement toxique.","10/09/2026 — 4. Extrait dilué : Faible irritation, engourdissement. Conclusion : Effet reproductible.","10/09/2026 — 5. Application sur plaie : Moins de réactions à la douleur. Conclusion : Effet analgésique probable.","10/09/2026 — 6. Comparaison témoin : Sensibilité réduite localement. Conclusion : Effet confirmé.","10/09/2026 — 7. Préparation séchée : Moins d'irritation, effet conservé. Conclusion : Préparation recommandée.","10/09/2026 — 8. Forte dose : Engourdissement important, faiblesse musculaire. Conclusion : Risque d'immobilisation."],"notes":"La Renoncule des Glaciers possède des propriétés anesthésiantes locales très intéressantes pour un usage médical de terrain. Elle ne soigne pas les blessures, mais permet de réduire temporairement la douleur, ce qui peut faciliter les soins ou permettre de continuer une mission. À forte concentration, l'extrait semble capable de provoquer un engourdissement plus profond, voire une immobilisation temporaire. Cette piste pourrait être exploitée pour la création d'un poison incapacitant, mais nécessite des recherches supplémentaires sur le dosage et la durée de l'effet.","conclusion":"La Renoncule des Glaciers est une plante au fort potentiel stratégique et médical. Après préparation (séchage conseillé), son extrait agit comme un anesthésiant local efficace. Une concentration plus élevée peut provoquer une diminution temporaire de la réponse musculaire, ouvrant la voie à un usage incapacitant. Des études complémentaires sont nécessaires pour déterminer la durée, la réversibilité et les limites de son effet.","decouverte":"10/09/2026 — Akira Kaito","rapport_akira_kaito":{"lieu":"Rochers d'altitude, moraines glaciaires, bords des névés.","description":"Plante basse et compacte, en rosette. Fleurs en coupe, souvent regroupées. Adaptée aux climats extrêmes d'altitude."},"illustrations":[{"full":"actualites/rapport-botanique-akira-renoncule-des-glaciers.webp","mini":"actualites/rapport-botanique-akira-renoncule-des-glaciers-mini.webp","legende":"Planche complète — Rapport botanique : Renoncule des Glaciers","w":1055,"h":1491,"article":"article_rapport_botanique_renoncule_des_glaciers"},{"full":"illustrations/contenu_journal_de_plante_renoncule_des_glaciers.webp","mini":"illustrations/contenu_journal_de_plante_renoncule_des_glaciers-mini.webp","legende":"Renoncule des Glaciers","credit":{"auteur":"Hans Hillewaert","licence":"CC BY-SA 3.0","url":"https://commons.wikimedia.org/wiki/File:Ranunculus_glacialis_(habitus).jpg","url_article":"https://fr.wikipedia.org/wiki/Ranunculus_glacialis"}}]},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 10"},"contenu_journal_de_plante_mikaku_nara":{"l":"Mikaku Nara","c":"personne externe","a":{"description":"Auteur de la note et de la devise sur la Renoncule des Glaciers dans le journal d'Ayaka."},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 10"},"contenu_journal_de_plante_raimei_no_take":{"l":"Raimei no Take","c":"plante","a":{"page":11,"autres_noms":"雷鳴の竹 - Le Bambou du Tonnerre","type":"Herbacée","lieu":"Pays des cerisiers, uniquement sur les sommets frappés régulièrement par la foudre","description":"Bambou dont les fibres emmagasinent naturellement l'électricité atmosphérique et une faible quantité de chakra.","culture":"Ombre; 5-20 °C (altitude); sol rocheux, bien drainé, riche en minéraux; nécessite une forte stabilité énergétique.","floraison":"Fleurit extrêmement rarement, souvent une seule fois dans sa vie, et meurt ensuite.","proprietes":"Stabilisation énergétique & protection des points vitaux: stabilise le réseau de chakra, réduit les perturbations énergétiques, protège les tenketsu.","preparation":"Infusion légère, ou talisman protecteur lors de combats/missions à haut risque.","dangers":"Précautions lors de la récolte (risques de foudre)."},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 11"},"contenu_journal_de_plante_mugen_ran":{"l":"Mugen Ran","c":"plante","a":{"page":12,"autres_noms":"夢幻蘭 - L'Orchidée des Illusions","type":"Herbacée","lieu":"Forêt de la Mort (Konohagakure), zones les moins explorées où les prédateurs sont nombreux; sous-bois sombres et humides","description":"Orchidée blanche nacrée au cœur jaune pâle diffusant un parfum presque imperceptible, pouvant provoquer des hallucinations légères selon la concentration.","culture":"Ombre; 12-20 °C; sol riche en matière organique, humide, bien drainé; délicate, sensible aux perturbations énergétiques.","proprietes":"Après purification: protection neuro-toxique & stabilisation sensorielle; protège le cerveau contre les toxines hallucinogènes, réduit les effets des neurotoxiques, stabilise les perceptions.","preparation":"Infusion ou extrait purifié pour empoisonnements neurotoxiques, hallucinations, dérèglements sensoriels; conserver à l'abri de la lumière et des fluctuations de chakra.","dangers":"Parfum dangereux sans purification (hallucinations)."},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 12"},"contenu_journal_de_plante_kekkai_no_hana":{"l":"Kekkai no Hana","c":"plante","a":{"page":13,"autres_noms":"結界の花 - La Fleur du Sang","type":"Herbacée","lieu":"Pays de l'Eau (Mizu no Kuni) / pays des marais; marais et vallées brumeuses","description":"Fleur rouge sombre dont la sève a une densité proche du sang humain; ne fleurit qu'à proximité d'une eau très riche en minéraux.","culture":"Ombre; 8-20 °C; sol marécageux riche en minéraux et matières organiques; très sensible au dessèchement et à la pollution de l'eau.","proprietes":"Stabilisation de la circulation sanguine: renforce la fluidité du sang, scelle les microfissures des vaisseaux, inhibe les toxines sanguines; réduit les hémorragies; contrebalance certains hémotoxiques.","preparation":"Décoction, onguent ou infusion pour blessures et intoxications sanglantes."},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 13"},"contenu_journal_de_plante_foret_interdite":{"l":"Forêt interdite","c":"lieu","a":{"description":"Habitat du Chant des morts (près de l'eau) et de la Nokagiri Uta (gros arbres, buissons)."},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"pages 3, 5"},"contenu_journal_de_plante_seimei_no_kusa":{"l":"Seimei no Kusa (L'Herbe de Vie)","c":"plante","a":{"autres_noms":"生命の草, L'Herbe de Vie","type":"Herbacée","description":"Herbe d'un vert éclatant dont les feuilles semblent toujours fraîches ; même coupées elles mettent plusieurs semaines à se flétrir. Structure cellulaire remarquablement résistante.","lieu":"Grande forêt dans le pays du fer (sous couvert végétal dense) ; terrain saturé d'énergie naturelle et de chakra médicinal","conditions":"Ombre, 10-25 °C, sol riche en énergie naturelle et chakra médicinal bien drainé, arrosage faible, humidité moyenne, aucun engrais","proprietes":"Fonction : neutralisation des toxines ; absorbe les toxines de son environnement et les transforme en composés inoffensifs","usages":"Protège les cellules contre les toxines ; limite les nécroses ; favorise la survie des tissus pendant une intoxication","dangers":"Récolte en zones empoisonnées où l'air est dangereux : protection respiratoire ou contrôle précis du chakra nécessaire","floraison":"Oui, fleurs blanc verdâtre, discrètes, sans parfum, s'épanouissent en période de forte énergie naturelle ; pas de fruit","remarques":"Sensible à la pollution et aux énergies négatives"},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 14"},"contenu_journal_de_plante_kuroguki_no_hana":{"l":"Kuroguki no Hana (Fleur des Neiges Noires)","c":"plante","a":{"autres_noms":"Fleur des Neiges Noires","type":"Herbacée","description":"Petite fleur sombre recouverte d'une fine couche cristalline, poussant dans des sols fortement contaminés par des poisons naturels. Fleurs noir profond à reflets violacés, pétales cristallisés sensibles à la lumière.","lieu":"Zone contaminée - Frontière Nord ; sols contaminés, terres empoisonnées, marécages toxiques","conditions":"Ombre, 5-15 °C, sol contaminé riche en toxines naturelles, arrosage faible, humidité moyenne ; nécessite un environnement toxique, l'eau pure inhibe sa croissance","proprietes":"Neutralisation des toxines ; absorbe les toxines et les transforme en composés inoffensifs. Une seule fleur peut purifier une grande quantité de poison.","usages":"Essentielle pour créer des antidotes puissants contre les poisons naturels ; indicateur de terres gravement contaminées","dangers":"Extrêmement rare, à manipuler avec grande précaution ; récolte nécessitant protection respiratoire (masque à gaz) ou contrôle précis du chakra","notes":"Symbole d'espoir dans les terres maudites"},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 15"},"contenu_journal_de_plante_doraha":{"l":"Doraha (Les Feuilles craquantes)","c":"plante","a":{"autres_noms":"Les feuilles craquantes","type":"Plante médicale","description":"Fleur au pistil rayé jaune et orange protégé par des pétales blancs et rigides ; tige brune robuste et fibreuse résistant aux vents violents.","lieu":"Frontière pays du Fer / Feu + cascade en face de cette frontière ; endroits exposés aux vents violents","conditions":"Plein soleil, fraîche à tempérée (climats rudes), sol rocheux bien drainé pauvre mais stable, arrosage et humidité faibles","proprietes":"Effet thérapeutique : utilisée en cataplasmes pour soulager les douleurs locales","preparation":"Utilisation : distillation, macération (champs vides)","floraison":"Blanc (pétales), pistil rayé jaune et orange ; sans parfum ; pas de fruit"},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 16"},"contenu_journal_de_plante_brume_silencieuse":{"l":"La brume silencieuse (BAUN)","c":"plante","a":{"autres_noms":"BAUN","type":"Plante psychologique","description":"Fleur aquatique dont seule la tête émerge ; bourgeon central blanc dense presque lumineux, pétales blanc et orange et pétales filamenteux en spirales. Dégage une brume légère le matin par temps frais.","lieu":"Lac à droite en sortant de Konoha (avec l'îlot central) ; endroits aquatiques","conditions":"Ombre, modérée à fraîche, substrat aquatique vaseux ou sableux, arrosage et humidité élevés ; sensible à la qualité de l'eau et à la pollution","proprietes":"Utilisée dans des rituels pour induire une relaxation profonde et apaiser l'esprit ; parfum moyen","dangers":"Effets secondaires : possible dépendance psychique et apathie","preparation":"Distillation (principes actifs volatils pour rituels/élixirs) ; macération (baume ou huile) ; séchage obligatoire puis broyage en poudre fine"},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 17"},"contenu_journal_de_plante_bambou":{"l":"Bambou","c":"plante","a":{"type":"Arbre","taille":"4 m - 16 m","saison":"Toute l'année, croissance maximale au printemps et en été","lieu":"Pays des Cerisiers (forêts humides, vallées boisées, abords des cours d'eau) ; aussi certaines régions du Pays du Feu","description":"Croissance extrêmement rapide, tiges creuses segmentées par des noeuds, bosquets denses, bruissement au vent, grande souplesse, repousse après coupe partielle","dangers":"Bosquets limitant la visibilité ; tiges cassées coupantes ; serpents et petits animaux ; chute lors de fortes tempêtes","conclusion":"Plante robuste et utile, ressource précieuse grâce à sa régénération","illustrations":[{"full":"illustrations/contenu_journal_de_plante_bambou.webp","mini":"illustrations/contenu_journal_de_plante_bambou-mini.webp","legende":"Bambou","credit":{"auteur":"This illustration was made by Citron You must credit this : Citron / CC-BY-SA-3.0","licence":"CC BY-SA 3.0","url":"https://commons.wikimedia.org/wiki/File:Phyllostachys_viridiglaucescens.jpg","url_article":"https://fr.wikipedia.org/wiki/Bambou"}}]},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 18"},"contenu_journal_de_plante_palmier":{"l":"Palmier","c":"plante","a":{"type":"Arbre","taille":"5 m - 15 m","saison":"Toute l'année, activité plus importante en périodes chaudes","lieu":"Plages et littoraux du Pays des Cerisiers (côtes sableuses exposées aux vents océaniques)","description":"Grand tronc élancé surmonté d'une couronne de feuilles ; supporte les climats chauds ; offre de l'ombre ; produit parfois des fruits ; résiste aux vents marins","dangers":"Chute de noix/fruits mûrs ; tronc difficile à escalader et glissant ; insectes et petits reptiles à sa base ; zones côtières exposées aux tempêtes","illustrations":[{"full":"illustrations/contenu_journal_de_plante_palmier.webp","mini":"illustrations/contenu_journal_de_plante_palmier-mini.webp","legende":"Palmier","credit":{"auteur":"UnknownUnknown Leipzig ; Berlin ; Wien : F.A. Brockhaus","licence":"Public domain","url":"https://commons.wikimedia.org/wiki/File:Various_Arecaceae.jpg","url_article":"https://fr.wikipedia.org/wiki/Arecaceae"}}]},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 19"},"contenu_journal_de_plante_oiseau_du_paradis":{"l":"Oiseau du Paradis (Tenkakuka)","c":"plante","a":{"autres_noms":"Tenkakuka","type":"Herbacée","description":"Plante élégante aux grandes feuilles allongées en forme d'oiseau en vol, épaisses, lisses, vert éclatant ; fleur discrète mais colorée. Odeur verte et fraîche, touche florale.","lieu":"Oasis de Suna (zones humides et ensoleillées), plante rare","conditions":"Plein soleil, 20-35 °C, sol riche humide bien drainé, arrosage moyen, apport modéré d'engrais ; sensible au froid et à la sécheresse","proprietes":"Favorise la circulation sanguine ; réduit la fatigue physique et mentale ; redonne de l'énergie","preparation":"Tisane : infuser 2 à 3 feuilles séchées 5-10 min ; 1 à 2 tasses par jour ; récolte des feuilles matures toute l'année ; séchage à l'ombre, bocal hermétique, conservation jusqu'à 1 an","dangers":"Surdosage : tremblements, vertiges, bouffées de chaleur, épuisement","illustrations":[{"full":"illustrations/contenu_journal_de_plante_oiseau_du_paradis.webp","mini":"illustrations/contenu_journal_de_plante_oiseau_du_paradis-mini.webp","legende":"Oiseau du Paradis (Tenkakuka)","credit":{"auteur":"Gabriel Collares","licence":"CC BY 4.0","url":"https://commons.wikimedia.org/wiki/File:Ave-do-para%C3%ADso,_Strelitzia_reginae,_em_Bag%C3%A9,_Rio_Grande_do_Sul,_Brasil_-_55211233712.jpg","url_article":"https://fr.wikipedia.org/wiki/Strelitzia_reginae"}}]},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 20"},"contenu_journal_de_plante_saguaro":{"l":"Saguaro","c":"plante","a":{"type":"Cactus","lieu":"Désert de Suna (Pays du Vent)","description":"Grand cactus des déserts, peut vivre plus de 150 ans, tronc stockant plusieurs centaines de litres d'eau. Fruit appelé 'tuna', comestible, riche en vitamines et sucre naturel, aide contre la déshydratation.","preparation":"Eau : extraire la pulpe à la base du tronc, filtrer avec tissu propre ou faire bouillir 5-10 min, refroidir. Fruit : récolter mûr, retirer peau et épines, consommer cru ou cuit (purée, jus, confiture).","dangers":"Eau non potable directement (parasites, diarrhées) ; ne jamais boire directement dans le tronc ; épines fines ; excès provoque des troubles digestifs","illustrations":[{"full":"illustrations/contenu_journal_de_plante_saguaro.webp","mini":"illustrations/contenu_journal_de_plante_saguaro-mini.webp","legende":"Saguaro","credit":{"auteur":"Tomascastelazo","licence":"CC BY-SA 4.0","url":"https://commons.wikimedia.org/wiki/File:Carnegiea_gigantea_or_Sahuaro_or_Saguaro.jpg","url_article":"https://fr.wikipedia.org/wiki/Saguaro"}}]},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 21"},"contenu_journal_de_plante_rakka_shiba":{"l":"Rakka-Shiba (Baie de Rakka)","c":"plante","a":{"autres_noms":"Baie de Rakka ; nom scientifique Rakka-Shiba ; famille Rosaceae","type":"Herbacée (coché) mais décrite comme petit arbuste sauvage","description":"Petit arbuste sauvage produisant des baies bleu profond en grappes protégées de fines épines ; feuilles sombres résistantes au froid.","lieu":"Pays du Fer : montagnes froides, landes rocheuses, forêts de conifères","conditions":"Plein soleil, 5-15 °C, sols bien drainés riches en minéraux, arrosage moyen, humidité faible ; sensible à l'excès d'humidité","proprietes":"Apaise l'esprit et favorise la méditation ; idéale pour la concentration et l'équilibre mental","dangers":"À utiliser avec modération : possibles effets secondaires en cas de surdosage","floraison":"Pas de floraison notée ; fructification le 05/09/2025, baie bleu profond"},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 22"},"contenu_journal_de_plante_arbre_du_parapluie":{"l":"Arbre du Parapluie (Chaka)","c":"plante","a":{"autres_noms":"Chaka","type":"Arbre (décrit comme arbuste)","description":"Arbuste à feuilles épaisses, charnues et luisantes disposées en parapluie, stockant l'humidité. Odeur végétale douce et fraîche.","lieu":"Oasis de Suna ; autour des points d'eau et oasis désertiques","conditions":"Plein soleil, 20-35 °C, sol sableux humide riche en minéraux, arrosage moyen, humidité moyenne","proprietes":"Calme la fatigue nerveuse, apaise l'esprit agité, procure relaxation et sérénité","preparation":"Tisane : infuser les feuilles séchées 5-10 min ; 1 à 2 tasses/jour ; récolte le matin des feuilles matures ; séchage à l'ombre ; conservation jusqu'à 1 an","dangers":"Somnolence ; à éviter avant un combat ou un déplacement important"},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 23"},"contenu_journal_de_plante_mousse_d_aonami":{"l":"Mousse d'Aonami","c":"plante","a":{"autres_noms":"Aonamia marina (famille Aonamiaceae)","type":"Herbacée","description":"Mousse marine médicinale rare, teinte bleu-vert légèrement lumineuse, texture fraîche et gélatineuse ; floraison discrète bleu pâle à blanc (02/07/2025).","lieu":"Pays des Plages : rochers humides des côtes rocheuses et récifs marins (roll > 75)","conditions":"Plein soleil, 15-25 °C, rochers humides riches en minéraux marins ; propriétés disparaissent hors de son climat idéal","proprietes":"Apaise brûlures et irritations, réduit l'inflammation, rafraîchit les tissus, accélère la cicatrisation des petites plaies","preparation":"Pâte, compresse ou intégrée dans des baumes médicinaux","notes":"Espèce rare et précieuse à protéger ; obtention conditionnée à un jet de dé > 75","nom_scientifique":"(non déterminé)","taille":"Quelques centimètres (couvre les rochers)","morphologie":{"feuilles":"Très petites, fines et filamenteuses, bleu-vert, d'aspect gélatineux.","fleurs":"Aucune fleur visible.","fruits":"Aucun fruit ni graine observé.","tiges":"Tiges très fines et ramifiées, formant une structure souple et compacte.","racines":"Pas de racines profondes. Fixation directe sur les rochers par un réseau de filaments.","couleurs":"Bleu-vert (parfois teinté de turquoise).","odeur":"Odeur très discrète, marine et fraîche.","texture":"Texture gélatineuse, humide et légèrement lumineuse."},"habitat":{"environnement":"Côtes rocheuses et récifs marins.","sol":"Rochers humides, zone de balancement des marées.","climat":"Milieu côtier, tempéré à chaud.","altitude":"Niveau de la mer.","voisinage":"Algues, lichens marins, petites plantes halophiles.","remarques":"Pousse en abondance sur les rochers des côtes du Pays des Plages, surtout dans les zones constamment humides."},"affinite_chakra":{"reaction":"Non","reactions":"Aucune réaction visible, même avec une concentration élevée.","hypotheses":"La plante ne semble pas liée au chakra, sa légère luminosité pourrait être d'origine naturelle (milieu marin).","precautions":"Aucune connue à ce jour."},"usages":"Apaisement des brûlures et irritations. Réduction de l'inflammation. Maintien de l'humidité sur les plaies superficielles. Pansement naturel d'urgence.","effets":"Soulagement de la douleur, diminution de la rougeur et protection des tissus. Aucun effet sur le chakra.","dangerosite":"Aucune connue","dangers":"Les propriétés disparaissent presque entièrement lorsque la mousse sèche. Doit être conservée humide pour rester efficace.","experiences":["08/09/2026 — Réaction avec du sang : Aucun changement visible. Conclusion : Aucun effet.","08/09/2026 — Réaction avec un poison faible : Aucun changement. Conclusion : Aucun effet.","08/09/2026 — Réaction au chakra : Aucune réaction. Conclusion : Aucun effet.","08/09/2026 — Contact cutané (animal sain) : Aucune irritation. Conclusion : Non toxique.","08/09/2026 — Mousse séchée : Perte de texture, aucun effet. Conclusion : Le séchage annule les propriétés.","09/09/2026 — Irritation cutanée (animal) : Diminution de la rougeur. Conclusion : Effet apaisant.","09/09/2026 — Comparaison avec de l'eau : Soulagement moindre. Conclusion : Effet supérieur à l'eau seule.","09/09/2026 — Fraîche vs séchée : La fraîche est efficace. Conclusion : Les propriétés nécessitent l'humidité.","10/09/2026 — Petite coupure : Légère amélioration. Conclusion : Effet cicatrisant faible.","10/09/2026 — Contusion : Soulagement léger. Conclusion : Effet limité.","11/09/2026 — Brûlure superficielle : Forte réduction de la douleur. Conclusion : Effet très intéressant.","11/09/2026 — Comparaison blessures : Brûlure > irritation > coupure. Conclusion : Spécialisée pour brûlures/irritations.","12/09/2026 — Transformation en pâte : Adhère bien à la peau. Conclusion : Utilisable comme pansement.","12/09/2026 — Test de conservation : Perte d'efficacité si séchée. Conclusion : Doit rester humide.","13/09/2026 — Application après conservation : Effet toujours présent (réduit). Conclusion : Transport possible si bien conservée."],"conclusion":"La Mousse d'Aonami est une plante non toxique qui agit comme un pansement naturel apaisant pour les brûlures et irritations superficielles. Elle réduit l'inflammation, maintient les tissus humides et adhère à la peau. Ses propriétés disparaissent rapidement lorsqu'elle sèche. Utile pour les missions en milieu côtier ou en environnement chaud.","decouverte":"13/09/2026 — Akira Kaito","rapport_akira_kaito":{"type":"Mousse","lieu":"Pays des Plages","description":"Pousse en tapis denses sur les rochers humides. Forme des touffes compactes et ramifiées. Résiste bien aux embruns et reste fixée solidement aux rochers.","notes":"Les premiers tests n'ont révélé aucune propriété particulière. C'est à partir du 09/09 que j'ai commencé à observer un réel effet sur les irritations cutanées, puis surtout sur les brûlures. La mousse d'Aonami apaise rapidement la douleur et diminue l'inflammation. Elle maintient la zone humide et adhère naturellement à la peau, ce qui en fait un excellent pansement de terrain pour les brûlures légères. Son effet sur les coupures est limité et elle ne remplace pas une véritable plante régénérante comme la Fleur de cerisier. La conservation est un point important : une fois sèche, la mousse perd presque toutes ses propriétés. Je devrai réfléchir à un moyen de la maintenir humide lors de mes futures missions."},"illustrations":[{"full":"actualites/rapport-botanique-akira-mousse-d-aonami.webp","mini":"actualites/rapport-botanique-akira-mousse-d-aonami-mini.webp","legende":"Planche complète — Rapport botanique : Mousse d'Aonami","w":1024,"h":1536,"article":"article_rapport_botanique_mousse_d_aonami"}]},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 24"},"contenu_journal_de_plante_aloevera":{"l":"Aloevera","c":"plante","a":{"autres_noms":"Aloe vera (famille Asphodelaceae)","type":"Herbacée (succulente)","description":"Plante succulente aux feuilles épaisses et charnues contenant un gel transparent apaisant, bordées de petites épines.","lieu":"Pays du Vent, régions arides et chaudes","conditions":"Plein soleil, 18-32 °C, sol sableux bien drainé, arrosage moyen ; éviter l'excès d'eau","proprietes":"Soulage les brûlures légères à modérées, apaise les irritations cutanées, hydrate et aide à la réparation de la peau","preparation":"Couper une feuille, prélever le gel et l'appliquer sur la peau ; conservation du gel extrait 3 à 5 jours au réfrigérateur","dangers":"Usage externe uniquement, non comestible : irritation digestive, difficultés respiratoires, rougeurs ; tenir hors de portée des enfants","illustrations":[{"full":"illustrations/contenu_journal_de_plante_aloevera.webp","mini":"illustrations/contenu_journal_de_plante_aloevera-mini.webp","legende":"Aloevera","credit":{"auteur":"H. Zell","licence":"CC BY-SA 3.0","url":"https://commons.wikimedia.org/wiki/File:Aloe_vera_Lanzarote.jpg","url_article":"https://fr.wikipedia.org/wiki/Aloe_vera"}}]},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 25"},"contenu_journal_de_plante_oasis_de_suna":{"l":"Oasis de Suna","c":"lieu","a":{},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"pages 20, 23"},"contenu_journal_de_plante_pays_du_vent":{"l":"Pays du Vent","c":"lieu","a":{},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"pages 21, 25"},"contenu_journal_de_plante_pays_des_plages":{"l":"Pays des Plages","c":"lieu","a":{},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"page 24"},"contenu_journal_de_plante_neutralisation_des_toxines":{"l":"Neutralisation des toxines","c":"toxine","a":{},"s":"sources/ouvrages/journal-de-plante-ayaka.pdf","p":"pages 14, 15"},"contenu_les_proc_dures_d_extraction_par_sora_tori":{"l":"Les procédures d'extraction de plantes (Sora Tori)","c":"document PDF","a":{"resume":"Cahier de Sora Tori décrivant 4 techniques d'extraction végétale : macération huileuse, distillation aqueuse, distillation alcoolique, infusion.","pages":4},"s":"sources/ouvrages/procedures-extraction-sora-tori.pdf","p":"page 1"},"contenu_les_proc_dures_d_extraction_par_sora_tori_maceration_huileuse":{"l":"Macération huileuse","c":"technique d'extraction","a":{"definition":"Technique d'extraction naturelle : laisser une plante tremper dans un liquide (le plus souvent une huile végétale) pour qu'il absorbe progressivement ses principes actifs.","etapes":"1) Préparation de la plante (propre, correctement séchée pour éviter les moisissures, découpée ou légèrement écrasée) ; 2) Choix de l'huile (influence conservation, pénétration dans la peau, propriétés finales du baume) ; 3) Temps de macération : plusieurs jours à semaines selon la plante, la puissance recherchée et la méthode ; 4) Filtration pour retirer les résidus végétaux.","usage":"Fabrication de baumes médicinaux (apaisants, anti-inflammatoires, cicatrisants) ; soins cutanés, brûlures, irritations.","proprietes":"L'huile protège les tissus, hydrate la peau, aide à fixer les actifs réparateurs, facilite l'application.","rationale":"Méthode douce : extrait les propriétés sans les détériorer par une chaleur excessive ; base essentielle des soins thérapeutiques contre inflammation, douleur, et pour la régénération des tissus."},"s":"sources/ouvrages/procedures-extraction-sora-tori.pdf","p":"page 2"},"contenu_les_proc_dures_d_extraction_par_sora_tori_distillation_aqueuse":{"l":"Distillation aqueuse","c":"technique d'extraction","a":{"principe":"Les substances ne s'évaporent pas toutes à la même température.","etapes":"1) Chauffage : eau et/ou plantes dans un alambic, la vapeur traverse les plantes et arrache molécules aromatiques et principes actifs volatils ; 2) Transport : la vapeur circule dans le serpentin ; 3) Refroidissement : serpentin refroidi par eau froide ou air, la vapeur se condense ; 4) Séparation en deux phases.","resultat":"Phase aqueuse (hydrolat / eau florale) + phase huileuse (huile essentielle / essence végétale), l'huile flottant à la surface."},"s":"sources/ouvrages/procedures-extraction-sora-tori.pdf","p":"page 3"},"contenu_les_proc_dures_d_extraction_par_sora_tori_distillation_alcoolique":{"l":"Distillation alcoolique","c":"technique d'extraction","a":{"etapes":"1) Fermentation de matières sucrées (fruits, céréales, miel, certaines plantes) par des micro-organismes -> éthanol + dioxyde de carbone, liquide faiblement alcoolisé ; 2) Distillation : l'éthanol s'évapore à plus basse température que l'eau ; les vapeurs plus riches en alcool sont refroidies pour obtenir un distillat concentré.","resultat":"Distillat alcoolique concentré (éthanol)."},"s":"sources/ouvrages/procedures-extraction-sora-tori.pdf","p":"page 3"},"contenu_les_proc_dures_d_extraction_par_sora_tori_infusion":{"l":"Infusion","c":"technique d'extraction","a":{"definition":"Mise en contact d'une matière végétale avec de l'eau chaude pour solubiliser les composés hydrosolubles (polyphénols, tanins, flavonoïdes, sucres, composés aromatiques).","etapes":"1) Préparation des feuilles (sélection, découpe pour augmenter la surface de contact) ; 2) Chauffage de l'eau à la température recommandée ; 3) Mise en contact feuilles/eau chaude ; 4) Temps d'infusion jusqu'à équilibre (trop court = extraction limitée, trop long = composés indésirables) ; 5) Filtration ; 6) Récupération de l'infusé (filtrat) pour analyse, formulation ou observation.","principe":"Dissolution et diffusion ; efficacité dépend de la température, du temps, de la taille des fragments et du rapport feuilles/volume d'eau.","rationale":"Température adaptée : améliore le rendement tout en limitant la dégradation des molécules sensibles à la chaleur."},"s":"sources/ouvrages/procedures-extraction-sora-tori.pdf","p":"page 4"},"contenu_les_proc_dures_d_extraction_par_sora_tori_alambic":{"l":"Alambic","c":"matériel / produit","a":{"usage":"Appareil de distillation où l'on chauffe eau et/ou plantes."},"s":"sources/ouvrages/procedures-extraction-sora-tori.pdf","p":"page 3"},"contenu_les_proc_dures_d_extraction_par_sora_tori_serpentin":{"l":"Serpentin","c":"matériel / produit","a":{"usage":"Tube où circule la vapeur ; refroidi par eau froide ou air pour la condenser."},"s":"sources/ouvrages/procedures-extraction-sora-tori.pdf","p":"page 3"},"contenu_les_proc_dures_d_extraction_par_sora_tori_hydrolat":{"l":"Hydrolat (eau florale)","c":"matériel / produit","a":{"description":"Phase aqueuse issue de la distillation aqueuse."},"s":"sources/ouvrages/procedures-extraction-sora-tori.pdf","p":"page 3"},"contenu_les_proc_dures_d_extraction_par_sora_tori_huile_essentielle":{"l":"Huile essentielle (essence végétale)","c":"matériel / produit","a":{"description":"Phase huileuse issue de la distillation ; plus légère que l'eau, flotte et se récupère séparément."},"s":"sources/ouvrages/procedures-extraction-sora-tori.pdf","p":"page 3"},"contenu_les_proc_dures_d_extraction_par_sora_tori_fermentation":{"l":"Fermentation","c":"technique d'extraction","a":{"description":"Transformation par des micro-organismes d'une partie des sucres (fruits, céréales, miel, plantes) en éthanol et dioxyde de carbone."},"s":"sources/ouvrages/procedures-extraction-sora-tori.pdf","p":"page 3"},"contenu_les_proc_dures_d_extraction_par_sora_tori_filtration":{"l":"Filtration","c":"technique d'extraction","a":{"description":"Étape commune séparant le liquide extrait des résidus végétaux (macération, infusion)."},"s":"sources/ouvrages/procedures-extraction-sora-tori.pdf","p":"page 2"},"contenu_les_proc_dures_d_extraction_par_sora_tori_huile_vegetale":{"l":"Huile végétale (support de macération)","c":"matériel / produit","a":{"description":"Support thérapeutique transportant les propriétés médicinales de la plante sur la peau."},"s":"sources/ouvrages/procedures-extraction-sora-tori.pdf","p":"page 2"},"contenu_les_proc_dures_d_extraction_par_sora_tori_baume_medicinal":{"l":"Baume médicinal","c":"matériel / produit","a":{"description":"Soin issu de la macération huileuse, agit sur inflammation, douleur, régénération des tissus ; utile sur brûlures et irritations."},"s":"sources/ouvrages/procedures-extraction-sora-tori.pdf","p":"page 2"},"contenu_recueil_de_min_raux_et_cristaux":{"l":"Recueil de minéraux et cristaux (Tsuyka Itsuri)","c":"document PDF","a":{"sous_titre":"Étude, classification et propriété des cristaux naturelles","resume":"Recueil de 12 minéraux/cristaux (fiches : classification, apparence, localisation, propriétés, usages, note de recherche, état des recherches Observé/Expérimenté/Acquis/Maîtrisé, risque, élément ; pages détaillées structure interne / formation / conditions de développement / résonance énergétique) + Pierres précieuses (étude à Suna) + Analyse des résonances cristallines et applications climatiques + conclusion. Archives de la Section Scientifique de Konoha.","sommaire":"3-5 Citrine ; 6-8 Quartz clair ; 9-10 Jade ; 11-12 Obsidienne ; 13-15 Lapis-Lazulis ; 16-18 Malachite ; 19-20 Sélénite ; 21-22 Tourmaline noire ; 23-24 Fluorite ; 25-26 Cryolite ; 27-28 Peridot ; 29-30 Fulgurite ; 31 Pierres précieuses ; 32 Résonance cristalline ; 33 Conclusion","pages":34},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"page 1"},"contenu_recueil_de_min_raux_et_cristaux_etat_des_recherches":{"l":"État des recherches (Observé / Expérimenté / Acquis / Maîtrisé)","c":"concept","a":{"description":"Échelle de progression utilisée sur chaque fiche de cristal : Observé -> Expérimenté -> Acquis -> Maîtrisé."},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"page 3"},"contenu_recueil_de_min_raux_et_cristaux_resonance_energetique":{"l":"Résonance énergétique / cristalline","c":"concept","a":{"principe":"Lorsqu'un chakra compatible est injecté dans un cristal, celui-ci entre en résonance ; plus l'affinité entre le cristal et la nature du chakra est élevée, plus la réaction est stable et efficace. Les cristaux ne produisent pas d'énergie : ils agissent comme récepteurs capables de transformer, amplifier, stocker ou redistribuer certaines formes de chakra.","facteurs_quartz":"Pureté structurelle, longueur du cristal, orientation des faces, qualité du flux, harmonie avec l'utilisateur.","resume_observe":"Citrine + Katon : accumule et diffuse la chaleur, température élevée stable ; Lapis-Lazuli + Suiton : attire/accumule l'humidité, climat humide ; autres cristaux : à déterminer."},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"page 32"},"contenu_recueil_de_min_raux_et_cristaux_element_katon":{"l":"Katon (Feu)","c":"nature de chakra / élément","a":{},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"page 24"},"contenu_recueil_de_min_raux_et_cristaux_element_suiton":{"l":"Suiton (Eau)","c":"nature de chakra / élément","a":{"illustrations":[{"full":"actualites/bras-drainage-suiton.webp","mini":"actualites/bras-drainage-suiton-mini.webp","legende":"Planche complète — Bras prothétique : intégration d'un canal de drainage Suiton","w":959,"h":1024,"article":"article_bras_drainage_suiton"}]},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"page 24"},"contenu_recueil_de_min_raux_et_cristaux_element_futon":{"l":"Fûton (Vent)","c":"nature de chakra / élément","a":{},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"page 24"},"contenu_recueil_de_min_raux_et_cristaux_element_doton":{"l":"Doton (Terre)","c":"nature de chakra / élément","a":{},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"page 24"},"contenu_recueil_de_min_raux_et_cristaux_element_raiton":{"l":"Raiton (Foudre)","c":"nature de chakra / élément","a":{},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"page 24"},"contenu_recueil_de_min_raux_et_cristaux_lieu_desert_de_suna":{"l":"Désert de Suna / Pays du Vent","c":"lieu","a":{},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":null},"contenu_recueil_de_min_raux_et_cristaux_lieu_pays_du_feu":{"l":"Pays du Feu","c":"lieu","a":{},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":null},"contenu_recueil_de_min_raux_et_cristaux_main_blanche":{"l":"La Main Blanche","c":"organisation externe","a":{"description":"Groupe de véritables criminels près du Hameau du Fer (Pays du Fer) ; avertissement de Tsuyka."},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"page 8"},"contenu_recueil_de_min_raux_et_cristaux_citrine":{"l":"Citrine","c":"minéral / cristal","a":{"numero":"01","classification":"Cristal thermique naturel","couleur":"Translucide, jaune pâle à orange doré (rayons du soleil, flammes) ; spécimens purs très clairs et lumineux","lieu":"Régions désertiques, falaises très exposées au soleil ; filons apparaissant après une tempête de sable ; filon au Nord du Havre de repos du Désert rouge (Suna), d'après une vieille carte des archives de Suna","proprietes":"Régulation thermique, conservation et diffusion lente de la chaleur, retient la chaleur longtemps, favorise environnements chauds et secs, grande stabilité aux variations de température","structure_chakra":"Chaque point = nœud énergétique où le chakra s'accumule ; veines dorées riches en particules de fer oxydé en réseau radial diffusant l'énergie du noyau vers tout le cristal","element":"Katon","etat_recherche":"Observé","note":"Forte affinité aux phénomènes de chaleur, stable sous énergie prolongée ; amplification par association avec d'autres minéraux à tester.","illustrations":[{"full":"illustrations/contenu_recueil_de_min_raux_et_cristaux_citrine.webp","mini":"illustrations/contenu_recueil_de_min_raux_et_cristaux_citrine-mini.webp","legende":"Citrine","credit":{"auteur":"Didier Descouens","licence":"CC BY-SA 4.0","url":"https://commons.wikimedia.org/wiki/File:Citrine_bresil.jpg","url_article":"https://fr.wikipedia.org/wiki/Citrine"}}]},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"pages 3-5"},"contenu_recueil_de_min_raux_et_cristaux_quartz_clair":{"l":"Quartz clair (cristal de roche)","c":"minéral / cristal","a":{"numero":"02","classification":"Cristal universel","couleur":"Translucide à transparent, blanc laiteux à incolore ; faces lisses et brillantes","structure":"Système trigonal, prisme hexagonal terminé en pointe, dioxyde de silicium ; réseau en hélice continue à l'échelle microscopique","lieu":"Massifs montagneux riches en silice, cavernes profondes, veines hydrothermales, régions à forte activité tellurique ; deux grottes à la sortie du Hameau du Fer (Pays du Fer), à la base de cristaux bleus","proprietes":"Excellente conductivité énergétique ; amplifie et stabilise les flux de chakra ; réagit aux vibrations et résonances ; ne se dégrade pas ; l'un des meilleurs conducteurs naturels de chakra (transmission directionnelle, très peu de perte)","mecanisme":"Le chakra entre par la base, circule le long de l'axe central, est diffusé/émis par la pointe ; plus le cristal est pur, plus le flux est rapide, stable et précis","usage":"Amplification des flux énergétiques, noyau de matrices cristallines, connexion entre plusieurs cristaux, applications médicales et analytiques","etat_recherche":"Observé","note":"Interagit avec la majorité des autres minéraux ; reste à tester s'il amplifie les propriétés des minéraux en contact.","illustrations":[{"full":"illustrations/contenu_recueil_de_min_raux_et_cristaux_quartz_clair.webp","mini":"illustrations/contenu_recueil_de_min_raux_et_cristaux_quartz_clair-mini.webp","legende":"Quartz clair (cristal de roche)","credit":{"auteur":"Didier Descouens","licence":"CC BY-SA 4.0","url":"https://commons.wikimedia.org/wiki/File:Quartz_oisan.jpg","url_article":"https://fr.wikipedia.org/wiki/Quartz_(min%C3%A9ral)"}}]},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"pages 6-8"},"contenu_recueil_de_min_raux_et_cristaux_jade":{"l":"Jade","c":"minéral / cristal","a":{"numero":"03","classification":"Gemme protectrice","couleur":"Vert profond, surface lisse légèrement cireuse, motifs plus clairs en veines/nuages","structure":"Structure fibreuse unique, minéraux entrelacés comme un tissu très dense (« armure minérale naturelle ») ; formée sous forte pression dans les chaînes montagneuses pendant des milliers d'années","lieu":"Pays des Cerisiers, Pays des Marais, Pays du Feu, Pays du Vent (près des montagnes et falaises)","proprietes":"Excellente résistance aux chocs violents ; absorbe et disperse les énergies négatives ; harmonie et stabilité ; conserve ses propriétés ; stabilisateur naturel des flux de chakra ; très stable face aux surcharges de chakra Katon sans fissuration majeure","usage":"Amulette/talisman protecteur, renforcement d'armures et d'équipements shinobi, stabilisation d'environnement instable, soutien à la méditation","etat_recherche":"Observé, Expérimenté, Acquis","illustrations":[{"full":"illustrations/contenu_recueil_de_min_raux_et_cristaux_jade.webp","mini":"illustrations/contenu_recueil_de_min_raux_et_cristaux_jade-mini.webp","legende":"Jade","credit":{"auteur":"James St. John","licence":"CC BY 2.0","url":"https://commons.wikimedia.org/wiki/File:Jadeitite_(jadeite_jade)_(Burma)_1_(24665206206).jpg","url_article":"https://fr.wikipedia.org/wiki/Jade"}}]},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"pages 9-10"},"contenu_recueil_de_min_raux_et_cristaux_obsidienne":{"l":"Obsidienne","c":"minéral / cristal","a":{"numero":"04","classification":"Pierre volcanique","couleur":"Noir profond brillant, vitreuse comme un miroir, reflets gris/argentés/bleutés","lieu":"Massifs montagneux, cavernes profondes, zones volcaniques, coulées de lave anciennes","proprietes":"Ancrage énergétique, absorbe et dissipe les énergies négatives/chaotiques, résiste à de fortes températures, barrière protectrice naturelle ; liée au Chakra Racine (base de la colonne vertébrale) ; dissipe les illusions en révélant la vérité intérieure","usage":"Protection et barrières, contrepoids énergétique, rituel d'ancrage et de purification, renforcement d'armure et d'objet","risque":"Tranchante : manipulation risquée","etat_recherche":"Observé","illustrations":[{"full":"illustrations/contenu_recueil_de_min_raux_et_cristaux_obsidienne.webp","mini":"illustrations/contenu_recueil_de_min_raux_et_cristaux_obsidienne-mini.webp","legende":"Obsidienne","credit":{"auteur":"No machine-readable author provided. PAR~commonswiki assumed (based on copyright claims).","licence":"Public domain","url":"https://commons.wikimedia.org/wiki/File:ObsidianOregon.jpg","url_article":"https://fr.wikipedia.org/wiki/Obsidienne"}}]},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"pages 11-12"},"contenu_recueil_de_min_raux_et_cristaux_lapis_lazulis":{"l":"Lapis-Lazulis","c":"minéral / cristal","a":{"numero":"05","classification":"Pierre harmonisante (pierre de sagesse)","couleur":"Bleu profond parsemé de veines dorées de pyrite (ciel nocturne étoilé)","structure":"Couches de lazurite et minéraux bleus superposées ; veines de pyrite formant un réseau conducteur","lieu":"Rivières, mers, océans ; anciennes carrières et rivières souterraines ; roche riche en lazulite ; Pays des Plages dans les bassins d'eau (carte p.15)","proprietes":"Harmonie des énergies, apaise tensions et fluctuations, clarté d'esprit, stabilise les environnements aquatiques ; absorbe et stocke l'humidité, réservoir énergétique aquatique, amplifie le chakra Suiton","usage":"Méditation et concentration, rituel d'équilibrage énergétique, matrice de résonance tropicale et tempérée","element":"Suiton","etat_recherche":"Observé","illustrations":[{"full":"illustrations/contenu_recueil_de_min_raux_et_cristaux_lapis_lazulis.webp","mini":"illustrations/contenu_recueil_de_min_raux_et_cristaux_lapis_lazulis-mini.webp","legende":"Lapis-Lazulis","credit":{"auteur":"Hannes Grobe","licence":"CC BY-SA 2.5","url":"https://commons.wikimedia.org/wiki/File:Lapis-lazuli_hg.jpg","url_article":"https://en.wikipedia.org/wiki/Lapis_lazuli"}}]},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"pages 13-15"},"contenu_recueil_de_min_raux_et_cristaux_malachite":{"l":"Malachite","c":"minéral / cristal","a":{"numero":"06","classification":"Pierre de transformation","couleur":"Bandes concentriques vert clair à vert foncé presque noir, spirales/anneaux uniques à chaque spécimen","structure":"Anneaux concentriques de carbonates de cuivre ; formée par des eaux souterraines riches en cuivre ; focalise les flux de chakra dispersés","lieu":"Localisation inconnue / aucune découverte confirmée ; cavité souterraine à eau turquoise-verdâtre (cuivre dissous) où Tsuyka a trouvé un échantillon","proprietes":"Transforme les énergies négatives en positives, concentration, libère les blocages émotionnels, évolution et croissance ; lentille énergétique naturelle","usage":"Amulette de méditation, rituel de transformation, renforcement de la volonté, composante de dispositif énergétique (précision, contrôle)","etat_recherche":"Observé","illustrations":[{"full":"illustrations/contenu_recueil_de_min_raux_et_cristaux_malachite.webp","mini":"illustrations/contenu_recueil_de_min_raux_et_cristaux_malachite-mini.webp","legende":"Malachite","credit":{"auteur":"Gaano","licence":"CC BY-SA 3.0","url":"https://commons.wikimedia.org/wiki/File:Malachite2345.jpg","url_article":"https://fr.wikipedia.org/wiki/Malachite"}}]},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"pages 16-18"},"contenu_recueil_de_min_raux_et_cristaux_selenite":{"l":"Sélénite","c":"minéral / cristal","a":{"numero":"07","classification":"Cristal de clarté","couleur":"Translucide incolore/blanc, éclat soyeux, texture fibreuse","lieu":"Désert du Pays du Vent","proprietes":"Laisse passer et diffuse la lumière ; agit comme un soleil","usage":"Miroir lumineux ; avec des miroirs, pourrait absorber et diffuser la lumière comme une sorte de soleil","etat_recherche":"Observé","illustrations":[{"full":"illustrations/contenu_recueil_de_min_raux_et_cristaux_selenite.webp","mini":"illustrations/contenu_recueil_de_min_raux_et_cristaux_selenite-mini.webp","legende":"Sélénite","credit":{"auteur":"Didier Descouens","licence":"CC BY-SA 4.0","url":"https://commons.wikimedia.org/wiki/File:Gypse_Caresse.jpg","url_article":"https://fr.wikipedia.org/wiki/S%C3%A9l%C3%A9nite_(min%C3%A9ral)"}}]},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"pages 19-20"},"contenu_recueil_de_min_raux_et_cristaux_tourmaline_noire":{"l":"Tourmaline noire","c":"minéral / cristal","a":{"numero":"08","classification":"Pierre d'isolation lumineuse / énergétique","couleur":"Opaque noire, longues stries parallèles, éclat vitreux","structure":"Groupe des tourmalines, silicate de bore et d'aluminium, système trigonal, prismes allongés ; formée dans des roches pegmatitiques/métamorphiques riches en bore","lieu":"Grotte souterraine du Pays du Fer ; endroits sombres et difficilement visibles","proprietes":"Absorbe la lumière (absorption totale, puits énergétique), isole les perturbations, très grande résistance physique, stable en milieu extrême, barrière naturelle, neutralise les propriétés des cristaux avoisinants, aucune diffusion","usage":"Isolation thermique et lumineuse, protection contre les interférences énergétiques, renforcement des structures cristallines, barrière de séparation","etat_recherche":"Observé","illustrations":[{"full":"illustrations/contenu_recueil_de_min_raux_et_cristaux_tourmaline_noire.webp","mini":"illustrations/contenu_recueil_de_min_raux_et_cristaux_tourmaline_noire-mini.webp","legende":"Tourmaline noire","credit":{"auteur":"Ivar Leidus","licence":"CC BY-SA 4.0","url":"https://commons.wikimedia.org/wiki/File:Schorl_-_Galil%C3%A9ia,_Minas_Gerais,_Brazil.jpg","url_article":"https://fr.wikipedia.org/wiki/Schorl"}}]},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"pages 21-22"},"contenu_recueil_de_min_raux_et_cristaux_fluorite":{"l":"Fluorite","c":"minéral / cristal","a":{"numero":"09","classification":"Inconnue","couleur":"Multicolore (violet, vert, bleu, jaune) en bandes/dégradés ; structure cubique parfaite, éclat vitreux","lieu":"Grotte au fond du Pays du Fer (amas de cristal hexagonal violacé) ; récolte très compliquée","proprietes":"Réagit aux ondes lumineuses, filtre/module la lumière, grande stabilité, lueur subtile en milieu riche en énergie ; ne stocke ni ne diffuse le chakra mais change de teinte selon la nature du chakra : rouge=Katon, bleu=Suiton, vert=Fûton, orangé=Doton, jaune=Raiton","usage":"Inconnue ; hypothèse : détecteur énergétique primitif, dispositifs optiques de filtrage ou d'analyse avancés","source":"Ouvrages des archives scientifiques de Suna","etat_recherche":"Observé","illustrations":[{"full":"illustrations/contenu_recueil_de_min_raux_et_cristaux_fluorite.webp","mini":"illustrations/contenu_recueil_de_min_raux_et_cristaux_fluorite-mini.webp","legende":"Fluorite","credit":{"auteur":"Didier Descouens","licence":"CC BY-SA 3.0","url":"https://commons.wikimedia.org/wiki/File:Fluorine_MHNT.MIN.2010.16.1.jpg","url_article":"https://fr.wikipedia.org/wiki/Fluorine"}}]},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"pages 23-24"},"contenu_recueil_de_min_raux_et_cristaux_cryolite":{"l":"Cryolite","c":"minéral / cristal","a":{"numero":"10","classification":"Cristal de glace naturel","couleur":"Translucide bleu givré, éclat froid, légère opalescence, surface couverte de givre","structure":"Strates lamellaires hexagonales enchevêtrées canalisant le froid ; formée par des eaux froides riches en minéraux (fluorure, sodium, calcium)","lieu":"Pays du Fer : grottes souterraines humides et froides, près de veines d'eau glaciale","proprietes":"Abaisse la température ambiante, diffuse une énergie froide stable, absorbe la chaleur environnante, stable en milieu froid et humide ; amplifie les techniques de chakra froid","usage":"Cristal refroidissant, régulation de température, conservation de denrées et matériaux, stabilisation thermique de dispositifs","element":"Suiton","risque":"Très faible (aucun effet néfaste connu)","etat_recherche":"Observé","illustrations":[{"full":"illustrations/contenu_recueil_de_min_raux_et_cristaux_cryolite.webp","mini":"illustrations/contenu_recueil_de_min_raux_et_cristaux_cryolite-mini.webp","legende":"Cryolite","credit":{"auteur":"Didier Descouens","licence":"CC BY-SA 3.0","url":"https://commons.wikimedia.org/wiki/File:816-_Ivigtut_-_cryolite.jpg","url_article":"https://fr.wikipedia.org/wiki/Cryolite"}}]},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"pages 25-26"},"contenu_recueil_de_min_raux_et_cristaux_peridot":{"l":"Peridot","c":"minéral / cristal","a":{"numero":"11","classification":"Cristal de croissance naturel","couleur":"Vert vif lumineux, translucide, vitreux ; vert feuille à vert jaune selon la teneur en fer ; groupements rappelant des pousses","structure":"Orthorhombique, silicates (olivine) riches en magnésium et fer","lieu":"Pays des Marais ; régions chaudes et humides ; zones à forte végétation ; près d'eaux stagnantes ou de sols gorgés de minéraux","proprietes":"Favorise la croissance végétale, absorbe et stocke l'énergie tellurique, réagit à l'humidité du sol, renforce les affinités Doton, soutient la régénération des organismes vivants","usage":"Stimulation de la croissance des plantes, maturation des cultures, renforcement des techniques Doton, matrices agricoles, stabilisation des sols, environnements fertiles","element":"Doton","etat_recherche":"Observé, Expérimenté","illustrations":[{"full":"illustrations/contenu_recueil_de_min_raux_et_cristaux_peridot.webp","mini":"illustrations/contenu_recueil_de_min_raux_et_cristaux_peridot-mini.webp","legende":"Peridot","credit":{"auteur":"Robert M. Lavinsky","licence":"CC BY-SA 3.0","url":"https://commons.wikimedia.org/wiki/File:Forsterite-188141.jpg","url_article":"https://fr.wikipedia.org/wiki/P%C3%A9ridot"}}]},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"pages 27-28"},"contenu_recueil_de_min_raux_et_cristaux_fulgurite":{"l":"Fulgurite","c":"minéral / cristal","a":{"numero":"12","classification":"Fossile d'éclair naturel (conducteur naturel)","couleur":"Verre naturel en tubes ramifiés souvent creux, surface vitrifiée poreuse, brun clair à noir","formation":"Fusion du sable/roche siliceuse par la foudre (plusieurs milliers de degrés), refroidissement ultra-rapide","lieu":"Plages et déserts sablonneux, plaines/sols siliceux exposés aux orages, régions orageuses, après impacts de foudre","proprietes":"Excellente conductivité électrique, réagit aux stimulations électriques, émet des micro-impulsions bénéfiques aux systèmes nerveux, favorise la régénération cellulaire et la cicatrisation","usage":"Médecine : régénération des tissus et blessures, stimulation nerveuse, accélère la guérison, base de pâte cicatrisante","observation_microscope":"Très légères impulsions électriques stimulant les terminaisons nerveuses, activant les cellules, réduisant l'inflammation et accélérant la réparation des blessures","illustrations":[{"full":"illustrations/contenu_recueil_de_min_raux_et_cristaux_fulgurite.webp","mini":"illustrations/contenu_recueil_de_min_raux_et_cristaux_fulgurite-mini.webp","legende":"Fulgurite","credit":{"auteur":"Stickpen","licence":"Public domain","url":"https://commons.wikimedia.org/wiki/File:Fulgurites-algeria.jpg","url_article":"https://fr.wikipedia.org/wiki/Fulgurite"}}]},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"pages 29-30"},"contenu_recueil_de_min_raux_et_cristaux_pate_regeneratrice":{"l":"Recette de la pâte régénératrice (Fulgurite)","c":"recette","a":{"ingredients":"Pierre concassée en poudre, fulgurite moulue, eau pure, sève de pin, lavande broyée","mode_utilisation":"Appliquer en fine couche sur la plaie propre ; renouveler régulièrement jusqu'à cicatrisation complète ; conserver dans un récipient hermétique à l'abri de la lumière"},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"page 29"},"contenu_recueil_de_min_raux_et_cristaux_pierres_precieuses":{"l":"Pierres précieuses (Étude à Suna)","c":"concept","a":{"description":"Cinq minéraux non répertoriés à Konoha découverts par Tsuyka à la bibliothèque de Suna ; très rares, trésor naturel à affinité chakratique exceptionnelle ; affinité élémentaire supérieure aux cristaux classiques ; renforcent le chakra ou servent de catalyseurs élémentaires ; grande valeur pour la recherche et les armes ninja."},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"page 31"},"contenu_recueil_de_min_raux_et_cristaux_rubis":{"l":"Rubis","c":"pierre précieuse","a":{"element":"Katon","proprietes":"Rouge écarlate ; chaleur naturelle ; amplifie l'affinité Feu et la puissance des techniques Katon","rarete":"Très rare","illustrations":[{"full":"illustrations/contenu_recueil_de_min_raux_et_cristaux_rubis.webp","mini":"illustrations/contenu_recueil_de_min_raux_et_cristaux_rubis-mini.webp","legende":"Rubis","credit":{"auteur":"Auteur inconnu","licence":"Public domain","url":"https://commons.wikimedia.org/wiki/File:Ruby_cristal.jpg","url_article":"https://fr.wikipedia.org/wiki/Rubis"}}]},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"page 31"},"contenu_recueil_de_min_raux_et_cristaux_saphir":{"l":"Saphir","c":"pierre précieuse","a":{"element":"Suiton","proprietes":"Bleu profond comme l'océan ; renforce la maîtrise du chakra Suiton et la fluidité des techniques d'eau","rarete":"Très rare","illustrations":[{"full":"illustrations/contenu_recueil_de_min_raux_et_cristaux_saphir.webp","mini":"illustrations/contenu_recueil_de_min_raux_et_cristaux_saphir-mini.webp","legende":"Saphir","credit":{"auteur":"Robert M. Lavinsky","licence":"CC BY-SA 3.0","url":"https://commons.wikimedia.org/wiki/File:Corundum-188152.jpg","url_article":"https://fr.wikipedia.org/wiki/Saphir"}}]},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"page 31"},"contenu_recueil_de_min_raux_et_cristaux_emeraude":{"l":"Émeraude","c":"pierre précieuse","a":{"element":"Futon","proprietes":"Verte aux veines mystérieuses ; accroît l'affinité Vent, vitesse, légèreté, perception du chakra","rarete":"Très rare","illustrations":[{"full":"illustrations/contenu_recueil_de_min_raux_et_cristaux_emeraude.webp","mini":"illustrations/contenu_recueil_de_min_raux_et_cristaux_emeraude-mini.webp","legende":"Émeraude","credit":{"auteur":"Didier Descouens","licence":"CC BY-SA 3.0","url":"https://commons.wikimedia.org/wiki/File:(Muzo)_Emerald_crystal_in_its_matrix.jpg","url_article":"https://fr.wikipedia.org/wiki/%C3%89meraude"}}]},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"page 31"},"contenu_recueil_de_min_raux_et_cristaux_topaze":{"l":"Topaze","c":"pierre précieuse","a":{"element":"Raiton","proprietes":"Jaune doré translucide ; amplifie l'affinité Foudre, conductivité du chakra, vitesse et puissance Raiton","rarete":"Très rare","illustrations":[{"full":"illustrations/contenu_recueil_de_min_raux_et_cristaux_topaze.webp","mini":"illustrations/contenu_recueil_de_min_raux_et_cristaux_topaze-mini.webp","legende":"Topaze","credit":{"auteur":"Didier Descouens","licence":"CC BY-SA 3.0","url":"https://commons.wikimedia.org/wiki/File:Topaze_Br%C3%A9sil.jpg","url_article":"https://fr.wikipedia.org/wiki/Topaze_(min%C3%A9ral)"}}]},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"page 31"},"contenu_recueil_de_min_raux_et_cristaux_onyx":{"l":"Onyx","c":"pierre précieuse","a":{"element":"Doton","proprietes":"Brune à strates profondes ; renforce stabilité, défense et puissance des techniques Doton","rarete":"Très rare","illustrations":[{"full":"illustrations/contenu_recueil_de_min_raux_et_cristaux_onyx.webp","mini":"illustrations/contenu_recueil_de_min_raux_et_cristaux_onyx-mini.webp","legende":"Onyx","credit":{"auteur":"Simon Eugster --Simon 14:41, 11 April 2006 (UTC)","licence":"CC BY-SA 3.0","url":"https://commons.wikimedia.org/wiki/File:Onyx.jpg","url_article":"https://fr.wikipedia.org/wiki/Onyx_(min%C3%A9ral)"}}]},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"page 31"},"contenu_recueil_de_min_raux_et_cristaux_zone_tropicale_artificielle":{"l":"Application climatique : zone tropicale artificielle","c":"concept","a":{"description":"Citrine alimentée en Katon (production de chaleur stable) + Lapis-Lazuli alimenté en Suiton (maintien d'une humidité élevée) = environnement tropical contrôlé (microclimat artificiel). Limites : nécessite des spécialistes de chaque nature élémentaire ; Doton, Fûton, Raiton restent à tester.","rationale":"Ouvrirait la voie à des matrices climatiques capables de reproduire artificiellement des conditions environnementales."},"s":"sources/ouvrages/recueil-mineraux-cristaux-tsuyka-itsuri.pdf","p":"page 32"},"projet_protheses_de_main":{"l":"Prothèses de main","c":"projet","a":{"statut":"Complété","description":"L'objectif était de créer des modèles simples, fiables et rapidement adaptables, permettant à un shinobi blessé de retrouver une certaine autonomie sans devoir attendre la fabrication d'une prothèse entièrement personnalisée. J'ai donc travaillé sur leur structure, leurs articulations et leur système de fixation afin qu'elles puissent être adaptées à différents utilisateurs.","structure":"Structure légère et résistante en alliage de métal et de carbone ; articulations renforcées pour la fluidité et la précision des mouvements ; système de fixation confortable et ajustable (sangle).","proprietes":"Embouts texturés (meilleure prise et précision), articulations mobiles (mouvement naturel et fluide), capteurs intégrés (retour de position et de pression). Flexibilité optimale, résistance accrue pour un usage intensif, confort d'utilisation, fixation sécurisée, design discret adapté à la vie de shinobi.","couleur":"Alliage de métal (structure), carbone (renfort), tissu technique (confort) ; blanc mat (protection), noir mat (discrétion), bleu lumineux (indicateurs).","resultat":"Deux modèles finaux : une main droite et une main gauche, capables de saisir un objet (kunaï).","illustrations":[{"full":"actualites/prothese-main-droite-shiro.webp","mini":"actualites/prothese-main-droite-shiro-mini.webp","legende":"Planche complète — Prothèses de main : les modèles finaux","w":1254,"h":1254,"article":"article_protheses_de_main"}]},"s":"sources/actualites/prothese-main-droite-shiro.png","p":null},"plante_ginseng":{"l":"Ginseng","c":"plante","a":{"type":"Herbacée","taille":"30 à 50 cm","lieu":"Aux abords de la forêt Interdite, à l'ombre","description":"Élancé et discret. Racine charnue et tubérisée, à la forme humanoïde caractéristique.","morphologie":{"feuilles":"Les feuilles sont réunies en cercle (en verticille) tout au sommet de la tige. De forme ovale et dentées.","fleurs":"Petites fleurs verdâtres, discrètes, regroupées en ombelle au centre du bouquet de feuilles.","fruits":"Baies rouges à maturité contenant de petites graines globuleuses et lisses.","tiges":"Tige principale unique, dressée, lisse et non ramifiée.","racines":"Racine pivotante, charnue et tubérisée. Couleur blanc crème à jaune clair, à la forme caractéristique rappelant une silhouette humaine.","couleurs":"La racine présente un teint jaune ambré. Feuilles vert foncé, baies rouges à maturité.","odeur":"Terreuse, boisée et légèrement sucrée.","texture":"Texture mince et membraneuse, douce au toucher"},"habitat":{"environnement":"Sous-bois ombragés, dans les zones humides et à l'abri du soleil direct.","sol":"Sol riche en matière organique, humide et bien drainé.","climat":"Climat tempéré et humide. Plante présente surtout dans les zones fraîches et ombragées.","altitude":"Plutôt en basse à moyenne altitude.","voisinage":"Mousses, fougères, arbustes de sous-bois.","remarques":"Semble rare. Pousse à l'ombre, souvent près de cours d'eau ou en terrain humide."},"affinite_chakra":{"reaction":"Oui","natures":"Autre : Yang","reactions":"Légère intensification de la vitalité physique après consommation. Effet notable sur la concentration corporelle, peu d'effet sur le chakra mental.","hypotheses":"La plante semble favoriser la production d'énergie physique, en lien avec la composante Yang du chakra.","precautions":"Éviter les surdosages (risque d'agitation et de surchauffe)."},"usages":"Stimulant naturel. Améliore l'endurance et aide à supporter l'effort physique prolongé. Peut être séchée et concentrée pour être intégrée dans des préparations médicinales (ex : pilule énergétique).","effets":"Regain d'énergie, fatigue plus tardive, meilleure récupération physique. Pas de restauration directe des réserves de chakra, mais permet de continuer l'effort plus longtemps.","dangerosite":"Aucune connue","dangers":"Sûr en consommation modérée. Un excès peut provoquer agitation, chaleur et inconfort.","experiences":["09/09/26 — Test cutané (racine fraîche) : Aucune irritation. Conclusion : Non irritant.","09/09/26 — Infusion faible (1 dose) : Léger regain d'énergie. Conclusion : Effet stimulant léger.","09/09/26 — Exercice physique (témoin) : Fatigue normale. Conclusion : Base de comparaison.","09/09/26 — Exercice après infusion : Endurance augmentée. Conclusion : Effet confirmé.","09/09/26 — Test après dépense de chakra : Meilleure résistance physique. Conclusion : Pas de récupération directe.","09/09/26 — Dose plus élevée (extrait concentré) : Agitation, chaleur. Conclusion : Éviter le surdosage."],"notes":"Plante précieuse. Son effet sur l'endurance en fait un ingrédient de choix pour les missions longues. La racine séchée se conserve bien et pourrait être intégrée dans une ration compacte type pilule. Poursuivre les tests pour déterminer le dosage idéal et la durée des effets.","conclusion":"Le ginseng est une plante sûre (en usage modéré) aux propriétés stimulantes. Il améliore l'endurance physique et semble favoriser la production d'énergie corporelle (Yang), sans restaurer directement le chakra. Son séchage et sa concentration en font un ingrédient prometteur pour la fabrication de pilules énergétiques, comme la Hyôrôgan.","decouverte":"04/09/2026 — Akira Kaito","illustrations":[{"full":"actualites/rapport-botanique-akira-ginseng.webp","mini":"actualites/rapport-botanique-akira-ginseng-mini.webp","legende":"Planche complète — Rapport botanique : Ginseng","w":1055,"h":1491,"article":"article_rapport_botanique_ginseng"}]},"s":"sources/actualites/rapport-botanique-akira-ginseng.png","p":null},"plante_epinard_sauvage":{"l":"Épinard sauvage","c":"plante","a":{"type":"Herbacée","taille":"20 à 80 cm","description":"Plante herbacée à tige dressée. Port compact à la base, devenant plus élancé avec la floraison. Tiges robustes et légèrement cannelées. Racines fines mais profondes. La plante dégage une grande vitalité, même dans un sol pauvre.","morphologie":{"feuilles":"Hastée à sagittée. Épaisses, nervures bien marquées, d'un vert profond.","fleurs":"Petites fleurs verdâtres (environ 3 à 5 mm), regroupées en un épi discret au sommet de la tige.","fruits":"Akène sec, de petite taille, contenu dans un calice persistant.","tiges":"Tige unique, robuste, légèrement cannelée, devenant plus rigide avec la maturité.","racines":"Système racinaire pivotant, s'enfonçant profondément dans le sol, avec plusieurs racines secondaires.","couleurs":"Verte","odeur":"Odeur subtile d'herbe fraîche, légèrement terreuse.","texture":"Feuilles épaisses, rugueuses, au toucher légèrement farineux."},"habitat":{"environnement":"Berges de rivières, champs et zones où le sol est riche et humide. Plante souvent observée dans des terrains en friche.","sol":"Sol riche en matière organique, humide et bien drainé.","climat":"Supporte bien les climats tempérés. Semble moins présente dans les zones très froides ou arides.","altitude":"Plutôt en basse à moyenne altitude.","voisinage":"Graminées, plantes aquatiques, orties, herbes sauvages.","remarques":"Plante commune mais parfois difficile à repérer en dehors de la floraison."},"affinite_chakra":{"reaction":"Oui","reactions":"La plante réagit légèrement au chakra, ses feuilles semblent plus toniques lors d'un apport modéré.","hypotheses":"Semble stocker une forme d'énergie naturelle qu'il est possible de libérer par préparation (cuisson, concentration).","precautions":"Aucune en manipulation classique, mais les préparations concentrées peuvent avoir des effets puissants sur l'organisme."},"usages":"Stimulant physique, ingrédient pour préparation énergétique. Peut également être consommée comme légume (riche en nutriments).","effets":"Augmentation notable de la force physique. Aucun effet direct sur les réserves de chakra. Provoque des douleurs musculaires et des crampes après utilisation, plus marquées à forte dose.","dangerosite":"Moyenne","dangers":"À utiliser avec précaution. Les effets secondaires peuvent être invalidants.","experiences":["09/09/26 — Contact cutané (feuille écrasée) : Aucune irritation. Conclusion : Non irritant.","09/09/26 — Consommation légère (feuilles cuites) : Aucun effet notable. Conclusion : Comestible sans danger.","09/09/26 — Exercice physique (témoin) : Fatigue normale. Conclusion : Base de comparaison.","09/09/26 — Consommation modérée : Légère augmentation de force. Conclusion : Effet visible.","09/09/26 — Consommation concentrée : Forte augmentation de force. Conclusion : Effet puissant.","09/09/26 — Après l'effort (suivi) : Crampes et douleurs musculaires. Conclusion : Effets secondaires importants.","13/09/26 — Test sur le chakra : Aucun gain notable. Conclusion : Effet surtout physique."],"notes":"Plante très intéressante. Les effets sont rapides et d'une grande ampleur sur la force physique, mais le contre-coup sur les muscles est important. Il faudra trouver un dosage précis pour profiter de ses bienfaits sans provoquer de dégâts. Une préparation plus stable (poudre, concentré) pourrait être envisagée pour un usage en situation de combat ou d'effort intense.","conclusion":"L'épinard sauvage est une plante aux propriétés stimulantes remarquables. Une préparation concentrée permet d'augmenter fortement la force physique, probablement en libérant l'énergie stockée dans la plante. Les effets secondaires (crampes, douleurs musculaires) imposent une grande prudence quant à son utilisation.","decouverte":"05/09/2026 — Akira Kaito","illustrations":[{"full":"actualites/rapport-botanique-akira-epinard-sauvage.webp","mini":"actualites/rapport-botanique-akira-epinard-sauvage-mini.webp","legende":"Planche complète — Rapport botanique : Épinard sauvage","w":1055,"h":1491,"article":"article_rapport_botanique_epinard_sauvage"}]},"s":"sources/actualites/rapport-botanique-akira-epinard-sauvage.png","p":null},"plante_fleur_de_cerisier":{"l":"Fleur de cerisier","c":"plante","a":{"nom_scientifique":"Prunus sp. (variété inconnue)","type":"Arborescente","taille":"6 à 8 mètres","lieu":"Pays des Cerisiers","description":"Le cerisier a généralement un port arrondi, étalé ou évasé avec un tronc court.","morphologie":{"feuilles":"Les feuilles sont caduques et mesurent entre 5 et 12 cm de long.","fleurs":"Elles apparaissent au début du printemps, elles peuvent être simples et avoir 5 pétales ou alors doubles et avoir plus de 30 pétales.","fruits":"Ce sont des cerises miniatures de couleur rouge jusqu'à noir pourpre une fois à maturité.","tiges":"L'écorce est lisse et brillante de couleur brun-rouge.","racines":"Le système racinaire a l'air assez étendu et on peut voir les racines principales qui s'étalent horizontalement près de la surface du sol plutôt que de descendre.","couleurs":"Le rose des fleurs","odeur":"Odeur très discrète ou même imperceptible.","texture":"Les feuilles sont très lisses et dentées sur les bords."},"habitat":{"environnement":"Bords du lac et zones humides de la région.","sol":"Sol riche et humifère.","climat":"Climat tempéré à frais pouvant supporter le gel.","altitude":"Basse altitude.","voisinage":"Autres cerisiers, plantes aquatiques, herbes basses.","remarques":"Pousse en grande quantité près de l'eau."},"affinite_chakra":{"reaction":"Non","reactions":"Aucune réaction notable lors du contact direct ou d'une infusion.","hypotheses":"La plante pourrait réagir seulement après transformation (extrait, onguent) ou en combinaison avec du chakra médical.","precautions":"Aucune à ce stade."},"usages":"Potentiel médicinal (à confirmer), usage décoratif, attire certains insectes pollinisateurs.","effets":"Aucun effet direct observé
