<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#356A84">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="Recueil scientifique de la Scientifique de Konoha : pôles, membres, herbier, minéralogie, pharmacopée, missions et organigramme.">
<title>Recueil de la Scientifique</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recueil">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap">
<style>
/* ================================================================
   TOKENS — sources/design (Implementation/css-variables.md + DECISIONS.md)
   Texte courant : --color-text, --color-text-secondary, --link (primary-dark), --link-accent (accent-dark)
   Primaire / accent : titres ≥ 24px, icônes, bordures. Liquide : décor uniquement.
   ================================================================ */
:root {
  --color-primary: #4A90A4; --color-primary-dark: #356A84; --color-primary-light: #B3D9E8;
  --color-accent: #2A9D8F; --color-accent-dark: #1E7066; --color-accent-light: #A9DFD0;
  --color-liquid: #5EC997; --color-liquid-light: #A9E6C8; --color-leaf: #27AE60;
  --color-text: #1A2332; --color-text-secondary: #6B7280; --color-text-tertiary: #D1D5DB;
  --color-background: #FFFFFF; --color-bg-secondary: #F9FAFB; --color-bg-tertiary: #F3F4F6;
  --link: var(--color-primary-dark); --link-accent: var(--color-accent-dark);
  --warn: #B45309; --warn-bg: #FEF3C7;
  --font-family-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-family-mono: 'Roboto Mono', 'Courier New', monospace;
  --font-size-h1: 48px; --font-weight-h1: 700; --line-height-h1: 1.2;
  --font-size-h2: 32px; --font-weight-h2: 600; --line-height-h2: 1.3;
  --font-size-h3: 24px; --font-weight-h3: 600; --line-height-h3: 1.4;
  --font-size-body: 16px; --line-height-body: 1.6;
  --font-size-small: 13px; --line-height-small: 1.5;
  --font-size-mono: 12px;
  --spacing-xs: 4px; --spacing-sm: 8px; --spacing-md: 16px; --spacing-lg: 24px;
  --spacing-xl: 32px; --spacing-2xl: 48px; --spacing-3xl: 64px;
  --size-icon-sm: 16px; --size-icon-md: 24px; --size-icon-lg: 32px; --size-icon-xl: 48px;
  --shadow-sm: 0 1px 2px 0 rgba(0,0,0,.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -2px rgba(0,0,0,.05);
  --border-radius-sm: 4px; --border-radius-md: 8px; --border-radius-lg: 12px;
  --border-width: 1px; --border-color: #E5E7EB;
  --transition-fast: 150ms ease-in-out; --transition-base: 300ms ease-in-out;
  --z-index-sticky: 1020; --z-index-fixed: 1030; --z-index-popover: 1050;
  --line: #B3D9E8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-primary: #7CB3D4; --color-accent: #4EBFA0; --color-liquid: #6BDAA8;
    --color-text: #F3F4F6; --color-text-secondary: #D1D5DB;
    --color-background: #1A1A1A; --color-bg-secondary: #2D2D2D; --color-bg-tertiary: #3F3F3F;
    --border-color: #4B5563; --link: #7CB3D4; --link-accent: #4EBFA0; --line: #4B6B80;
    --warn: #FBBF24; --warn-bg: #3B2F12;
  }
}
:root[data-theme="dark"] {
  --color-primary: #7CB3D4; --color-accent: #4EBFA0; --color-liquid: #6BDAA8;
  --color-text: #F3F4F6; --color-text-secondary: #D1D5DB;
  --color-background: #1A1A1A; --color-bg-secondary: #2D2D2D; --color-bg-tertiary: #3F3F3F;
  --border-color: #4B5563; --link: #7CB3D4; --link-accent: #4EBFA0; --line: #4B6B80;
  --warn: #FBBF24; --warn-bg: #3B2F12;
}
@media (prefers-contrast: more) { :root { --color-primary: #0A5A7A; --color-accent: #0B6F5F; } }
@media (prefers-reduced-motion: reduce) { :root { --transition-fast: 0ms; --transition-base: 0ms; } }

/* ================================================================ BASE */
* { box-sizing: border-box; }
html { scroll-padding-top: 80px; }
body { margin: 0; background: var(--color-bg-secondary); color: var(--color-text);
  font: 400 var(--font-size-body)/var(--line-height-body) var(--font-family-primary); }
a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { color: var(--link-accent); }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; border-radius: var(--border-radius-sm); }
h1 { font-size: var(--font-size-h1); font-weight: var(--font-weight-h1); line-height: var(--line-height-h1); margin: 0 0 var(--spacing-md); }
h2 { font-size: var(--font-size-h2); font-weight: var(--font-weight-h2); line-height: var(--line-height-h2); color: var(--color-primary); margin: var(--spacing-2xl) 0 var(--spacing-lg); }
h3 { font-size: var(--font-size-h3); font-weight: var(--font-weight-h3); line-height: var(--line-height-h3); color: var(--color-primary); margin: var(--spacing-xl) 0 var(--spacing-md); }
h4 { font-size: 18px; font-weight: 600; margin: var(--spacing-lg) 0 var(--spacing-sm); }
p { margin: 0 0 var(--spacing-md); }
.mono { font-family: var(--font-family-mono); font-size: var(--font-size-mono); font-weight: 500; }
.small { font-size: var(--font-size-small); line-height: var(--line-height-small); }
.muted { color: var(--color-text-secondary); }

/* ================================================================ LAYOUT */
.topbar { position: sticky; top: 0; z-index: var(--z-index-sticky); display: flex; align-items: center; gap: var(--spacing-md);
  padding: var(--spacing-sm) var(--spacing-lg); background: var(--color-background); border-bottom: var(--border-width) solid var(--border-color); box-shadow: var(--shadow-sm); }
.brand { display: flex; align-items: center; gap: var(--spacing-sm); color: var(--color-text); text-decoration: none; font-weight: 700; white-space: nowrap; }
.brand img { width: 40px; height: 40px; }
.brand span small { display: block; font-weight: 400; font-size: var(--font-size-small); color: var(--color-text-secondary); }
.search { position: relative; flex: 1; min-width: 0; max-width: 560px; margin-left: auto; }
.search input { width: 100%; padding: 10px 14px 10px 38px; font: inherit; font-size: 15px; color: var(--color-text);
  background: var(--color-bg-secondary); border: var(--border-width) solid var(--border-color); border-radius: var(--border-radius-md); }
.search input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-light); }
.search::before { content: ""; position: absolute; left: 13px; top: 50%; width: 12px; height: 12px; margin-top: -8px;
  border: 2px solid var(--color-text-secondary); border-radius: 50%; }
.search::after { content: ""; position: absolute; left: 24px; top: 50%; width: 6px; height: 2px; margin-top: 4px; background: var(--color-text-secondary); transform: rotate(45deg); }
.suggest { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: var(--z-index-popover); display: none;
  background: var(--color-background); border: var(--border-width) solid var(--border-color); border-radius: var(--border-radius-md); box-shadow: var(--shadow-lg); max-height: 70vh; overflow: auto; }
.suggest.open { display: block; }
.suggest a { display: flex; justify-content: space-between; gap: var(--spacing-md); padding: 10px 14px; text-decoration: none; color: var(--color-text); }
.suggest a:hover, .suggest a.sel { background: var(--color-bg-tertiary); }
.iconbtn { flex: none; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; font-size: 18px;
  color: var(--color-text); background: var(--color-background); border: var(--border-width) solid var(--border-color); border-radius: var(--border-radius-md); }
.iconbtn:hover { border-color: var(--color-primary); }
#menuBtn { display: none; }
.depotbtn { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; font-size: 14px; text-decoration: none; white-space: nowrap;
  color: #fff; background: #356A84; border-radius: var(--border-radius-md); }
.depotbtn:hover { background: #2b5669; color: #fff; }
.depotbtn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
.depotbtn span { font-size: 18px; line-height: 1; }
.depotbtn[aria-current="page"] { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .55); }
.layout { display: grid; grid-template-columns: 264px 1fr; min-height: calc(100vh - 57px); }
.sidebar { position: sticky; top: 57px; align-self: start; height: calc(100vh - 57px); overflow-y: auto; padding: var(--spacing-md);
  background: var(--color-background); border-right: var(--border-width) solid var(--border-color); }
.sidebar h6 { margin: var(--spacing-md) var(--spacing-sm) var(--spacing-xs); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); }
.sidebar a { display: flex; align-items: center; gap: var(--spacing-sm); padding: 6px var(--spacing-sm); border-radius: var(--border-radius-md);
  color: var(--color-text); text-decoration: none; font-size: 14px; }
.sidebar a img { width: 20px; height: 20px; }
.sidebar a .n { margin-left: auto; font-size: 12px; color: var(--color-text-secondary); }
.sidebar a:hover { background: var(--color-bg-tertiary); }
.sidebar a.active { background: var(--color-bg-tertiary); color: var(--link); font-weight: 600; box-shadow: inset 3px 0 0 var(--color-primary); }
main { min-width: 0; padding: var(--spacing-xl) var(--spacing-xl) var(--spacing-3xl); }
.wrap { max-width: 1120px; margin: 0 auto; }
.wide { max-width: none; }

/* ================================================================ COMPOSANTS */
.crumbs { font-size: var(--font-size-small); color: var(--color-text-secondary); margin-bottom: var(--spacing-md); }
.crumbs a { color: var(--color-text-secondary); }
.card { position: relative; background: var(--color-background); border: var(--border-width) solid var(--border-color);
  border-radius: var(--border-radius-lg); padding: var(--spacing-lg); box-shadow: var(--shadow-sm); }
.card.accent { padding-left: calc(var(--spacing-lg) + 4px); overflow: hidden; }
.card.accent::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--color-liquid); }
a.card { display: block; color: inherit; text-decoration: none; transition: box-shadow var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast); }
a.card:hover { box-shadow: var(--shadow-lg); border-color: var(--color-primary); transform: translateY(-2px); }
a.card h4 { margin-top: 0; color: var(--link); }
.grid { display: grid; gap: var(--spacing-md); grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.grid.sm { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.grid.lg { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; font-size: 12px; font-weight: 500; white-space: nowrap;
  color: var(--color-text); background: var(--color-bg-tertiary); border-radius: 999px; text-decoration: none; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--color-primary)); }
a.chip:hover { color: var(--color-text); box-shadow: inset 0 0 0 1px var(--color-primary); }
.badge { display: inline-block; padding: 2px 10px; border-radius: var(--border-radius-sm); font-size: 12px; font-weight: 600; }
.badge.ouvert { color: var(--link-accent); background: color-mix(in srgb, var(--color-accent) 14%, transparent); }
.badge.clos { color: var(--color-text-secondary); background: var(--color-bg-tertiary); }
.badge.warn { color: var(--warn); background: var(--warn-bg); }
.tag { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: var(--border-radius-sm); margin-left: 4px; vertical-align: 1px; }
.tag.inf { color: var(--color-text-secondary); border: 1px dashed var(--color-text-secondary); }
.tag.amb { color: var(--warn); border: 1px dashed var(--warn); }
.hero { position: relative; overflow: hidden; border-radius: var(--border-radius-lg); padding: var(--spacing-2xl) var(--spacing-xl);
  background: var(--color-background); border: var(--border-width) solid var(--border-color); box-shadow: var(--shadow-md); }
.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .15;
  background-image: radial-gradient(circle, var(--color-accent) 1.5px, transparent 1.5px); background-size: 40px 40px; }
.hero > * { position: relative; z-index: 1; }
.hero .logo { width: 96px; height: 96px; float: right; margin-left: var(--spacing-lg); }
.hero .lead { font-size: 19px; color: var(--color-text-secondary); max-width: 720px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: var(--spacing-sm); margin-top: var(--spacing-lg); }
.stat { display: block; padding: var(--spacing-md); border-radius: var(--border-radius-md); background: var(--color-bg-secondary); border: var(--border-width) solid var(--border-color); text-decoration: none; color: var(--color-text); }
.stat b { display: block; font-size: 28px; line-height: 1.1; color: var(--color-primary); }
.stat:hover { border-color: var(--color-primary); }
.pole-head { display: flex; gap: var(--spacing-lg); align-items: flex-start; }
.pole-head img { width: 96px; height: 96px; flex: none; }
.pole-card { display: flex; gap: var(--spacing-md); }
.pole-card img { width: 48px; height: 48px; flex: none; }
dl.attrs { display: grid; grid-template-columns: minmax(140px, 200px) 1fr; gap: var(--spacing-sm) var(--spacing-lg); margin: 0; }
dl.attrs dt { font-weight: 600; color: var(--color-text-secondary); font-size: 14px; }
dl.attrs dd { margin: 0; }
dl.attrs dd p:last-child { margin-bottom: 0; }
.rels { columns: 2 320px; column-gap: var(--spacing-xl); }
.rel { break-inside: avoid; margin-bottom: var(--spacing-md); }
.rel h5 { margin: 0 0 var(--spacing-xs); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-secondary); }
.rel ul { margin: 0; padding: 0; list-style: none; }
.rel li { padding: 2px 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: var(--spacing-sm); align-items: center; margin: var(--spacing-md) 0 var(--spacing-lg); }
.toolbar input, .toolbar select { font: inherit; font-size: 14px; padding: 8px 12px; color: var(--color-text); background: var(--color-background);
  border: var(--border-width) solid var(--border-color); border-radius: var(--border-radius-md); }
.toolbar input { min-width: 240px; flex: 1; max-width: 360px; }
.toolbar .count { margin-left: auto; font-size: var(--font-size-small); color: var(--color-text-secondary); }
table { width: 100%; border-collapse: collapse; background: var(--color-background); border: var(--border-width) solid var(--border-color); border-radius: var(--border-radius-lg); overflow: hidden; }
th, td { text-align: left; padding: 10px 14px; border-bottom: var(--border-width) solid var(--border-color); vertical-align: top; font-size: 14px; }
th { background: var(--color-bg-tertiary); font-weight: 600; font-size: 13px; cursor: default; }
th[data-sort] { cursor: pointer; }
th[data-sort]:hover { color: var(--link); }
tr:last-child td { border-bottom: 0; }
.bar { height: 8px; border-radius: 4px; background: var(--color-bg-tertiary); min-width: 80px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--color-liquid); }
.snip { color: var(--color-text-secondary); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: var(--spacing-sm) 0 0; }
.kv { font-size: 13px; margin-top: var(--spacing-xs); }
.kv b { font-weight: 600; color: var(--color-text-secondary); }
.letters { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: var(--spacing-lg); position: sticky; top: 57px; z-index: 5; padding: var(--spacing-sm) 0; background: var(--color-bg-secondary); }
.letters a { min-width: 32px; text-align: center; padding: 4px 6px; border-radius: var(--border-radius-sm); background: var(--color-background); border: var(--border-width) solid var(--border-color); text-decoration: none; font-weight: 600; }
.cols { columns: 3 260px; column-gap: var(--spacing-xl); }
.cols li { break-inside: avoid; }
.prose { max-width: 820px; white-space: pre-line; }
.callout { padding: var(--spacing-md) var(--spacing-lg); border-radius: var(--border-radius-md); background: var(--color-bg-tertiary); border-left: 4px solid var(--color-primary); }
.callout.warn { background: var(--warn-bg); border-left-color: var(--warn); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-lg); }
.empty { padding: var(--spacing-xl); text-align: center; color: var(--color-text-secondary); border: 2px dashed var(--border-color); border-radius: var(--border-radius-lg); }
.ext::after { content: " ↗"; }
section + section { margin-top: var(--spacing-lg); }

/* ================================================================ ORGANIGRAMME */
.org-tools { display: flex; flex-wrap: wrap; gap: var(--spacing-sm); align-items: center; margin-bottom: var(--spacing-md); }
.org-tools button { font: inherit; font-size: 14px; padding: 8px 14px; cursor: pointer; color: var(--color-text); background: var(--color-background);
  border: var(--border-width) solid var(--border-color); border-radius: var(--border-radius-md); }
.org-tools button:hover { border-color: var(--color-primary); }
.org-tools input { font: inherit; font-size: 14px; padding: 8px 12px; min-width: 260px; color: var(--color-text); background: var(--color-background); border: var(--border-width) solid var(--border-color); border-radius: var(--border-radius-md); }
.org-viewport { height: 72vh; overflow: auto; cursor: grab; border: var(--border-width) solid var(--border-color); border-radius: var(--border-radius-lg);
  background-color: var(--color-background); background-image: radial-gradient(circle, color-mix(in srgb, var(--color-accent) 22%, transparent) 1.2px, transparent 1.2px); background-size: 32px 32px; }
.org-viewport.drag { cursor: grabbing; user-select: none; }
.org-canvas { transform-origin: 0 0; padding: var(--spacing-xl); width: max-content; }
.tree ul { position: relative; display: flex; justify-content: center; margin: 0; padding: 28px 0 0; }
.tree > ul { padding-top: 0; }
.tree li { position: relative; list-style: none; padding: 28px 10px 0; display: flex; flex-direction: column; align-items: center; }
.tree li::before, .tree li::after { content: ""; position: absolute; top: 0; right: 50%; width: 50%; height: 28px; border-top: 2px solid var(--line); }
.tree li::after { right: auto; left: 50%; border-left: 2px solid var(--line); }
.tree li:only-child::before, .tree li:only-child::after { display: none; }
.tree li:only-child { padding-top: 0; }
.tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
.tree li:last-child::before { border-right: 2px solid var(--line); border-radius: 0 8px 0 0; }
.tree li:first-child::after { border-radius: 8px 0 0 0; }
.tree ul ul::before { content: ""; position: absolute; top: 0; left: 50%; height: 28px; border-left: 2px solid var(--line); }
.tree > ul > li { padding-top: 0; }
.onode { position: relative; z-index: 1; min-width: 180px; max-width: 280px; padding: 12px 14px; text-align: left; background: var(--color-background);
  border: 2px solid var(--border-color); border-radius: var(--border-radius-lg); box-shadow: var(--shadow-md); }
.onode .t { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--color-text-secondary); font-weight: 600; }
.onode .h { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; margin: 2px 0 6px; }
.onode .h img { width: 32px; height: 32px; }
.onode.root { border-color: var(--color-primary); text-align: center; min-width: 260px; }
.onode.root img { width: 72px; height: 72px; display: block; margin: 0 auto 6px; }
.onode.dir { border-color: var(--color-primary); }
.onode.dom { border-color: var(--color-accent); background: color-mix(in srgb, var(--color-accent) 7%, var(--color-background)); }
.onode.pole { border-top: 6px solid var(--color-liquid); width: 230px; }
.onode.vide { border-style: dashed; box-shadow: none; }
.tree .onode ul.p { display: block; list-style: none; margin: 4px 0 0; padding: 0; font-size: 13px; }
.tree .onode ul.p::before { display: none; }
.onode ul.p li { padding: 1px 0; display: block; }
.onode ul.p li::before, .onode ul.p li::after { display: none; }
.op { color: var(--color-text); text-decoration: none; border-radius: 4px; padding: 0 3px; margin: 0 -3px; }
.op:hover { color: var(--link); text-decoration: underline; }
.op.hl, .op.found { background: color-mix(in srgb, var(--color-liquid) 45%, transparent); color: var(--color-text); }
.op .r { font-size: 11px; color: var(--color-text-secondary); margin-left: 4px; }
.chef { font-weight: 600; }
.org-side { display: grid; gap: var(--spacing-md); grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); margin-top: var(--spacing-lg); }
.ladder li { display: flex; gap: 8px; align-items: baseline; }
.ladder .lv { flex: none; width: 92px; font-weight: 700; color: var(--link); }

/* ================================================================ RESPONSIVE */
@media (max-width: 1024px) {
  .layout { grid-template-columns: 1fr; }
  #menuBtn { display: grid; }
  .sidebar { position: fixed; z-index: var(--z-index-fixed); top: 57px; left: 0; width: 280px; transform: translateX(-100%); transition: transform var(--transition-base); box-shadow: var(--shadow-lg); }
  .sidebar.open { transform: none; }
  main { padding: var(--spacing-lg) var(--spacing-md) var(--spacing-2xl); }
}
@media (max-width: 640px) {
  .brand span { display: none; }
  .depotbtn { width: 40px; padding: 0; justify-content: center; }
  .topbar { gap: var(--spacing-sm); }

ifs","w":1024,"h":1536,"article":"article_catalogue_protheses_shinobi"},{"full":"actualites/prothese-main-droite-shiro.webp","mini":"actualites/prothese-main-droite-shiro-mini.webp","legende":"Planche complète — Prothèses de main : les modèles finaux","w":1254,"h":1254,"article":"article_protheses_de_main"}]},"s":"data/repertoire.json","p":"Librairie & Documentation !ligne 14"},"doc_prix_prothese_shiro_amakawa":{"l":"Prix Prothèse","c":"document","a":{"acces":"Public","lien":"https://media.discordapp.net/attachments/1554914836737949857/1554914837585338378/content.png?backend=b2&ex=6abe9eca&is=6abd4d4a&hm=a5030c11f1da35172d2072b2aa1851d4cb3f2626028dd390d1676c491e67cb38&=&format=webp&quality=lossless","illustrations":[{"full":"actualites/catalogue-protheses.webp","mini":"actualites/catalogue-protheses-mini.webp","legende":"Planche complète — Prothèses Shinobi : catalogue et tarifs","w":1024,"h":1536,"article":"article_catalogue_protheses_shinobi"}]},"s":"data/repertoire.json","p":"Librairie & Documentation !ligne 18"},"mission_2026_09_19":{"l":"Mission 2026-09-19 — Opération de sauvetage de Makuta Kishiro","c":"mission","a":{"date":"2026-09-19","recit":"Opération de sauvetage de Makuta Kishiro\nDéroulement de la mission\n\nÀ la suite de l'enlèvement de Makuta Kishiro par l'organisation Chimère, son frère Bakuta Kishiro, tous deux membres du Conseil scientifique des trois nations, nous a demandé notre aide afin de retrouver Makuta et de le ramener sain et sauf.\n\nAvant le départ, j'ai notamment travaillé avec Shikame, que j'ai aidé à terminer son cerf. J'ai également pu récupérer et remettre en état plusieurs prototypes de capsules de tempête. Ces prototypes avaient été conçus précédemment avec Bashira, et Sora Tori, mais certaines versions avaient été considérées comme ratées et étaient restées inutilisées. J'ai pu en récupérer certaines afin de les rendre à nouveau fonctionnelles pour cette mission.","rapport":"À 21 heures, les scientifiques de Konoha, Suna et Ame se sont réunis à Nakamura, scientifique de Suna, afin de recevoir les dernières informations concernant la situation et de préparer notre intervention. Makuta étant porté disparu, les informations dont nous disposions ont été reprises afin que chacun puisse comprendre la situation et les objectifs de l'opération.\n\nNous nous sommes ensuite équipés en civil et avons formé deux groupes afin de nous faire passer pour des marchands et de pouvoir nous déplacer sans attirer immédiatement l'attention.\n\nAvec un autre scientifique de Suna disposant de capacités d'infiltration, nous avons pénétré dans le Pays des Cerisiers afin d'observer les environs et de rechercher des informations permettant de localiser Makuta. Les autres membres du groupe assuraient parallèlement leurs propres recherches et déplacements.\nAffrontement :\n\nLa situation ne s'est finalement pas déroulée comme prévu. Des éléments extérieurs sont venus perturber l'opération et la mission a rapidement dégénéré en affrontement direct.\n\nNous avons alors dû abandonner notre approche initiale et nous défendre face aux membres de l'organisation Chimère présents sur place.\n\nL'affrontement s'est conclu par la neutralisation des membres de Chimère présents dans la zone. Nous avons également réussi à retrouver Makuta Kishiro et à l'extraire de la situation afin de le ramener en sécurité.\n\nMalgré certaines difficultés rencontrées durant la mission, notamment avec certains comportements des scientifiques d'Ame, l'objectif principal de l'opération a finalement été atteint : Makuta a été retrouvé et ramené vivant.\n\nFin de mission\n\nUne fois Makuta mis en sécurité, les différents groupes scientifiques se sont séparés afin de retourner dans leurs nations respectives. Les scientifiques de Suna sont retournés à Suna, ceux de Konoha à Konoha et ceux d'Ame à Ame.\n\nLa mission s'est donc terminée après le retour de chacun dans son village.\n\nÀ la suite de cette opération, il est prévu de retourner auprès de Nakamura, à Suna, afin de discuter plus en détail de l'organisation Chimère, des événements qui se sont déroulés durant l'opération et des informations que nous avons pu recueillir.\n\nAprès cette mission particulièrement mouvementée, un repos était également nécessaire avant de reprendre les recherches et les investigations concernant Chimère."},"s":"data/repertoire.json","p":"Rapports de Missions !ligne 3"},"personne_makuta_kishiro":{"l":"Makuta Kishiro","c":"personne externe","a":{},"s":"data/repertoire.json","p":null},"personne_bakuta_kishiro":{"l":"Bakuta Kishiro","c":"personne externe","a":{},"s":"data/repertoire.json","p":null},"personne_nakamura":{"l":"Nakamura","c":"personne externe","a":{},"s":"data/repertoire.json","p":null},"org_chimere":{"l":"Chimère","c":"organisation externe","a":{},"s":"data/repertoire.json","p":null},"org_conseil_scientifique_des_trois_nations":{"l":"Conseil scientifique des trois nations","c":"organisation externe","a":{},"s":"data/repertoire.json","p":null},"lieu_konoha":{"l":"Konoha","c":"lieu","a":{},"s":"data/repertoire.json","p":null},"lieu_suna":{"l":"Suna","c":"lieu","a":{},"s":"data/repertoire.json","p":null},"lieu_ame":{"l":"Ame","c":"lieu","a":{},"s":"data/repertoire.json","p":null},"lieu_pays_des_cerisiers":{"l":"Pays des Cerisiers","c":"lieu","a":{"description":"Origine d'Emma: le charme sombre (lisières) et du Raimei no Take (sommets foudroyés)."},"s":"data/repertoire.json","p":"pages 8, 11"},"objet_capsules_de_tempete":{"l":"Capsules de tempête (prototypes)","c":"objet","a":{},"s":"data/repertoire.json","p":null},"mission_2026_09_27":{"l":"Mission 2026-09-27 — Enquête sur les perturbations du domaine scientifique","c":"mission","a":{"date":"2026-09-27","recit":"Mission au sein de la Scientifique pour comprendre les évènements perturbateur au sein du domaine scientifique (appareils qui grésillent, plantent qui fanent comme si l'automne étais déja la, ressenti du chakra perturbé) rencontre avec Hitogami qui nous dis que les memes choses arrivent a son pays de la Lune. Mais celui ci a réussi a créer une machine qui arrive a capter la source de ces perturbations","rapport":"\"Ce qui nous amené à Tanzaku ou l'on a rencontrer deux villageois (un pecheur et un agriculteur) et tous les deux nous on signaler avoir vu des ombres faires des choses pres de leurs cultures pendant la nuit et apres avoir chercher aux endroits signaler on a trouver un cadenas avec un emblème (rond avec une flèche brisé qui traverse le rond) ensuite nous avons du aller aux pays des marais ou nous avons trouver une page sur laquelles ils y avaient des pages dont certains mots étaient caché et enfin au Pays du fer ou de nouveau nous avons trouvé une page avec un message Codé. Apres réflexion j'ai tenté de décoder le codes avec une logiques régulieres mais certains mots n'ont aucuns sens.\nCodes a déchiffrer:\nABCDE FG OHV DXWUHV MHWWHQW QRXV OH JDUGRQV\nOD FOH HVW VRXV OD SODTXH\nQHULHQ WRXFKHU DYDQW OH SURFABCDEF\nComme Vous pouvez voir il y a une partie du code illisible. Après y a voir réfléchi j'ai remarqué qu'en décalent chaque lettres de 3 lettres avant nous trouvons des mots. Ce qui donne:\nLES AUTRES METTENT NOUS LE GARCONS\nLA CLÉ EST SOUS LA PLAQUE\nNE RIEN TOUCHER AVANT LE PROC…\nComme vous pouvez le voir certains mots n'ont pas de sens dans ces phrases mais je pense tenir quelque chose.\"","messages_codes":["OHV DXWUHV MHWWHQW QRXV OH JDUGRQV","OD FOH HVW VRXV OD SODTXH","QHULHQ WRXFKHU DYDQW OH SURF"]},"s":"data/repertoire.json","p":"Rapports de Missions !ligne 4"},"personne_hitogami":{"l":"Hitogami","c":"personne externe","a":{},"s":"data/repertoire.json","p":null},"lieu_tanzaku":{"l":"Tanzaku","c":"lieu","a":{},"s":"data/repertoire.json","p":null},"lieu_pays_des_marais":{"l":"Pays des marais","c":"lieu","a":{},"s":"data/repertoire.json","p":null},"lieu_pays_du_fer":{"l":"Pays du fer","c":"lieu","a":{},"s":"data/repertoire.json","p":"pages 14, 16, 22"},"lieu_pays_de_la_lune":{"l":"Pays de la Lune","c":"lieu on à faible dose ?","dangerosite":"Élevée","experiences":["29/09/26 — Observation et analyse de base : Odeur âcre, sève abondante dans les racines. Conclusion : Plante potentiellement toxique.","29/09/26 — Test sur sang animal (faible dose) : Ralentissement du rythme cardiaque. Conclusion : Effet direct sur le cœur confirmé.","30/09/26 — Test sur petit animal (faible dose) : Léthargie, chute de tension, mort rapide en dose plus élevée. Conclusion : Poison très dangereux.","30/09/26 — Extraction partielle et dilution forte : Effet moins violent, stabilisation temporaire du rythme cardiaque. Conclusion : Piste d'un usage contrôlé.","01/10/26 — Test sur animal empoisonné (par une substance connue affectant le cœur) : Amélioration du rythme cardiaque et stabilisation de l'état général. Conclusion : Propriété antidotique confirmée à faible dose."],"notes":"L'aconit est une plante extrêmement dangereuse. Ses composés affectent directement le cœur, provoquant un ralentissement du rythme cardiaque pouvant mener rapidement à la mort. Cependant, en étudiant attentivement ses effets et en travaillant sur des extraits très dilués, j'ai pu observer une stabilisation du rythme cardiaque chez un animal empoisonné par une autre substance provoquant des troubles cardiaques. Cela suggère qu'une fraction maîtrisée des composés de l'aconit pourrait être utilisée comme composant dans un antidote contre certaines toxines affectant le cœur. La marge entre la dose utile et la dose mortelle est très faible, rendant sa préparation délicate et réservée à un usage expert.","conclusion":"L'aconit est une plante hautement toxique agissant sur le fonctionnement cardiaque. À forte dose, elle provoque un ralentissement du rythme cardiaque pouvant être fatal. À très faible dose et correctement préparée, une fraction de ses composés peut être utilisée comme composant dans un antidote permettant de stabiliser certaines perturbations cardiaques causées par d'autres toxines. Son utilisation nécessite un les nausées d'origine toxique.","05/10/26 — Comparaison avec extrait de gingembre : Le gingembre agit plus rapidement, tandis que l'amanite a un effet plus durable. Conclusion : Mécanismes différents et complémentaires."],"notes":"L'amanite livide est un champignon très dangereux, provoquant de violents troubles digestifs (nausées, vomissements, douleurs abdominales, déshydratation). Pendant un premier temps, aucun intérêt médicinal ne semblait se dégager. Cependant, après plusieurs essais et comparaisons, un extrait spécifiquement préparé et purifié semble capable d'atténuer certaines nausées et vomissements provoqués par d'autres toxines. Son action est plus lente que celle du gingembre, mais plus durable. La plante reste extrêmement dangereuse et nécessite une préparation minutieuse. Une mauvaise utilisation peut provoquer les mêmes effets toxiques qu'à l'état brut.","conclusion":"L'amanite livide est un champignon hautement toxique, provoquant des troubles digestifs sévères. Après purification et préparation spécifique, une fraction de ses composés peut être utilisée comme composant d'antidote contre certaines nausées et vomissements d'origine toxique. Son action est plus lente mais plus durable que celle du gingembre, ce qui en fait un complément intéressant dans certaines préparations. Une extrême prudence est indispensable en raison de sa forte toxicité.","decouverte":"04/10/2026 au 05/10/2026 — Akira Kaito","illustrations":[{"full":"actualites/rapport-botanique-akira-amanite-livide.webp","mini":"actualites/rapport-botanique-akira-amanite-livide-mini.webp","legende":"Planche complète — Rapport botanique : Amanite livide","w":1055,"h":1491,"article":"article_rapport_botanique_amanite_livide"}]},"s":"data/repertoire.json","p":null},"ingredient_gingembre_sauvage":{"l":"Gingembre sauvage","c":"plante","a":{"nom_scientifique":"Zingiber officinale (variété locale)","type":"Herbacée","taille":"0,8 à 1,5 m (partie aérienne)","lieu":"Vallée boisée, région tempérée","d
