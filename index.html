ra. Elle n'est pas dangereuse à faible dose, mais peut être toxique en grande quantité. Des recherches supplémentaires sont nécessaires pour confirmer son efficacité et déterminer son champ d'action réel.","decouverte":"04/09/2026 — Akira Kaito","illustrations":[{"full":"actualites/rapport-botanique-akira-bambou-sacre.webp","mini":"actualites/rapport-botanique-akira-bambou-sacre-mini.webp","legende":"Planche complète — Rapport botanique : Bambou sacré","w":1055,"h":1491,"article":"article_rapport_botanique_bambou_sacre"}]},"s":"sources/actualites/rapport-botanique-akira-bambou-sacre.png","p":null},"plante_taro":{"l":"Taro","c":"plante","a":{"nom_scientifique":"Colocasia esculenta","type":"Herbacée","taille":"0,8 m - 2 m","lieu":"Vallées rocheuses humides de Murasaki, Pays du Vent.","description":"Plante herbacée à grandes feuilles émergeant d'un tubercule souterrain. Très grandes feuilles en forme de cœur. Longs pétioles partant d'un tubercule souterrain comestible après préparation.","morphologie":{"feuilles":"Très grandes, en forme de cœur, souples, à nervures marquées.","fleurs":"Inflorescence en spadice discrète, entourée d'une spathe verdâtre. Floraison rare en milieu naturel.","fruits":"Non observés à ce stade.","tiges":"Pétiole long, charnu et souple, de couleur verte à légèrement violacée.","racines":"Tubercule principal volumineux, brun à l'extérieur, chair blanche avec des marbrures violettes.","couleurs":"Vert (feuilles), tiges vertes à légèrement violacées, tubercule brun à chair blanche teintée de violet.","odeur":"Légère odeur terreuse.","texture":"Souples, lisses, légèrement cireuses."},"habitat":{"environnement":"Zones côtières, vallées humides, proches de cours d'eau.","sol":"Sol riche, meuble et humide.","climat":"Climat tempéré à chaud, supporte bien l'humidité.","altitude":"Basse à moyenne altitude.","voisinage":"Bambous, fougères, plantes aquatiques, herbes hautes.","remarques":"Souvent trouvé dans des zones ombragées et proches de l'eau."},"affinite_chakra":{"reaction":"À confirmer","reactions":"Aucune réaction notable lors des premiers tests. La plante semble neutre au chakra à l'état brut.","hypotheses":"Pourrait interagir indirectement avec le chakra après préparation (digestion / assimilation).","precautions":"Ne pas consommer cru. Manipulation avec gants recommandée."},"usages":"Source d'énergie à libération lente, base alimentaire, potentiel pour la création de rations shinobi.","effets":"À l'état cru : irritant, peut provoquer des brûlures et des inflammations. À l'état cuit : aucun effet négatif, semble favoriser l'endurance et la récupération lente.","dangerosite":"Moyenne","dangers":"Plante sûre après cuisson suffisante. Dangereuse à l'état cru.","experiences":["10/09/2026 — 1. Analyse visuelle et olfactive : Aucune particularité. Conclusion : R.A.S.","10/09/2026 — 2. Contact peau animale (cru) : Irritation, rougeurs. Conclusion : Potentiellement irritant.","10/09/2026 — 3. Ingestion animale (cru) : Refus de l'animal, irritation bouche. Conclusion : Impropre à la consommation.","10/09/2026 — 4. Cuisson (ébullition) : Texture modifiée, odeur adoucie. Conclusion : La cuisson neutralise l'irritation.","10/09/2026 — 5. Ingestion animale (cuit) : Aucune réaction négative. Conclusion : Semble toléré.","10/09/2026 — 6. Effort physique + taro cuit : Récupération plus rapide et durable. Conclusion : Effet énergétique probable.","10/09/2026 — 7. Comparaison avec témoin : Meilleure endurance. Conclusion : Effet confirmé.","10/09/2026 — 8. Observation du chakra : Aucun afflux immédiat. Conclusion : Soutien lent à l'endurance.","10/09/2026 — 9. Pâte déshydratée : Effet similaire, bonne conservation. Conclusion : Utilisable en ration."],"notes":"Au début, j'ai pensé que cette plante était toxique à cause des fortes irritations observées lors des premiers tests. La cuisson change totalement ses propriétés. Le taro ne restaure pas immédiatement le chakra, mais il semble fournir une réserve d'énergie lente et durable, permettant de mieux supporter les efforts prolongés et de récupérer plus efficacement après ceux-ci. La pâte de taro pourrait être utile comme base pour des rations shinobi, notamment en combinaison avec d'autres plantes aux propriétés spécifiques.","conclusion":"Le taro est une plante au fort potentiel alimentaire et médicinal. À l'état cru, il est irritant et peut provoquer des inflammations, il ne doit pas être consommé sans préparation. Une cuisson suffisante neutralise ces effets indésirables. Une fois préparé, le tubercule constitue une excellente source d'énergie à libération lente, favorisant l'endurance et la récupération. Des recherches supplémentaires sont nécessaires pour déterminer l'ampleur de ses effets et ses éventuelles interactions avec d'autres plantes.","decouverte":"10/09/2026 — Akira Kaito","illustrations":[{"full":"actualites/rapport-botanique-akira-taro.webp","mini":"actualites/rapport-botanique-akira-taro-mini.webp","legende":"Planche complète — Rapport botanique : Taro","w":1055,"h":1491,"article":"article_rapport_botanique_taro"}]},"s":"sources/actualites/rapport-botanique-akira-taro.png","p":null},"plante_cosmos_sulfureux":{"l":"Cosmos sulfureux","c":"plante","a":{"nom_scientifique":"Cosmos sulfureus","type":"Herbacée","taille":"Moyenne (50 à 120 cm)","lieu":"Rives du lac, région de Yozakura.","description":"Tiges fines et souples, à fleurs nombreuses. Fleurs en forme de marguerite, souvent groupées. Pousse en abondance près des points d'eau.","morphologie":{"feuilles":"Fines, très découpées, vert clair, disposées le long des tiges.","fleurs":"Violettes à cœur jaune, larges pétales légèrement ondulés. Floraison en saison chaude.","fruits":"Petites graines allongées, brun foncé (observées en fin de saison).","tiges":"Tiges fines, souples, légèrement striées.","racines":"Peu profondes, en réseau, adaptées aux sols humides.","couleurs":"Violet (fleurs), vert (tiges et feuilles), jaune (cœur).","odeur":"Légère odeur florale, douce et a normale, il peut cependant provoquer une hypersensibilité en cas de surdosage. Une préparation adaptée pourrait offrir un avantage appréciable pour les missions d'infiltration, de surveillance et de traque.","decouverte":"13/09/2026 — Akira Kaito","illustrations":[{"full":"actualites/rapport-botanique-akira-cosmos-sulfureux.webp","mini":"actualites/rapport-botanique-akira-cosmos-sulfureux-mini.webp","legende":"Planche complète — Rapport botanique : Cosmos Sulfureux","w":1024,"h":1536,"article":"article_rapport_botanique_cosmos_sulfureux"}]},"s":"sources/actualites/rapport-botanique-akira-cosmos-sulfureux.png","p":null},"plante_cereus_ventosus":{"l":"Cereus ventosus","c":"plante","a":{"nom_scientifique":"Cereus ventosus","type":"cactus colonnaire","taille":"Très haut, pouvant dépasser 5 mètres.","lieu":"Désert du Pays du Vent, dans les environs de Suna.","description":"Tige charnue, dressée et colonnaire. Épines très longues et acérées. Chair interne gorgée d'eau. Sève blanchâtre et collante. Fleurs rares, visibles surtout la nuit.","morphologie":{"feuilles":"Aucune feuille visible. (cactus)","fleurs":"Fleurs grandes mais rares, blanches, s'ouvrant la nuit.","fruits":"Aucun fruit ni graine observé.","tiges":"Tige charnue, épaisse, couverte d'épines. Contient une sève toxique.","racines":"Racines profondes et étendues, adaptées aux sols arides.","couleurs":"Vert grisâtre (cactus), épines brun clair.","odeur":"Aucune odeur notable.","texture":"–"},"habitat":{"environnement":"Désert du Pays du Vent, zones rocheuses et dunes.","sol":"Sablonneux, rocailleux, pauvre en nutriments.","climat":"Très chaud, sec, forte exposition solaire.","altitude":"Basse à moyenne.","voisinage":"Végétation désertique (arbustes épineux, petits cactus, herbes résistantes).","remarques":"Plante emblématique de la région, constituant une source d'eau précieuse mais dangereuse."},"affinite_chakra":{"reaction":"Non","reactions":"Aucune réaction visible, même avec une concentration élevée.","hypotheses":"La toxine n'agit probablement pas directement sur la plante mais sur l'organisme.","precautions":"Éviter tout contact avec la sève et la chair non traitée. Porter des protections lors de la manipulation."},"usages":"Réserve d'eau (après traitement rigoureux). Usage potentiel pour l'artisanat (fibres, écorce).","effets":"Ralentissement notable de la circulation du chakra lors de l'utilisation de techniques. Aucun effet direct sur la santé physique en faible quantité.","dangerosite":"Élevée","dangers":"La chair et surtout la sève contiennent une substance toxique. L'eau interne devient consommable après un traitement adapté, qui élimine cette substance.","experiences":["12/09/2026 — Observation de la sève brute : Aucun changement visible. Conclusion : Aucun effet apparent.","12/09/2026 — Contact avec du sang : Pas de changement (couleur/coagulation). Conclusion : Aucun effet sur le sang.","12/09/2026 — Test avec un poison faible : Aucune réaction. Conclusion : Pas d'effet antitoxique.","12/09/2026 — Application de chakra sur la sève : Aucune réaction visible. Conclusion : La plante ne réagit pas au chakra.","12/09/2026 — Comparaison eau / chair / sève : L'eau semble inoffensive, la sève plus suspecte. Conclusion : Toxicité liée aux tissus (sève/chair).","13/09/2026 — Contact cutané (animal) : Aucune réaction visible. Conclusion : Pas d'effet physique direct.","13/09/2026 — Effort physique (animal) : Comportement normal. Conclusion : Pas d'effet musculaire.","13/09/2026 — Faible utilisation de chakra : Légère hésitation. Conclusion : Possible perturbation du chakra.","13/09/2026 — Comparaison avec témoin : Retard observé chez le sujet exposé. Conclusion : Anomalie confirmée.","13/09/2026 — Mobilisation importante de chakra : Ralentissement net, plus d'effort. Conclusion : Effet proportionnel à la quantité.","13/09/2026 — Retour à faible utilisation : Toujours possible, avec légère gêne. Conclusion : Effet surtout marqué à forte dépense.","14/09/2026 — Tests gradués (faible → élevé) : Retard croissant selon la quantité. Conclusion : Relation confirmée.","14/09/2026 — Vérification des réserves : Réserves intactes. Conclusion : Ne consomme pas le chakra.","14/09/2026 — Observation de récupération : Retour à la normale après repos. Conclusion : Effet temporaire.","14/09/2026 — Test final (comparatif) : Résultats cohérents et reproductibles. Conclusion : Inhibiteur chakratique confirmé."],"notes":"Les premiers tests n'ont montré aucun effet notable, ce qui m'a d'abord fait penser que la toxicité de cette plante était principalement physique. Ce n'est qu'à partir du 13/09 que j'ai observé une anomalie lors d'exercices nécessitant l'utilisation du chakra. Plus la quantité de chakra mobilisée est importante, plus l'effet du poison se fait sentir : ralentissement de la circulation, difficulté à concentrer et à faire circuler le chakra. Les techniques simples restent possibles, mais demandent plus de temps et d'effort. Le sujet reste parfaitement conscient et ne perd pas ses réserves de chakra, ce qui confirme qu'il s'agit d'un inhibiteur de mobilisation et non d'un absorbeur. L'eau interne, correctement purifiée, ne présente plus cet effet, ce qui explique son utilisation par les habitants malgré la dangerosité de la plante.","conclusion":"Le Cereus Ventosus contient dans sa sève et sa chair une substance toxique qui perturbe la circulation du chakra. Plus la quantité de chakra utilisée est élevée, plus l'effet est marqué. L'eau du cactus, après traitement adapté, peut être consommée sans danger. Cette plante représente une ressource précieuse mais doit être manipulée avec une grande prudence.","decouverte":"14/09/2026 — Akira Kaito","illustrations":[{"full":"actualites/rapport-botanique-akira-cereus-ventosus.webp","mini":"actualites/rapport-botanique-akira-cereus-ventosus-mini.webp","legende":"Planche complète — Rapport botanique : Cereus Ventosus","w":1055,"h":1491,"article":"article_rapport_botanique_cereus_ventosus"}]},"s":"sources/actualites/rapport-botanique-akira-cereus-ventosus.png","p":null},"article_rapport_datura":{"l":"Rapport d'expérimentation : identification du Datura","c":"article","a":{"date":"2025-09-17","objet":"Analyse d'un spécimen inconnu","resume":"Un spécimen inconnu est observé, broyé, examiné au microscope et testé chimiquement : il s'agit bien de datura, une plante extrêmement toxique riche en alcaloïdes.","corps":"1. Observation du spécimen\nFleur du spécimen : forme de trompette, couleur blanche à légèrement violacée.\nFruit (capsule épineuse) encore fermé.\nGraines noires, petites et nombreuses.\n2. Analyses et expérimentations\nÉchantillon de feuille et de fleur broyé (après séchage).\nObservation au microscope : présence de cellules végétales caractéristiques du genre Datura (poils glandulaires, structure des feuilles).\nTest chimique : réaction positive aux alcaloïdes (atropine, scopolamine, hyoscyamine) avec les réactifs spécifiques.\n3. Conclusion\nAprès plusieurs observations, analyses et tests, j'ai pu conclure qu'il s'agissait bien de datura.\n4. Le datura\nLe datura est une plante connue pour sa forte toxicité. Elle contient des alcaloïdes comme l'atropine, la scopolamine et l'hyoscyamine, qui peuvent provoquer des effets importants sur l'organisme.\n\nElle se reconnaît notamment à ses grandes fleurs en forme de trompette et à ses fruits épineux.\n5. Caractéristiques principales\nNature ; Plante herbacée vivace (genre Datura).\nAspect ; Fleurs en trompette (blanches à violacées), feuilles larges, fruits épineux, graines noires.\nOdeur ; Plutôt faible, légèrement désagréable chez certaines espèces.\nOrigine ; Régions chaudes et tempérées (aujourd'hui présent dans de nombreuses régions du monde).\n6. Effets sur l'organisme\nTroubles de la perception (hallucinations).\nConfusion mentale et désorientation.\nAccélération du rythme cardiaque.\nSécheresse de la bouche et de la peau.\nDans les cas graves : convulsions, coma, voire décès.\nÀ retenir\nLe datura est une plante extrêmement toxique. Toutes ses parties (feuilles, fleurs, fruits, graines) peuvent être dangereuses. Son étude est essentielle pour mieux comprendre ses effets et développer d'éventuels antidotes.\nComprendre la nature, c'est apprendre à mieux la maîtriser.","sections":[{"titre":"1. Observation du spécimen","liste":["Fleur du spécimen : forme de trompette, couleur blanche à légèrement violacée.","Fruit (capsule épineuse) encore fermé.","Graines noires, petites et nombreuses."]},{"titre":"2. Analyses et expérimentations","liste":["Échantillon de feuille et de fleur broyé (après séchage).","Observation au microscope : présence de cellules végétales caractéristiques du genre Datura (poils glandulaires, structure des feuilles).","Test chimique : réaction positive aux alcaloïdes (atropine, scopolamine, hyoscyamine) avec les réactifs spécifiques."]},{"titre":"3. Conclusion","texte":"Après plusieurs observations, analyses et tests, j'ai pu conclure qu'il s'agissait bien de datura."},{"titre":"4. Le datura","texte":"Le datura est une plante connue pour sa forte toxicité. Elle contient des alcaloïdes comme l'atropine, la scopolamine et l'hyoscyamine, qui peuvent provoquer des effets importants sur l'organisme.\n\nElle se reconnaît notamment à ses grandes fleurs en forme de trompette et à ses fruits épineux."},{"titre":"5. Caractéristiques principales","tableau":{"colonnes":["Critère","Observation"],"lignes":[["Nature","Plante herbacée vivace (genre Datura)."],["Aspect","Fleurs en trompette (blanches à violacées), feuilles larges, fruits épineux, graines noires."],["Odeur","Plutôt faible, légèrement désagréable chez certaines espèces."],["Origine","Régions chaudes et tempérées (aujourd'hui présent dans de nombreuses régions du monde)."]]}},{"titre":"6. Effets sur l'organisme","liste":["Troubles de la perception (hallucinations).","Confusion mentale et désorientation.","Accélération du rythme cardiaque.","Sécheresse de la bouche et de la peau.","Dans les cas graves : convulsions, coma, voire décès."]},{"titre":"À retenir","encadre":"Le datura est une plante extrêmement toxique. Toutes ses parties (feuilles, fleurs, fruits, graines) peuvent être dangereuses. Son étude est essentielle pour mieux comprendre ses effets et développer d'éventuels antidotes."},{"citation":"Comprendre la nature, c'est apprendre à mieux la maîtriser."}],"images":[{"full":"actualites/rapport-datura.webp","mini":"actualites/rapport-datura-mini.webp","legende":"Rapport d'expérimentation du 17/09/2025 — Section Scientifique, Village de Konoha","w":1312,"h":1199}]},"s":"data/actualites.json","p":"rapport-datura.png"},"article_rapport_venin_vipere":{"l":"Rapport d'expérimentation : identification d'un venin de vipère","c":"article","a":{"date":"2025-09-21","objet":"Analyse d'un spécimen inconnu","resume":"Un venin prélevé sans tuer l'animal est filtré, observé au microscope et testé : il s'agit bien de venin de vipère, une toxine animale hautement dangereuse.","corps":"1. Observation du spécimen\nSpécimen suspecté : vipère (espèce non identifiée).\nPrélèvement du venin à l'aide d'une méthode non létale.\n2. Analyses et expérimentations\nÉchantillon de venin récupéré (après filtration).\nObservation au microscope : présence de protéines et de composés toxiques caractéristiques des venins de vipère.\nTests chimiques : réaction positive avec les réactifs spécifiques aux toxines de vipère.\n3. Conclusion\nAprès plusieurs observations, analyses et tests, j'ai pu conclure qu'il s'agissait bien de venin de vipère.\n4. Le venin de vipère\nLe venin de vipère est une substance toxique produite par certaines espèces de serpents. Il contient différents types de toxines, qui peuvent avoir des effets variés sur l'organisme.\n\nIl sert notamment à paralyser ses proies et à faciliter leur digestion.\n5. Caractéristiques principales\nNature ; Toxine animale (protéines et peptides).\nAspect ; Liquide clair à légèrement jaunâtre.\nOdeur ; Très faible, presque imperceptible.\nOrigine ; Certaines espèces de vipères (variété non identifiée).\n6. Effets sur l'organisme\nPerturbation de la coagulation du sang (hémorragies possibles).\nEndommagement des tissus (nécrose locale).\nTroubles neurologiques (douleurs, paralysie).\nDans les cas graves : insuffisance respiratoire et risque de décès.\nÀ retenir\nLe venin de vipère est une substance hautement toxique. Son étude est essentielle pour la recherche d'antidotes et la compréhension des effets des toxines sur le corps humain.\nComprendre la nature, c'est apprendre à mieux la maîtriser.","sections":[{"titre":"1. Observation du spécimen","liste":["Spécimen suspecté : vipère (espèce non identifiée).","Prélèvement du venin à l'aide d'une méthode non létale."]},{"titre":"2. Analyses et expérimentations","liste":["Échantillon de venin récupéré (après filtration).","Observation au microscope : présence de protéines et de composés toxiques caractéristiques des venins de vipère.","Tests chimiques : réaction positive avec les réactifs spécifiques aux toxines de vipère."]},{"titre":"3. Conclusion","texte":"Après plusieurs observations, analyses et tests, j'ai pu conclure qu'il s'agissait bien de venin de vipère."},{"titre":"4. Le venin de vipère","texte":"Le venin de vipère est une substance toxique produite par certaines espèces de serpents. Il contient différents types de toxines, qui peuvent avoir des effets variés sur l'organisme.\n\nIl sert notamment à paralyser ses proies et à faciliter leur digestion."},{"titre":"5. Caractéristiques principales","tableau":{"colonnes":["Critère","Observation"],"lignes":[["Nature","Toxine animale (protéines et peptides)."],["Aspect","Liquide clair à légèrement jaunâtre."],["Odeur","Très faible, presque imperceptible."],["Origine","Certaines espèces de vipères (variété non identifiée)."]]}},{"titre":"6. Effets sur l'organisme","liste":["Perturbation de la coagulation du sang (hémorragies possibles).","Endommagement des tissus (nécrose locale).","Troubles neurologiques (douleurs, paralysie).","Dans les cas graves : insuffisance respiratoire et risque de décès."]},{"titre":"À retenir","encadre":"Le venin de vipère est une substance hautement toxique. Son étude est essentielle pour la recherche d'antidotes et la compréhension des effets des toxines sur le corps humain."},{"citation":"Comprendre la nature, c'est apprendre à mieux la maîtriser."}],"images":[{"full":"actualites/rapport-venin-vipere.webp","mini":"actualites/rapport-venin-vipere-mini.webp","legende":"Rapport d'expérimentation du 21/09/2025 — Section Scientifique, Village de Konoha","w":1312,"h":1199}]},"s":"data/actualites.json","p":"rapport-venin-vipere.png"},"article_projet_articulation_coude":{"l":"Projet : étude et reproduction d'une articulation (coude)","c":"article","a":{"resume":"Premier prototype mécanique de coude : axe et rotule, ressort d'assistance et canal de chakra. Le mouvement est fluide mais encore limité ; prochaine étape, une meilleure articulation et l'intégration du chakra.","corps":"Objectif\nComprendre le fonctionnement d'une articulation humaine et concevoir un premier prototype mécanique capable de reproduire les mouvements du coude.\nMatériaux utilisés\nAlliage léger (structure principale).\nRésine renforcée (protection extérieure).\nCuir synthétique (ajustement au bras).\nComposants mécaniques (axes, rotules, ressorts).\nGel de chakra (testé en petite quantité).\nFonctionnement\nLe prototype repose sur un système d'axe et de rotule permettant la flexion et l'extension du coude. Un petit mécanisme à ressort aide au mouvement, et une fine circulation de chakra peut être intégrée pour améliorer la souplesse et la réactivité.\n\nLa partie supérieure s'adapte au bras avec un système de sangles ; l'articulation principale associe un axe et une rotule ; la partie inférieure s'adapte à l'avant-bras avec un système de sangles.\nVue éclatée\n1 ; Partie supérieure ; Cuir synthétique + mousse\n2 ; Plaque de maintien ; Alliage léger\n3 ; Système de rotule ; Permet la rotation\n4 ; Axe de l'articulation ; Acier renforcé\n5 ; Ressort d'assistance ; Aide au mouvement\n6 ; Canal de chakra ; Circulation contrôlée\n7 ; Partie inférieure ; Alliage léger + résine\nDétail du mécanisme\nLe système de rotule et d'axe permet une flexion et une extension fluide. Le ressort aide à accompagner le mouvement et la circulation de chakra peut être ajustée selon les besoins.\nAmplitude des mouvements\nExtension : 0°.\nFlexion : 90°.\nFlexion maximale : environ 130°.\nTest de mouvement (simulation)\nPositions testées : 0°, 45°, 90° et 130°. Le mouvement est fluide mais reste encore limité. Des améliorations sont nécessaires pour gagner en souplesse et en stabilité.\nPort du prototype\nLéger ; Amplitude encore limitée\nBonne stabilité ; Manque de résistance\nMouvement fluide (pour un prototype) ; Ajustement du système de chakra\nAjustement confortable\nProchaine étape\nTravailler sur une meilleure articulation et tester l'intégration de la circulation de chakra.\nCe premier prototype n'a pas pour but d'être parfait, mais de poser les bases d'une future prothèse plus complète. — Shiro Amakawa","sections":[{"titre":"Objectif","texte":"Comprendre le fonctionnement d'une articulation humaine et concevoir un premier prototype mécanique capable de reproduire les mouvements du coude."},{"titre":"Matériaux utilisés","liste":["Alliage léger (structure principale).","Résine renforcée (protection extérieure).","Cuir synthétique (ajustement au bras).","Composants mécaniques (axes, rotules, ressorts).","Gel de chakra (testé en petite quantité)."]},{"titre":"Fonctionnement","texte":"Le prototype repose sur un système d'axe et de rotule permettant la flexion et l'extension du coude. Un petit mécanisme à ressort aide au mouvement, et une fine circulation de chakra peut être intégrée pour améliorer la souplesse et la réactivité.\n\nLa partie supérieure s'adapte au bras avec un système de sangles ; l'articulation principale associe un axe et une rotule ; la partie inférieure s'adapte à l'avant-bras avec un système de sangles."},{"titre":"Vue éclatée","tableau":{"colonnes":["N°","Pièce","Rôle / matériau"],"lignes":[["1","Partie supérieure","Cuir synthétique + mousse"],["2","Plaque de maintien","Alliage léger"],["3","Système de rotule","Permet la rotation"],["4","Axe de l'articulation","Acier renforcé"],["5","Ressort d'assistance","Aide au mouvement"],["6","Canal de chakra","Circulation contrôlée"],["7","Partie inférieure","Alliage léger + résine"]]}},{"titre":"Détail du mécanisme","texte":"Le système de rotule et d'axe permet une flexion et une extension fluide. Le ressort aide à accompagner le mouvement et la circulation de chakra peut être ajustée selon les besoins."},{"titre":"Amplitude des mouvements","liste":["Extension : 0°.","Flexion : 90°.","Flexion maximale : environ 130°."]},{"titre":"Test de mouvement (simulation)","texte":"Positions testées : 0°, 45°, 90° et 130°. Le mouvement est fluide mais reste encore limité. Des améliorations sont nécessaires pour gagner en souplesse et en stabilité."},{"titre":"Port du prototype","tableau":{"colonnes":["Points positifs","Points à améliorer"],"lignes":[["Léger","Amplitude encore limitée"],["Bonne stabilité","Manque de résistance"],["Mouvement fluide (pour un prototype)","Ajustement du système de chakra"],["Ajustement confortable",""]]}},{"titre":"Prochaine étape","encadre":"Travailler sur une meilleure articulation et tester l'intégration de la circulation de chakra."},{"citation":"Ce premier prototype n'a pas pour but d'être parfait, mais de poser les bases d'une future prothèse plus complète. — Shiro Amakawa"}],"images":[{"full":"actualites/projet-coude-planche.webp","mini":"actualites/projet-coude-planche-mini.webp","legende":"Planche du projet : vue générale, vue éclatée, détail du mécanisme, amplitude, tests et port du prototype","w":1312,"h":1199},{"full":"actualites/projet-coude-bras-complet.webp","mini":"actualites/projet-coude-bras-complet-mini.webp","legende":"Bras prothétique complet : fixation bras, articulation du coude, système d'assistance, main articulée ; vues avant et arrière ; extension 0°, flexion 90°, flexion maximale ~130°","w":1214,"h":1295}]},"s":"data/actualites.json","p":"projet-coude-planche.png, projet-coude-bras-complet.png"},"article_bras_drainage_suiton":{"l":"Bras prothétique : intégration d'un canal de drainage Suiton","c":"article","a":{"resume":"Évolution du bras prothétique : un canal de drainage intégré évacue l'eau de condensation produite par le chakra Suiton, pour éviter la corrosion et les courts-circuits.","corps":"Nouveauté\nCanal de drainage Suiton intégré au bras. Le fluide représenté est l'eau de condensation produite par le chakra Suiton (colorisée en bleu sur la planche pour plus de clarté).\nMécanisme d'évacuation\nLe chakra / l'eau générés par le Suiton circulent jusqu'à une micro-pompe de drainage.\nLa micro-pompe draine l'eau résiduelle pour prévenir la corrosion et le court-circuit.\nUne aperture de chakra, au cœur du système, alimente le circuit.\nDes évents rejettent l'eau sous forme de fines gouttelettes.\nComposants annotés\nBras ; Fixation bras\nCoude ; Articulation du coude\nAvant-bras ; Chakra d'eau de condensation (Suiton) dans le système d'assistance\nMain ; Main articulée avec conduit d'évacuation automatique\nDos de la main ; Écouloir automatique de chakra d'eau et buses d'évacuation d'eau de surface\nAmplitude\nExtension : 0°.\nFlexion : 90°.\nFlexion maximale : environ 130°.","sections":[{"titre":"Nouveauté","texte":"Canal de drainage Suiton intégré au bras. Le fluide représenté est l'eau de condensation produite par le chakra Suiton (colorisée en bleu sur la planche pour plus de clarté)."},{"titre":"Mécanisme d'évacuation","liste":["Le chakra / l'eau générés par le Suiton circulent jusqu'à une micro-pompe de drainage.","La micro-pompe draine l'eau résiduelle pour prévenir la corrosion et le court-circuit.","Une aperture de chakra, au cœur du système, alimente le circuit.","Des évents rejettent l'eau sous forme de fines gouttelettes."]},{"titre":"Composants annotés","tableau":{"colonnes":["Zone","Élément"],"lignes":[["Bras","Fixation bras"],["Coude","Articulation du coude"],["Avant-bras","Chakra d'eau de condensation (Suiton) dans le système d'assistance"],["Main","Main articulée avec conduit d'évacuation automatique"],["Dos de la main","Écouloir automatique de chakra d'eau et buses d'évacuation d'eau de surface"]]}},{"titre":"Amplitude","liste":["Extension : 0°.","Flexion : 90°.","Flexion maximale : environ 130°."]}],"images":[{"full":"actualites/bras-drainage-suiton.webp","mini":"actualites/bras-drainage-suiton-mini.webp","legende":"Planche de conception (croquis) : canal de drainage Suiton intégré au bras prothétique","w":959,"h":1024}]},"s":"data/actualites.json","p":"bras-drainage-suiton.png"},"article_prothese_jambe_modulaire":{"l":"Prothèse de jambe modulaire : la planche du projet","c":"article","a":{"resume":"Projet de fin de suivi : une jambe artificielle à pieds interchangeables (marche, combat, terrain difficile), avec articulations amorties et conduits de chakra.","corps":"Une jambe artificielle ne remplace pas un membre, elle redonne une liberté.\nObjectif du projet\nCréer une prothèse de jambe modulaire destinée aux shinobi ayant perdu ou gravement endommagé un membre. Elle doit permettre de retrouver une bonne mobilité tout en s'adaptant aux besoins et aux différentes missions du porteur.\nQualités recherchées\nMobilité ; Marche, course, sauts, changements de direction\nRésistance ; Matériaux légers et solides\nAdaptabilité ; Modules interchangeables\nCompatibilité chakra ; Améliore la stabilité et la réactivité\nStructure\nManchon de maintien (confort et ajustement).\nStructure principale (alliage léger + fibre de carbone).\nArticulation du genou (amortissement intégré).\nConduits de chakra (circulation et répartition).\nArticulation de la cheville (stabilité et souplesse).\nPied interchangeable (selon le terrain et la mission).\nLes modules\nMarche (quotidien) ; Confort optimal, déplacement fluide, usage polyvalent ; Classique (marche / quotidien)\nCombat ; Renforcement des articulations, meilleure stabilité, résistance accrue ; Renforcée (combat)\nTerrain difficile ; Semelle renforcée, excellente adhérence, adapté aux sols instables (roc, sable, neige…) ; Tout-terrain (roc, sable, neige…)\nInterface chakra\nPermet la circulation du chakra dans la prothèse afin d'améliorer la stabilité et la réactivité des articulations.\nSystème d'amortissement\nAbsorbe les chocs lors des sauts, des réceptions et des déplacements rapides grâce à des coussinets et des ressorts amortisseurs.\nMouvements et articulations\nFlexion du genou ; 0° → 135°\nExtension du genou ; 135° → 0°\nFlexion de la cheville ; 0° → 45°\nExtension de la cheville ; 45° → 0°\nLes articulations sont conçues pour offrir une grande amplitude de mouvement et s'adapter à la morphologie de chaque utilisateur.\nMatériaux utilisés\nAlliage léger (résistance et légèreté).\nFibre de carbone (solidité et souplesse).\nCouche souple interne (confort et protection).\nRésultat : légère, résistante, durable.\nÉvolution du projet\nÀ terme, la prothèse pourrait évoluer vers un système capable de s'adapter automatiquement au style de déplacement de son utilisateur.\nRéglages personnalisés (après plusieurs utilisations).\nModules spécialisés (médecine, combat, entraînement, missions…).\nMeilleure intégration du chakra (plus de précision et d'efficacité).\nObjectif final\nUne prothèse résistante, légère, adaptable et compatible avec les capacités d'un shinobi.\nLa science au service des shinobi.","sections":[{"citation":"Une jambe artificielle ne remplace pas un membre, elle redonne une liberté."},{"titre":"Objectif du projet","texte":"Créer une prothèse de jambe modulaire destinée aux shinobi ayant perdu ou gravement endommagé un membre. Elle doit permettre de retrouver une bonne mobilité tout en s'adaptant aux besoins et aux différentes missions du porteur."},{"titre":"Qualités recherchées","tableau":{"colonnes":["Qualité","Détail"],"lignes":[["Mobilité","Marche, course, sauts, changements de direction"],["Résistance","Matériaux légers et solides"],["Adaptabilité","Modules interchangeables"],["Compatibilité chakra","Améliore la stabilité et la réactivité"]]}},{"titre":"Structure","liste":["Manchon de maintien (confort et ajustement).","Structure principale (alliage léger + fibre de carbone).","Articulation du genou (amortissement intégré).","Conduits de chakra (circulation et répartition).","Articulation de la cheville (stabilité et souplesse).","Pied interchangeable (selon le terrain et la mission)."]},{"titre":"Les modules","tableau":{"colonnes":["Module","Atouts","Semelle"],"lignes":[["Marche (quotidien)","Confort optimal, déplacement fluide, usage polyvalent","Classique (marche / quotidien)"],["Combat","Renforcement des articulations, meilleure stabilité, résistance accrue","Renforcée (combat)"],["Terrain difficile","Semelle renforcée, excellente adhérence, adapté aux sols instables (roc, sable, neige…)","Tout-terrain (roc, sable, neige…)"]]}},{"titre":"Interface chakra","texte":"Permet la circulation du chakra dans la prothèse afin d'améliorer la stabilité et la réactivité des articulations."},{"titre":"Système d'amortissement","texte":"Absorbe les chocs lors des sauts, des réceptions et des déplacements rapides grâce à des coussinets et des ressorts amortisseurs."},{"titre":"Mouvements et articulations","tableau":{"colonnes":["Mouvement","Amplitude"],"lignes":[["Flexion du genou","0° → 135°"],["Extension du genou","135° → 0°"],["Flexion de la cheville","0° → 45°"],["Extension de la cheville","45° → 0°"]]}},{"texte":"Les articulations sont conçues pour offrir une grande amplitude de mouvement et s'adapter à la morphologie de chaque utilisateur."},{"titre":"Matériaux utilisés","liste":["Alliage léger (résistance et légèreté).","Fibre de carbone (solidité et souplesse).","Couche s tes/catalogue-protheses.webp","mini":"actualites/catalogue-protheses-mini.webp","legende":"Affiche « Prothèses Shinobi — Innovation · Adaptation · Soutien »","w":1024,"h":1536}]},"s":"data/actualites.json","p":"catalogue-protheses.png"},"article_protheses_de_main":{"l":"Prothèses de main : les modèles finaux","c":"article","a":{"date":"2026-10-07","objet":"Projet","resume":"Shiro Amakawa présente les modèles finaux de ses prothèses de main, droite et gauche : simples, fiables et rapidement adaptables à chaque shinobi blessé.","corps":"Objectif\nL'objectif était de créer des modèles simples, fiables et rapidement adaptables, permettant à un shinobi blessé de retrouver une certaine autonomie sans devoir attendre la fabrication d'une prothèse entièrement personnalisée. J'ai donc travaillé sur leur structure, leurs articulations et leur système de fixation afin qu'elles puissent être adaptées à différents utilisateurs.\nConception\nStructure légère et résistante : alliage de métal et de carbone.\nSystème de fixation confortable et ajustable.\nArticulations renforcées : fluidité et précision des mouvements.\nDétails des doigts\nEmbouts texturés : meilleure prise et précision.\nArticulations mobiles : mouvement naturel et fluide.\nCapteurs intégrés : retour de position et de pression.\nFonctionnalités\nFlexibilité optimale : mouvements naturels et précis.\nRésistance accrue : conçue pour un usage intensif.\nConfort d'utilisation : ajustement personnalisé.\nSystème de fixation sécurisé : maintien stable sans gêne.\nDesign discret : adapté à la vie de shinobi.\nVue éclatée (principales pièces)\nDoigts ; Articulations et capteurs\nModule de contrôle ; Gestion des mouvements\nStructure principale ; Alliage métal / carbone\nSystème de fixation ; Sangle ajustable\nMatériaux et couleurs\nAlliage de métal ; Structure\nCarbone ; Renfort\nTissu technique ; Confort\nBlanc mat ; Protection\nNoir mat ; Discrétion\nBleu lumineux ; Indicateurs\nUn corps brisé n'est pas une fin, seulement un nouveau départ.\nCe n'est pas seulement une prothèse, c'est une partie de moi, un prolongement de mes rêves.","sections":[{"titre":"Objectif","texte":"L'objectif était de créer des modèles simples, fiables et rapidement adaptables, permettant à un shinobi blessé de retrouver une certaine autonomie sans devoir attendre la fabrication d'une prothèse entièrement personnalisée. J'ai donc travaillé sur leur structure, leurs articulations et leur système de fixation afin qu'elles puissent être adaptées à différents utilisateurs."},{"titre":"Conception","liste":["Structure légère et résistante : alliage de métal et de carbone.","Système de fixation confortable et ajustable.","Articulations renforcées : fluidité et précision des mouvements."]},{"titre":"Détails des doigts","liste":["Embouts texturés : meilleure prise et précision.","Articulations mobiles : mouvement naturel et fluide.","Capteurs intégrés : retour de position et de pression."]},{"titre":"Fonctionnalités","liste":["Flexibilité optimale : mouvements naturels et précis.","Résistance accrue : conçue pour un usage intensif.","Confort d'utilisation : ajustement personnalisé.","Système de fixation sécurisé : maintien stable sans gêne.","Design discret : adapté à la vie de shinobi."]},{"titre":"Vue éclatée (principales pièces)","tableau":{"colonnes":["Pièce","Rôle"],"lignes":[["Doigts","Articulations et capteurs"],["Module de contrôle","Gestion des mouvements"],["Structure principale","Alliage métal / carbone"],["Système de fixation","Sangle ajustable"]]}},{"titre":"Matériaux et couleurs","tableau":{"colonnes":["Matériau ou couleur","Rôle"],"lignes":[["Alliage de métal","Structure"],["Carbone","Renfort"],["Tissu technique","Confort"],["Blanc mat","Protection"],["Noir mat","Discrétion"],["Bleu lumineux","Indicateurs"]]}},{"citation":"Un corps brisé n'est pas une fin, seulement un nouveau départ."},{"citation":"Ce n'est pas seulement une prothèse, c'est une partie de moi, un prolongement de mes rêves."}],"images":[{"full":"actualites/prothese-main-droite-shiro.webp","mini":"actualites/prothese-main-droite-shiro-mini.webp","legende":"Prothèse de main droite — modèle final","w":1254,"h":1254},{"full":"actualites/prothese-main-gauche-shiro.webp","mini":"actualites/prothese-main-gauche-shiro-mini.webp","legende":"Prothèse de main gauche — modèle final","w":1254,"h":1254}]},"s":"data/actualites.json","p":"prothese-main-droite-shiro.png, prothese-main-gauche-shiro.png"},"article_rapport_botanique_ginseng":{"l":"Rapport botanique : Ginseng","c":"article","a":{"date":"2026-09-04","objet":"Découverte d'une nouvelle espèce","resume":"Le ginseng est une plante sûre (en usage modéré) aux propriétés stimulantes.","corps":"Conclusion générale\nLe ginseng est une plante sûre (en usage modéré) aux propriétés stimulantes. Il améliore l'endurance physique et semble favoriser la production d'énergie corporelle (Yang), sans restaurer directement le chakra. Son séchage et sa concentration en font un ingrédient prometteur pour la fabrication de pilules énergétiques, comme la Hyôrôgan.\nNotes et observations personnelles\nPlante précieuse. Son effet sur l'endurance en fait un ingrédient de choix pour les missions longues. La racine séchée se conserve bien et pourrait être intégrée dans une ration compacte type pilule. Poursuivre les tests pour déterminer le dosage idéal et la durée des effets.\nExpériences et tests\n09/09/26 ; Test cutané (racine fraîche) ; Aucune irritation ; Non irritant\n09/09/26 ; Infusion faible (1 dose) ; Léger regain d'énergie ; Effet stimulant léger\n09/09/26 ; Exercice physique (témoin) ; Fatigue normale ; Base de comparaison\n09/09/26 ; Exercice après infusion ; Endurance augmentée ; Effet confirmé\n09/09/26 ; Test après dépense de chakra ; Meilleure résistance physique ; Pas de récupération directe\n09/09/26 ; Dose plus élevée (extrait concentré) ; Agitation, chaleur ; Éviter le surdosage","sections":[{"titre":"Conclusion générale","texte":"Le ginseng est une plante sûre (en usage modéré) aux propriétés stimulantes. Il améliore l'endurance physique et semble favoriser la production d'énergie corporelle (Yang), sans restaurer directement le chakra. Son séchage et sa concentration en font un ingrédient prometteur pour la fabrication de pilules énergétiques, comme la Hyôrôgan."},{"titre":"Notes et observations personnelles","texte":"Plante précieuse. Son effet sur l'endurance en fait un ingrédient de choix pour les missions longues. La racine séchée se conserve bien et pourrait être intégrée dans une ration compacte type pilule. Poursuivre les tests pour déterminer le dosage idéal et la durée des effets."},{"titre":"Expériences et tests","tableau":{"colonnes":["Date","Protocole","Résultat","Conclusion"],"lignes":[["09/09/26","Test cutané (racine fraîche)","Aucune irritation","Non irritant"],["09/09/26","Infusion faible (1 dose)","Léger regain d'énergie","Effet stimulant léger"],["09/09/26","Exercice physique (témoin)","Fatigue normale","Base de comparaison"],["09/09/26","Exercice après infusion","Endurance augmentée","Effet confirmé"],["09/09/26","Test après dépense de chakra","Meilleure résistance physique","Pas de récupération directe"],["09/09/26","Dose plus élevée (extrait concentré)","Agitation, chaleur","Éviter le surdosage"]]}}],"images":[{"full":"actualites/rapport-botanique-akira-ginseng.webp","mini":"actualites/rapport-botanique-akira-ginseng-mini.webp","legende":"Rapport botanique d'Akira Kaito — Ginseng (04/09/2026)","w":1055,"h":1491}]},"s":"data/actualites.json","p":"rapport-botanique-akira-ginseng.png"},"article_rapport_botanique_epinard_sauvage":{"l":"Rapport botanique : Épinard sauvage","c":"article","a":{"date":"2026-09-05","objet":"Découverte d'une nouvelle espèce","resume":"L'épinard sauvage est une plante aux propriétés stimulantes remarquables.","corps":"Conclusion générale\nL'épinard sauvage est une plante aux propriétés stimulantes remarquables. Une préparation concentrée permet d'augmenter fortement la force s facilite la stabilité du flux de chakra lors du soin et semble accélérer la régénération des tissus superficiels. Des tests supplémentaires seront nécessaires pour déterminer la durée des effets, un dosage optimal et d'éventuelles contre-indications à plus forte dose.\nExpériences et tests\n09/09/2026 ; Observation visuelle et prélèvement ; Aucune particularité. ; R.A.S.\n09/09/2026 ; Test sanguin (mélange pétales + sang) ; Aucun changement. ; Pas d'effet apparent.\n09/09/2026 ; Test avec poison connu ; Pas de neutralisation. ; Échec (pas d'antidote).\n09/09/2026 ; Contact cutané (peau animale) ; Aucune irritation. ; Pas de toxicité apparente.\n09/09/2026 ; Ingestion (petite dose, animal) ; Aucun effet notable. ; Semble non toxique.\n09/09/2026 ; Plaie animale (sans traitement) ; Cicatrisation normale (référence). ; Témoin.\n09/09/2026 ; Plaie animale + extrait de pétales ; Cicatrisation plus rapide. ; Effet positif.\n09/09/2026 ; Soin léger (spécialisation guérisseur) ; Flux de chakra plus stable. ; Effet confirmé.\n09/09/2026 ; Comparaison sans extrait ; Soin plus difficile à maintenir. ; Différence notable.","sections":[{"titre":"Conclusion générale","texte":"La fleur de cerisier est une plante à fort potentiel médicinal. Ses pétales, une fois infusés et intégrés dans un onguent, favorisent la régénération cellulaire superficielle et stabilisent le flux de chakra lors des soins. Aucune toxicité n'a été observée à ce jour, mais des tests complémentaires sont nécessaires."},{"titre":"Notes et observations personnelles","texte":"Les premiers tests n'ont montré aucun effet sur le sang ni sur les poisons, et aucune toxicité n'a été observée chez les animaux. L'application externe sur une plaie a révélé un effet cicatrisant léger mais réel. En tant que guérisseur (spécialisé dans les soins légers), j'ai pu constater que l'extrait de pétales facilite la stabilité du flux de chakra lors du soin et semble accélérer la régénération des tissus superficiels. Des tests supp ntité. Des recherches supplémentaires sont nécessaires pour confirmer son efficacité et déterminer son champ d'action réel.\nNotes et observations personnelles\nLes premiers tests n'ont montré aucun effet sur un organisme sain, ce qui indique que la plante n'est pas directement bénéfique ni nocive à faible dose. C'est en la confrontant à des substances toxiques que ses propriétés sont apparues. L'extrait de baies semble ralentir la progression des poisons dans le corps et limiter leur diffusion dans la circulation du chakra. L'effet n'est pas immédiat et reste léger, mais il pourrait être très utile contre des poisons de bas niveau (comme ceux des armes altérées). Des tests supplémentaires seront nécessaires pour déterminer les limites de son efficacité et les risques d'une consommation excessive.\nExpériences et tests\n09/09/26 ; Contact sang + extrait de baies ; Aucun changement visible ; Échec.\n09/09/26 ; Application sur peau animale ; Aucune irritation ; Pas de toxicité apparente.\n09/09/26 ; Ingestion (faible dose, animal) ; Aucun effet notable ; Semble tolérée.\n09/09/26 ; Mélange avec poison connu ; Légère modification couleur/odeur ; Réaction intéressante.\n09/09/26 ; Sang + poison (avec/sans extrait) ; Dégradation plus lente (avec) ; Effet probable.\n09/09/26 ; Animal intoxiqué (dose légère) ; Symptômes atténués ; Effet confirmé (léger).\n09/09/26 ; Observation du chakra ; Perturbation ralentie ; Bloque la progression.\n09/09/26 ; Test forte dose ; Vomissements, léthargie ; Toxicité à forte dose.","sections":[{"titre":"Conclusion générale","texte":"Le Bambou sacrée est une plante au fort potentiel médicinal. Ses baies rouges, une fois broyées, semblent agir comme un purificateur naturel, ralentissant la progression des toxines dans le corps et le chakra. Elle n'est pas dangereuse à faible dose, mais peut être toxique en grande quantité. Des recherches supplémentaires sont nécessaires pour confirmer son efficacité et déterminer son champ d'action réel."},{" ume":"Le taro est une plante au fort potentiel alimentaire et médicinal.","corps":"Conclusion générale\nLe taro est une plante au fort potentiel alimentaire et médicinal. À l'état cru, il est irritant et peut provoquer des inflammations, il ne doit pas être consommé sans préparation. Une cuisson suffisante neutralise ces effets indésirables. Une fois préparé, le tubercule constitue une excellente source d'énergie à libération lente, favorisant l'endurance et la récupération. Des recherches supplémentaires sont nécessaires pour déterminer l'ampleur de ses effets et ses éventuelles interactions avec d'autres plantes.\nNotes et observations personnelles\nAu début, j'ai pensé que cette plante était toxique à cause des fortes irritations observées lors des premiers tests. La cuisson change totalement ses propriétés. Le taro ne restaure pas immédiatement le chakra, mais il semble fournir une réserve d'énergie lente et durable, permettant de mieux supporter les efforts prolongés et de récupérer plus efficacement après ceux-ci. La pâte de taro pourrait être utile comme base pour des rations shinobi, notamment en combinaison avec d'autres plantes aux propriétés spécifiques.\nExpériences et tests\n10/09/2026 ; 1. Analyse visuelle et olfactive ; Aucune particularité. ; R.A.S.\n10/09/2026 ; 2. Contact peau animale (cru) ; Irritation, rougeurs. ; Potentiellement irritant.\n10/09/2026 ; 3. Ingestion animale (cru) ; Refus de l'animal, irritation bouche. ; Impropre à la consommation.\n10/09/2026 ; 4. Cuisson (ébullition) ; Texture modifiée, odeur adoucie. ; La cuisson neutralise l'irritation.\n10/09/2026 ; 5. Ingestion animale (cuit) ; Aucune réaction négative. ; Semble toléré.\n10/09/2026 ; 6. Effort physique + taro cuit ; Récupération plus rapide et durable. ; Effet énergétique probable.\n10/09/2026 ; 7. Comparaison avec témoin ; Meilleure endurance. ; Effet confirmé.\n10/09/2026 ; 8. Observation du chakra ; Aucun afflux immédiat. ; Soutien lent à l'endurance.\n10/09/2026 ; 9. Pâte déshydratée ; Effet similaire, bonne conservation. ; Utilisable en ration.","sections":[{"titre":"Conclusion générale","texte":"Le taro est une plante au fort potentiel alimentaire et médicinal. À l'état cru, il est irritant et peut provoquer des inflammations, il ne doit pas être consommé sans préparation. Une cuisson suffisante neutralise ces effets indésirables. Une fois préparé, le tubercule constitue une excellente source d'énergie à libération lente, favorisant l'endurance et la récupération. Des recherches supplémentaires sont nécessaires pour déterminer l'ampleur de ses effets et ses éventuelles interactions avec d'autres plantes."},{"titre":"Notes et observations personnelles","texte":"Au début, j'ai pensé que cette plante était toxique à cause des fortes irritations observées lors des premiers tests. La cuisson change totalement ses propriétés. Le taro ne restaure pas immédiatement le chakra, mais il semble fournir une réserve d'énergie lente et durable, permettant de mieux supporter les efforts prolongés et de récupérer plus efficacement après ceux-ci. La pâte de taro pourrait être utile comme base pour des rations shinobi, notamment en combinaison avec d'autres plantes aux propriétés spécifiques."},{"titre":"Expériences et tests","tableau":{"colonnes":["Date","Protocole","Résultat","Conclusion"],"lignes":[["10/09/2026","1. Analyse visuelle et olfactive","Aucune particularité.","R.A.S."],["10/09/2026","2. Contact peau animale (cru)","Irritation, rougeurs.","Potentiellement irritant."],["10/09/2026","3. Ingestion animale (cru)","Refus de l'animal, irritation bouche.","Impropre à la consommation."],["10/09/2026","4. Cuisson (ébullition)","Texture modifiée, odeur adoucie.","La cuisson neutralise l'irritation."],["10/09/2026","5. Ingestion animale (cuit)","Aucune réaction négative.","Semble toléré."],["10/09/2026","6. Effort physique + taro cuit","Récupération plus rapide et durable.","Effet énergétique probable."],["10/09/2026","7. Comparaison avec témoin  une réaction inhabituelle d'un animal à un bruit très faible que j'ai commencé à suspecter un effet sur la perception sensorielle. Les tests suivants ont confirmé que l'extrait, en particulier celui des fleurs, augmente temporairement la sensibilité des sens : l'ouïe, la vue et l'odorat. Les réflexes semblent également améliorés, non pas par une augmentation de la vitesse physique, mais parce que les stimuli sont perçus plus tôt. Une concentration trop élevée provoque cependant une hypersensibilité désagréable (lumière douloureuse, bruits amplifiés, odeurs écœurantes) ainsi que des maux de tête. L'utilisation devra donc rester contrôlée. Cette plante pourrait être très utile pour des missions de surveillance, de reconnaissance ou de pistage, notamment dans des environnements sombres ou peu visibles.\nExpériences et tests\n10/09/2026 ; Réaction avec du sang ; Aucun changement visible. ; Aucun effet sur le sang.\n10/09/2026 ; Réaction avec un poison faible ; Aucun effet. ; Pas d'effet antitoxique.\n10/09/2026 ; Contact cutané (animal) ; Aucune irritation. ; Aucun effet externe.\n10/09/2026 ; Ingestion faible (animal) ; Comportement normal. ; Pas de toxicité apparente.\n11/09/2026 ; Observation du chakra ; Aucun changement. ; Non lié au chakra.\n11/09/2026 ; Comportement inhabituel ; Réaction à un bruit très faible. ; Piste intéressante à approfondir.\n11/09/2026 ; Test auditif répété ; Réaction plus rapide aux sons faibles. ; Amélioration possible de l'ouïe.\n11/09/2026 ; Comparaison avec témoin ; Animal traité réagit avant le témoin. ; Effet confirmé sur l'audition.\n12/09/2026 ; Test visuel ; Détecte mieux les mouvements (faible lumière). ; Amélioration de la perception visuelle.\n12/09/2026 ; Test olfactif ; Localise des odeurs plus rapidement. ; Amélioration de l'odorat.\n12/09/2026 ; Temps de réaction ; Réaction plus rapide, même vitesse de mouvement. ; Réflexes améliorés (perception).\n12/09/2026 ; Comparaison des parties ; Fleurs > tiges > feuilles. ; Propriét 026-09-13","objet":"Découverte d'une nouvelle espèce","resume":"La Mousse d'Aonami est une plante non toxique qui agit comme un pansement naturel apaisant pour les brûlures et irritations superficielles.","corps":"Conclusion générale\nLa Mousse d'Aonami est une plante non toxique qui agit comme un pansement naturel apaisant pour les brûlures et irritations superficielles. Elle réduit l'inflammation, maintient les tissus humides et adhère à la peau. Ses propriétés disparaissent rapidement lorsqu'elle sèche. Utile pour les missions en milieu côtier ou en environnement chaud.\nNotes et observations personnelles\nLes premiers tests n'ont révélé aucune propriété particulière. C'est à partir du 09/09 que j'ai commencé à observer un réel effet sur les irritations cutanées, puis surtout sur les brûlures. La mousse d'Aonami apaise rapidement la douleur et diminue l'inflammation. Elle maintient la zone humide et adhère naturellement à la peau, ce qui en fait un excellent pansement de terrain pour les brûlures légères. Son effet sur les coupures est limité et elle ne remplace pas une véritable plante régénérante comme la Fleur de cerisier. La conservation est un point important : une fois sèche, la mousse perd presque toutes ses propriétés. Je devrai réfléchir à un moyen de la maintenir humide lors de mes futures missions.\nExpériences et tests\n08/09/2026 ; Réaction avec du sang ; Aucun changement visible. ; Aucun effet.\n08/09/2026 ; Réaction avec un poison faible ; Aucun changement. ; Aucun effet.\n08/09/2026 ; Réaction au chakra ; Aucune réaction. ; Aucun effet.\n08/09/2026 ; Contact cutané (animal sain) ; Aucune irritation. ; Non toxique.\n08/09/2026 ; Mousse séchée ; Perte de texture, aucun effet. ; Le séchage annule les propriétés.\n09/09/2026 ; Irritation cutanée (animal) ; Diminution de la rougeur. ; Effet apaisant.\n09/09/2026 ; Comparaison avec de l'eau ; Soulagement moindre. ; Effet supérieur à l'eau seule.\n09/09/2026 ; Fraîche vs séchée ; La fraîche est efficace. Le Cereus Ventosus contient dans sa sève et sa chair une substance toxique qui perturbe la circulation du chakra. Plus la quantité de chakra utilisée est élevée, plus l'effet est marqué. L'eau du cactus, après traitement adapté, peut être consommée sans danger. Cette plante représente une ressource précieuse mais doit être manipulée avec une grande prudence.\nNotes et observations personnelles\nLes premiers tests n'ont montré aucun effet notable, ce qui m'a d'abord fait penser que la toxicité de cette plante était principalement physique. Ce n'est qu'à partir du 13/09 que j'ai observé une anomalie lors d'exercices nécessitant l'utilisation du chakra. Plus la quantité de chakra mobilisée est importante, plus l'effet du poison se fait sentir : ralentissement de la circulation, difficulté à concentrer et à faire circuler le chakra. Les techniques simples restent possibles, mais demandent plus de temps et d'effort. Le sujet reste parfaitement conscient et ne perd pas ses réserves de chakra, ce qui confirme qu'il s'agit d'un inhibiteur de mobilisation et non d'un absorbeur. L'eau interne, correctement purifiée, ne présente plus cet effet, ce qui explique son utilisation par les habitants malgré la dangerosité de la plante.\nExpériences et tests\n12/09/2026 ; Observation de la sève brute ; Aucun changement visible. ; Aucun effet apparent.\n12/09/2026 ; Contact avec du sang ; Pas de changement (couleur/coagulation). ; Aucun effet sur le sang.\n12/09/2026 ; Test avec un poison faible ; Aucune réaction. ; Pas d'effet antitoxique.\n12/09/2026 ; Application de chakra sur la sève ; Aucune réaction visible. ; La plante ne réagit pas au chakra.\n12/09/2026 ; Comparaison eau / chair / sève ; L'eau semble inoffensive, la sève plus suspecte. ; Toxicité liée aux tissus (sève/chair).\n13/09/2026 ; Contact cutané (animal) ; Aucune réaction visible. ; Pas d'effet physique direct.\n13/09/2026 ; Effort physique (animal) ; Comportement normal. ; Pas d'effet musculaire.\n13/09/2026 ; Faible ages":[{"full":"actualites/rapport-botanique-akira-gingembre.webp","mini":"actualites/rapport-botanique-akira-gingembre-mini.webp","legende":"Rapport botanique d'Akira Kaito — Zingiberis Shinobi (15/09/2026 au 18/09/2026)","w":1055,"h":1491}]},"s":"data/actualites.json","p":"rapport-botanique-akira-gingembre.png"},"article_rapport_botanique_aconit":{"l":"Rapport botanique : Aconit","c":"article","a":{"date":"2026-09-29","objet":"Découverte d'une nouvelle espèce","resume":"L'aconit est une plante hautement toxique agissant sur le fonctionnement cardiaque.","corps":"Conclusion générale\nL'aconit est une plante hautement toxique agissant sur le fonctionnement cardiaque. À forte dose, elle provoque un ralentissement du rythme cardiaque pouvant être fatal. À très faible dose et correctement préparée, une fraction de ses composés peut être utilisée comme composant dans un antidote permettant de stabiliser certaines perturbations cardiaques causées par d'autres toxines. Son utilisation nécessite une grande prudence et un contrôle précis des dosages.\nNotes et observations personnelles\nL'aconit est une plante extrêmement dangereuse. Ses composés affectent directement le cœur, provoquant un ralentissement du rythme cardiaque pouvant mener rapidement à la mort. Cependant, en étudiant attentivement ses effets et en travaillant sur des extraits très dilués, j'ai pu observer une stabilisation du rythme cardiaque chez un animal empoisonné par une autre substance provoquant des troubles cardiaques. Cela suggère qu'une fraction maîtrisée des composés de l'aconit pourrait être utilisée comme composant dans un antidote contre certaines toxines affectant le cœur. La marge entre la dose utile et la dose mortelle est très faible, rendant sa préparation délicate et réservée à un usage expert.\nExpériences et tests\n29/09/26 ; Observation et analyse de base ; Odeur âcre, sève abondante dans les racines. ; Plante potentiellement toxique.\n29/09/26 ; Test sur sang animal (faible dose) ; Ralentissement du rythme cardiaque. ; Effet direct sur le cœur confirmé.\n30/09/26 ; Test sur petit animal (faible dose) ; Léthargie, chute de tension, mort rapide en dose plus élevée. ; Poison très dangereux.\n30/09/26 ; Extraction partielle et dilution forte ; Effet moins violent, stabilisation temporaire du rythme cardiaque. ; Piste d'un usage contrôlé.\n01/10/26 ; Test sur animal empoisonné (par une substance connue affectant le cœur) ; Amélioration du rythme cardiaque et stabilisation de l'état général. ; Propriété antidotique confirmée à faible dose.","sections":[{"titre":"Conclusion générale","texte":"L'aconit est une plante hautement toxique agissant sur le fonctionnement cardiaque. À forte dose, elle provoque un ralentissement du rythme cardiaque pouvant être fatal. À très faible dose et correctement préparée, une fraction de ses composés peut être utilisée comme composant dans un antidote permettant de stabiliser certaines perturbations cardiaques causées par d'autres toxines. Son utilisation nécessite une grande prudence et un contrôle précis des dosages."},{"titre":"Notes et observations personnelles","texte":"L'aconit est une plante extrêmement dangereuse. Ses composés affectent directement le cœur, provoquant un ralentissement du rythme cardiaque pouvant mener rapidement à la mort. Cependant, en étudiant attentivement ses effets et en travaillant sur des extraits très dilués, j'ai pu observer une stabilisation du rythme cardiaque chez un animal empoisonné par une autre substance provoquant des troubles cardiaques. Cela suggère qu'une fraction maîtrisée des composés de l'aconit pourrait être utilisée comme composant dans un antidote contre certaines toxines affectant le cœur. La marge entre la dose utile et la dose mortelle est très faible, rendant sa préparation délicate et réservée à un usage expert."},{"titre":"Expériences et tests","tableau":{"colonnes":["Date","Protocole","Résultat","Conclusion"],"lignes":[["29/09/26","Observation et analyse de base" t un premier temps, aucun intérêt médicinal ne semblait se dégager. Cependant, après plusieurs essais et comparaisons, un extrait spécifiquement préparé et purifié semble capable d'atténuer certaines nausées et vomissements provoqués par d'autres toxines. Son action est plus lente que celle du gingembre, mais plus durable. La plante reste extrêmement dangereuse et nécessite une préparation minutieuse. Une mauvaise utilisation peut provoquer les mêmes effets toxiques qu'à l'état brut.\nExpériences et tests\n04/10/26 ; Observation et analyse de base ; Odeur douce, chair blanche immuable. ; Champignon potentiellement toxique.\n04/10/26 ; Ingestion (animal, très faible dose) ; Nausées rapides, vomissements, léthargie. ; Effet toxique digestif confirmé.\n04/10/26 ; Test sur extrait aqueux ; Troubles digestifs similaires. ; Composés actifs solubles dans l'eau.\n05/10/26 ; Test sur extrait purifié (faible dose) ; Effet anti-nauséeux sur animal intoxiqué par une autre toxine (vomissements). ; Effet calmant sur les nausées d'origine toxique.\n05/10/26 ; Comparaison avec extrait de gingembre ; Le gingembre agit plus rapidement, tandis que l'amanite a un effet plus durable. ; Mécanismes différents et complémentaires.","sections":[{"titre":"Conclusion générale","texte":"L'amanite livide est un champignon hautement toxique, provoquant des troubles digestifs sévères. Après purification et préparation spécifique, une fraction de ses composés peut être utilisée comme composant d'antidote contre certaines nausées et vomissements d'origine toxique. Son action est plus lente mais plus durable que celle du gingembre, ce qui en fait un complément intéressant dans certaines préparations. Une extrême prudence est indispensable en raison de sa forte toxicité."},{"titre":"Notes et observations personnelles","texte":"L'amanite livide est un champignon très dangereux, provoquant de violents troubles digestifs (nausées, vomissements, douleurs abdominales, déshydratation). Pendant un premier temps, aucun intérêt médicinal ne semblait se dégager. Cependant, après plusieurs essais et comparaisons, un extrait spécifiquement préparé et purifié semble capable d'atténuer certaines nausées et vomissements provoqués par d'autres toxines. Son action est plus lente que celle du gingembre, mais plus durable. La plante reste extrêmement dangereuse et nécessite une préparation minutieuse. Une mauvaise utilisation peut provoquer les mêmes effets toxiques qu'à l'état brut."},{"titre":"Expériences et tests","tableau":{"colonnes":["Date","Protocole","Résultat","Conclusion"],"lignes":[["04/10/26","Observation et analyse de base","Odeur douce, chair blanche immuable.","Champignon potentiellement toxique."],["04/10/26","Ingestion (animal, très faible dose)","Nausées rapides, vomissements, léthargie.","Effet toxique digestif confirmé."],["04/10/26","Test sur extrait aqueux","Troubles digestifs similaires.","Composés actifs solubles dans l'eau."],["05/10/26","Test sur extrait purifié (faible dose)","Effet anti-nauséeux sur animal intoxiqué par une autre toxine (vomissements).","Effet calmant sur les nausées d'origine toxique."],["05/10/26","Comparaison avec extrait de gingembre","Le gingembre agit plus rapidement, tandis que l'amanite a un effet plus durable.","Mécanismes différents et complémentaires."]]}}],"images":[{"full":"actualites/rapport-botanique-akira-amanite-livide.webp","mini":"actualites/rapport-botanique-akira-amanite-livide-mini.webp","legende":"Rapport botanique d'Akira Kaito — Amanite livide (04/10/2026 au 05/10/2026)","w":1055,"h":1491}]},"s":"data/actualites.json","p":"rapport-botanique-akira-amanite-livide.png"},"article_rapport_botanique_pavot_noir":{"l":"Rapport botanique : Pavot noir","c":"article","a":{"date":"2026-09-25","objet":"Découverte d'une nouvelle espèce","resume":"Le pavot noir est une plante contenant des composés puissants agissant sur l'état de vigilance.","corps":"Conclusion générale\nLe pavot noir est une plante contenant des composés puissants agissant sur l'état de vigilance. Sous sa forme brute, il provoque une somnolence marquée et peut être utilisé comme sédatif. Après purification et préparation spécifique (chauffe contrôlée), certains de ses composés peuvent être employés dans un antidote pour contrer des effets de somnolence provoqués par des substances ou poisons. Une grande prudence est nécessaire, car un mauvais dosage peut entraîner l'effet inverse.\nNotes et observations personnelles\nLes premiers tests montrent un clair effet de somnolence, que ce soit par inhalation ou ingestion. L'extrait brut semble particulièrement puissant. Cependant, après plusieurs essais et en modifiant la préparation (chauffe contrôlée et purification), j'observe un effet différent : les sujets restent plus éveillés et résistent mieux à une substance somnifère testée en parallèle. Il semble donc que certains composés du pavot noir puissent, une fois isolés et correctement préparés, servir à contrer des effets de somnolence provoqués par d'autres poisons ou substances. Une mauvaise préparation reste dangereuse et peut au contraire renforcer la somnolence.\nExpériences et tests\n25/09/26 ; Observation et analyse de base ; Odeur douce, latex blanchâtre. ; Base d'étude établie.\n25/09/26 ; Test sur chakra (Katon) ; Léger réchauffement, odeur plus forte. ; Certains composés sont sensibles à la chaleur.\n26/09/26 ; Test sur sang animal (petite dose) ; Aucun effet majeur. ; Pas d'action directe sur le sang.\n26/09/26 ; Inhalation de vapeur (faible dose) ; Sensation de calme, légère somnolence. ; Effet sur l'état de vigilance.\n27/09/26 ; Ingestion (animal, faible dose) ; Ralentissement, besoin de repos. ; Effet sédatif confirmé.\n27/09/26 ; Test d'extrait purifié (animal) ; Somnolence plus forte. ; La préparation brute accentue l'effet.\n28/09/26 ; Test d'extrait chauffé (animal) ; Sujet reste éveillé, semble moins affecté. ; Effet inverse : réduction de la somnolence.","sections":[{"titre":"Conclusion générale","texte":"Le pavot noir est une plante contenant des composés puissants agissant sur l'état de vigilance. Sous sa forme brute, il provoque une somnolence marquée et peut être utilisé comme sédatif. Après purification et préparation spécifique (chauffe contrôlée), certains de ses composés peuvent être employés dans un antidote pour contrer des effets de somnolence provoqués par des substances ou poisons. Une grande prudence est nécessaire, car un mauvais dosage peut entraîner l'effet inverse."},{"titre":"Notes et observations personnelles","texte":"Les premiers tests montrent un clair effet de somnolence, que ce soit par inhalation ou ingestion. L'extrait brut semble particulièrement puissant. Cependant, après plusieurs essais et en modifiant la préparation (chauffe contrôlée et purification), j'observe un effet différent : les sujets restent plus éveillés et résistent mieux à une substance somnifère testée en parallèle. Il semble donc que certains composés du pavot noir puissent, une fois isolés et correctement préparés, servir à contrer des effets de somnolence provoqués par d'autres poisons ou substances. Une mauvaise préparation reste dangereuse et peut au contraire renforcer la somnolence."},{"titre":"Expériences et tests","tableau":{"colonnes":["Date","Protocole","Résultat","Conclusion"],"lignes":[["25/09/26","Observation et analyse de base","Odeur douce, latex blanchâtre.","Base d'étude établie."],["25/09/26","Test sur chakra (Katon)","Léger réchauffement, odeur plus forte.","Certains composés sont sensibles à la chaleur."],["26/09/26","Test sur sang animal (petite dose)","Aucun effet majeur.","Pas d'action directe sur le sang."],["26/09/26","Inhalation de vapeur (faible dose)","Sensation de calme, légère somnolence.","Effet sur l'état de vigilance."],["27/09/26","Ingestion (animal, faible dose)","Ralentissement, besoin de repos.","Effet sédatif confirmé."],["27/09/26","Test d'extrait purifié (animal)","Somnolence plus forte.","La préparation brute accentue l'effet."],["28/09/26","Test d'extrait chauffé (animal)","Sujet reste éveillé, semble moins affecté.","Effet inverse : réduction de la somnolence."]]}}],"images":[{"full":"actualites/rapport-botanique-akira-pavot-noir.webp","mini":"actualites/rapport-botanique-akira-pavot-noir-mini.webp","legende":"Rapport botanique d'Akira Kaito — Pavot noir (25/09/2026 au 28/09/2026)","w":1055,"h":1491}]},"s":"data/actualites.json","p":"rapport-botanique-akira-pavot-noir.png"},"article_rapport_botanique_piment_ardent":{"l":"Rapport botanique : Piment ardent","c":"article","a":{"date":"2026-09-19","objet":"Découverte d'une nouvelle espèce","resume":"Le piment ardent est une plante stimulante, principalement grâce à ses composés piquants qui provoquent une augmentation de la circulation sanguine et une activation temporaire du métabolisme.","corps":"Conclusion générale\nLe piment ardent est une plante stimulante, principalement grâce à ses composés piquants qui provoquent une augmentation de la circulation sanguine et une activation temporaire du métabolisme. Il permet un regain rapide de vigueur et améliore l'assimilation des nutriments lorsqu'il est intégré à une préparation. Son effet est court et s'accompagne d'une fatigue importante en cas de surdosage. À utiliser avec précaution.\nNotes et observations personnelles\nLe piment ardent provoque une sensation de chaleur et une nette stimulation de la circulation sanguine. Il semble accélérer le métabolisme et permet une meilleure utilisation des nutriments lorsqu'il est combiné à d'autres ingrédients (ex : gingembre). L'effet est rapide mais de courte durée. Une surconsommation entraîne une forte fatigue et des irritations. Plante intéressante comme catalyseur dans des pilules de combattant, mais à utiliser avec prudence.\nExpériences et tests\n19/09/26 ; Observation et analyse de base ; Odeur très piquante, chaleur au toucher. ; Présence de composés actifs.\n19/09/26 ; Contact sur peau animale (petite dose) ; Rougeur, chaleur, augmentation du flux sanguin local. ; Effet irritant et stimulant circulatoire.\n20/09/26 ; Test sur système digestif (animal) ; Température corporelle légèrement augmentée, rythme cardiaque plus rapide. ; Effet stimulant général confirmé.\n20/09/26 ; Test avec alimentation nutritive ; Assimilation plus rapide, meilleure endurance chez l'animal. ; Potentialise l'utilisation des nutriments.\n21/09/26 ; Test de surdose (animal) ; Forte agitation, transpiration, épuisement rapide. ; Effet court avec contrecoups importants.","sections":[{"titre":"Conclusion générale","texte":"Le piment ardent est une plante stimulante, principalement grâce à ses composés piquants qui provoquent une augmentation de la circulation sanguine et une activation temporaire du métabolisme. Il permet un regain rapide de vigueur et améliore l'assimilation des nutriments lorsqu'il est intégré à une préparation. Son effet est court et s'accompagne d'une fatigue importante en cas de surdosage. À utiliser avec précaution."},{"titre":"Notes et observations personnelles","texte":"Le piment ardent provoque une sensation de chaleur et une nette stimulation de la circulation sanguine. Il semble accélérer le métabolisme et permet une meilleure utilisation des nutriments lorsqu'il est combiné à d'autres ingrédients (ex : gingembre). L'effet est rapide mais de courte durée. Une surconsommation entraîne une forte fatigue et des irritations. Plante intéressante comme catalyseur dans des pilules de combattant, mais à utiliser avec prudence."},{"titre":"Expériences et tests","tableau":{"colonnes":["Date","Protocole","Résultat","Conclusion"],"lignes":[["19/09/26","Observation et analyse de base","Odeur très piquante, chaleur au toucher.","Présence de composés actifs."],["19/09/26","Contact sur peau animale (petite dose)","Rougeur, chaleur, augmentation du flux sanguin local.","Effet irritant et stimulant circulatoire."],["20/09/26","Test sur système digestif (animal)","Température corporelle légèrement augmentée, rythme cardiaque plus rapide.","Effet stimulant général confirmé."],["20/09/26","Test avec alimentation nutritive","Assimilation plus rapide, meilleure endurance chez l'animal.","Potentialise l'utilisation des nutriments."],["21/09/26","Test de surdose (animal)","Forte agitation, transpiration, épuisement rapide.","Effet court avec contrecoups importants."]]}}],"images":[{"full":"actualites/rapport-botanique-akira-piment-ardent.webp","mini":"actualites/rapport-botanique-akira-piment-ardent-mini.webp","legende":"Rapport botanique d'Akira Kaito — Piment ardent (19/09/2026 au 21/09/2026)","w":1055,"h":1491}]},"s":"data/actualites.json","p":"rapport-botanique-akira-piment-ardent.png"}},"edges":[["section_science_de_la_vie","org_la_scientifique","partie_de",0],["section_technologie","org_la_scientifique","partie_de",0],["sous_section_alchimie_botanique","org_la_scientifique","pole_de",0],["sous_section_alchimie_botanique","section_science_de_la_vie","partie_de",1],["personne_sora_tori","sous_section_alchimie_botanique","dirige + membre_de",0],["personne_akira_kaito","sous_section_alchimie_botanique","membre_de",0],["personne_ayaka_soryo","sous_section_alchimie_botanique","membre_de",0],["personne_dandan","sous_section_alchimie_botanique","membre_de",0],["personne_hayato_kazuha","sous_section_alchimie_botanique","membre_de",0],["personne_jin_ichinose","sous_section_alchimie_botanique","membre_de",0],["personne_saiki_sozen","sous_section_alchimie_botanique","membre_de",0],["personne_senma_kojiro","sous_section_alchimie_botanique","membre_de",0],["personne_yume_aoki","sous_section_alchimie_botanique","membre_de",0],["sous_section_artificier","org_la_scientifique","pole_de",0],["sous_section_astronomie","org_la_scientifique","pole_de",0],["sous_section_biologie","org_la_scientifique","pole_de",0],["sous_section_biologie","section_science_de_la_vie","partie_de",1],["personne_akira_kaito","sous_section_biologie","membre_de",0],["personne_hayato_kazuha","sous_section_biologie","membre_
