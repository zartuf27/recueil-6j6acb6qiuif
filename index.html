er.\n\nEn cas de doute, il doit demander des explications à un responsable ou à un scientifique compétent.\n\n### Article 3 — Activité\n\nChaque membre est encouragé à participer régulièrement à la vie de la Scientifique.\n\nIl n'est pas nécessaire d'être constamment présent, mais la Scientifique doit rester suffisamment active pour permettre :\n\n- la formation ;\n- les recherches ;\n- les expériences ;\n- les échanges entre scientifiques ;\n- l'accueil des stagiaires.\n\n## III. Présence sur le domaine\n\nLe domaine de la Scientifique doit, dans la mesure du possible, rester régulièrement fréquenté.\n\nLorsqu'un membre passe sur le domaine, il est encouragé à vérifier si une activité est en cours et à participer si son aide est nécessaire.\n\nL'objectif est d'éviter que les laboratoires et les installations restent inutilisés pendant de longues périodes.\n\nLa présence peut également permettre aux stagiaires de trouver facilement des scientifiques auprès desquels apprendre.\n\n## IV. Appels radio\n\nLorsqu'un scientifique a besoin d'aide, il peut effectuer un appel à la radio.\n\nIl peut demander :\n\n- un scientifique spécifique ;\n- plusieurs scientifiques ;\n- un responsable ;\n- un membre possédant une compétence particulière ;\n- ou simplement demander la présence de scientifiques disponibles.\n\nLes appels doivent rester clairs et permettre aux personnes concernées de comprendre rapidement :\n\n> qui est recherché, pourquoi et où.\n\nLes stagiaires peuvent également répondre à ces appels lorsqu'ils sont disponibles.\n\nIls peuvent alors accompagner les scientifiques et observer ou participer dans la limite de leurs capacités et de leur niveau de formation.\n\n## V. Intégration des stagiaires\n\nLes stagiaires ne doivent pas être considérés uniquement comme des personnes qui restent dans une salle à attendre leur formation.\n\nIls sont encouragés à découvrir concrètement la vie de la Scientifique.\n\nLorsqu'une activité est organisée, les stagiaires peuvent être invités à suivre les scientifiques afin d'observer :\n\n- les expériences ;\n- les recherches ;\n- les analyses ;\n- les missions ;\n- les déplacements scientifiques ;\n- les interventions ;\n- les travaux de laboratoire ;\n- les petites comme les grandes opérations.\n\nL'objectif est de leur permettre de voir la réalité du métier de leurs propres yeux.\n\n## VI. Apprendre par l'expérience\n\nL'observation et l'expérience font partie intégrante de la formation.\n\nUn stagiaire peut ainsi découvrir une situation qu'il n'aurait jamais pu comprendre uniquement à travers un cours.\n\nLes scientifiques sont donc encouragés à expliquer aux stagiaires :\n\n- ce qu'ils font ;\n- pourquoi ils le font ;\n- quels problèmes ils rencontrent ;\n- quelles précautions sont nécessaires ;\n- quelles connaissances sont utilisées.\n\nLe stagiaire peut poser des questions pendant ou après l'activité.\n\n## VII. Sécurité des stagiaires\n\nLa Scientifique souhaite permettre aux stagiaires de découvrir la réalité du terrain, y compris les difficultés et les dangers qui peuvent exister.\n\nCependant, un stagiaire ne doit pas être volontairement placé en danger.\n\nLes scientifiques et responsables présents doivent faire leur possible pour :\n\n- protéger les stagiaires ;\n- éviter de les exposer inutilement ;\n- leur expliquer les dangers présents ;\n- adapter leur participation à leur niveau ;\n- intervenir si une situation devient trop dangereuse.\n\nLa présence d'un danger ne signifie donc pas automatiquement que le stagiaire doit être éloigné de toute activité.\n\nL'objectif est de lui permettre d'apprendre sans l'exposer inutilement.\n\n### Exception : missions spécifiques\n\nCertaines missions peuvent présenter des risques particuliers.\n\nDans ce cas, la participation d'un stagiaire peut être :\n\n- limitée ;\n- interdite ;\n- ou autorisée uniquement sous certaines conditions.\n\nLa décision revient au responsable de la mission ou à la hiérarchie présente.\n\n## VIII. Cours et transmission\n\nLes cours peuvent être dispensés par :\n\n- le Gérant ;\n- les Co-gérants ;\n- les Sous-chefs ;\n- les Recruteurs ;\n- les scientifiques des laboratoires autorisés à former.\n\nLes cours peuvent porter sur toutes les connaissances utiles au développement du stagiaire.\n\nChaque formateur est libre d'adapter son enseignement au niveau de la personne qu'il accompagne.\n\n## IX. Laboratoires et formation\n\nLes membres des laboratoires peuvent participer activement à la formation.\n\nIls peuvent :\n\n- faire assister les stagiaires à leurs travaux ;\n- expliquer leurs expériences ;\n- montrer leurs méthodes ;\n- répondre aux questions ;\n- transmettre leurs connaissances ;\n- faire découvrir différentes spécialisations ;\n- permettre aux stagiaires d'observer le fonctionnement réel d'un laboratoire.\n\nUn stagiaire présent dans un laboratoire n'est cependant pas automatiquement autorisé à réaliser les mêmes tâches que les scientifiques confirmés.\n\nSes responsabilités doivent rester adaptées à son niveau.\n\n## X. Rapports et spécialisation\n\nLorsqu'un stagiaire découvre une expérience, une recherche ou une spécialisation qui l'intéresse particulièrement, il peut demander à approfondir ce domaine.\n\nIl peut alors être amené à réaliser un rapport.\n\nLe rapport peut présenter :\n\n- ce qu'il a observé ;\n- ce qu'il a appris ;\n- ce qu'il a compris ;\n- ce qui l'intéresse ;\n- les questions qu'il se pose ;\n- les connaissances qu'il souhaite approfondir ;\n- la spécialisation qu'il souhaiterait éventuellement suivre.\n\nCes rapports permettent aux responsables de suivre la progression du stagiaire et d'identifier ses domaines de prédilection.\n\n## XI. Entretiens\n\nLes Gérant, Co-gérants, Sous-chefs et Recruteurs peuvent organiser des entretiens avec les stagiaires.\n\nCes entretiens permettent notamment de vérifier :\n\n- leurs connaissances ;\n- leur progression ;\n- leur motivation ;\n- leur compréhension des règles ;\n- leur capacité à travailler ;\n- leurs domaines d'intérêt ;\n- leur aptitude à recevoir davantage de responsabilités.\n\nUn entretien peut également servir à transmettre de nouvelles informations au stagiaire.\n\n## XII. Accès aux responsabilités\n\nUn stagiaire ne peut pas obtenir automatiquement des responsabilités simplement parce qu'il est présent depuis longtemps.\n\nLa progression dépend de ses connaissances et de ses capacités.\n\nAvant de lui permettre de tenir un laboratoire ou d'obtenir davantage de responsabilités, les responsables doivent notamment vérifier :\n\n- qu'il possède suffisamment de connaissances ;\n- qu'il comprend les procédures ;\n- qu'il connaît les règles de sécurité ;\n- qu'il sait utiliser correctement le matériel concerné ;\n- qu'il est suffisamment autonome ;\n- que son dossier/casier contient les informations nécessaires.\n\n## XIII. Mise en attente\n\nLorsqu'un stagiaire n'est pas encore prêt, il peut être placé provisoirement en attente.\n\nCette décision n'est pas nécessairement une sanction.\n\nElle signifie simplement :\n\n> Le stagiaire doit encore apprendre avant de pouvoir poursuivre sa progression.\n\nPendant cette période, il peut continuer à :\n\n- suivre des cours ;\n- observer les scientifiques ;\n- assister aux activités ;\n- recevoir des informations ;\n- participer aux appels radio ;\n- compléter son dossier ;\n- réaliser des rapports ;\n- corriger ses lacunes.\n\nEn revanche, il ne peut pas :\n\n- reprendre un laboratoire sans autorisation ;\n- prendre des responsabilités supérieures ;\n- avancer vers l'étape suivante de sa formation sans validation.\n\nUne nouvelle évaluation peut être organisée lorsque les responsables estiment qu'il est prêt.\n\n## XIV. Validation et Haut Conseil\n\nLorsqu'un stagiaire possède suffisamment de connaissances et démontre qu'il est prêt, la hiérarchie peut décider de le proposer pour une rencontre avec le Haut Conseil.\n\nCette étape permet de déterminer si le stagiaire est prêt à poursuivre son parcours et à commencer réellement son travail au sein de la Scientifique.\n\nLa rencontre avec le Haut Conseil ne doit donc intervenir qu'après une préparation suffisante.\n\nLe principe est :\n\n> Formation → Observation → Rapports → Évaluation → Validation → Rencontre avec le Haut Conseil → Début du travail.\n\n## XV. Autorité et responsabilités\n\nLe Gérant, les Co-gérants, les Sous-chefs et les Recruteurs peuvent participer à la formation et au suivi des stagiaires.\n\nLes membres des laboratoires possèdent également un rôle important dans la transmission des connaissances.\n\nIls peuvent apprendre aux stagiaires, les accompagner et leur faire découvrir leur domaine de compétence.\n\nToutefois, les décisions importantes concernant :\n\n- l'accès à un laboratoire ;\n- la progression d'un stagiaire ;\n- la mise en attente ;\n- la levée d'une mise en attente ;\n- la validation d'un parcours ;\n- la présentation au Haut Conseil ;\n\ndoivent être prises ou validées par la hiérarchie compétente.\n\n## XVI. Future École scientifique\n\nLa Scientifique pourra, dans un futur proche, développer une École Scientifique de Konoha.\n\nCette école n'est pas encore créée et ne fait donc pas partie de l'organisation actuelle.\n\nLorsqu'elle verra le jour, elle pourra notamment permettre :\n\n- une formation plus structurée ;\n- des cours réguliers ;\n- des évaluations ;\n- des spécialisations ;\n- des rapports pédagogiques ;\n- un suivi plus précis des élèves ;\n- une préparation à l'intégration professionnelle au sein de la Scientifique.\n\nLes règles actuelles pourront servir de base à son fonctionnement futur.\n\n## XVII. Principe final\n\nLa Scientifique de Konoha repose sur une idée simple :\n\n> Un scientifique ne devient pas compétent uniquement en lisant ou en écoutant. Il doit apprendre, observer, comprendre et vivre les situations.\n\nLes stagiaires doivent donc pouvoir découvrir la Scientifique de l'intérieur, suivre les scientifiques, assister aux laboratoires, participer aux activités et observer les missions lorsque cela est possible.\n\nLa Scientifique doit cependant toujours chercher à trouver un équilibre entre expérience et sécurité.\n\nLe but n'est pas de cacher les dangers aux stagiaires, mais de leur apprendre à les comprendre et à les gérer correctement.\n\n> Écouter. Comprendre. Observer. Expérimenter. Apprendre. Puis devenir autonome.\n","depot":{"webhook":"https://discord.com/api/webhooks/1556847247499599943/PDcDHcyFc8ZYVQJrbUXIDdex8YqrIQ6es1e06vBCibguFkAHnsw72axqSPhOE-rBvqFi","grosFichiers":"https://docs.google.com/forms/d/e/1FAIpQLSd-jNbCcRtowUZJnrV-euEk6fWWuYmo2sieCcjTNkw5LRAFbw/viewform","relais":"https://script.google.com/macros/s/AKfycbxz95rudT4bW31k7GJ9M7Zz-F7Ak5bCDOHJkBpY68715FTYbhhjC4X6dvR96g6HAH4tyQ/exec"}};</script>

function fmtVal(k, v, self) {

function relationsBlock(id, exclude = new Set()) {

function pageSearch(q) {

  let h = `<div class="wrap">${crumbs("Recherche")}<h1>${exact.length ? "Dossier : " : "Recherche : "}« ${esc(q)} »</h1>`;
  const shown = new Set(exact);
  exact.forEach(id => {
    const n = N[id];
    h += `<section class="card accent"><div class="actions" style="margin:0 0 8px">${chip(n.c)}${favBtn(id)}
      <a class="btn" href="${href(id)}">Ouvrir la fiche →</a></div>

      ${n.c === "personne" ? personSummary(id) : snippet(id, ["description", "proprietes", "principe", "statut"])}
      ${miniGraph(id)}</section>`;
    const rel = [...new Set([...neighbors(id), ...MENT_IN[id], ...MENT_OUT[id]])].filter(x => N[x] && !exact.includes(x));
    if (rel.length) h += `<h2>Lié à ${esc(lbl(id))} (${rel.length})</h2>` + grouped(rel, x => {
      const e = [...OUT[id].filter(o => o.id === x).map(o => (REL[o.r] || [human(o.r)])[0]),
                 ...IN[id].filter(o => o.id === x).map(o => (REL[o.r] || [, human(o.r)])[1] || human(o.r))];
      const why = e.length ? [...new Set(e)].join(", ") : MENT_IN[id].has(x) ? "le cite dans son texte" : "cité dans son texte";
      return `<div class="ctx">${esc(why)}</div>${context(x, q)}`;
    });
    rel.forEach(x => shown.add(x));
  });
  const rest = hits.filter(x => !shown.has(x));
  h += rest.length ? `<h2>${exact.length ? "Autres mentions" : "Résultats"} (${rest.length})</h2>` + grouped(rest, x => context(x, q))
    : exact.length ? "" : empty("Aucun résultat");
  return h + `</div>`;
}
function grouped(ids, extra) {
  const g = {};
  ids.forEach(i => (g[N[i].c] ||= []).push(i));
  const order = Object.keys(CAT);
  return Object.keys(g).sort((a, b) => order.indexOf(a) - order.indexOf(b)).map(c =>
    `<h3>${esc((CAT[c] || {}).s || c)} (${g[c].length})</h3><ul class="hit-list">${g[c].sort(byPrio).map(i => `<li>${ref(i)} ${chip(N[i].c, false)}${mineBadge(i)}${extra(i)}</li>`).join("")}</ul>`).join("");
}
function context(id, q) {
  const fq = fold(q);
  if (!fq) return "";
  for (const t of texts(N[id])) {
    const ft = fold(t), k = ft.indexOf(fq);
    if (k < 0) continue;
    const a = Math.max(0, k - 70), b = Math.min(t.length, k + fq.length + 70);
    return `<div class="ctx">${a ? "…" : ""}${esc(t.slice(a, k))}<mark>${esc(t.slice(k, k + fq.length))}</mark>${esc(t.slice(k + fq.length, b))}${b < t.length ? "…" : ""}</div>`;
  }
  return "";
}

  const roleList = role => D.gestion.filter(g => g.role === role && g.personne).map(g => `<li>${P(g.personne)}</li>`).join("");
  const box = (cls, t, h, body) => `<div class="onode ${cls}"><div class="t">${t}</div><div class="h">${h}</div>${body || ""}</div>`;
  const direction = ["Gérant", "Co-gérant"].map(r => D.gestion.filter(g => g.role === r && g.personne).map(g => `<div><span class="small muted">${r} · </span>${P(g.personne)}</div>`).join("")).join("");
  const council = [["Sous-Chef", "Conseil", "Sous-chefs"], ["Laborantin", "Laboratoire", "Laborantins"], ["Assistant", "Assistance", "Assistants"]]
    .map(([r, t, h]) => `<li>${box("dir", t, h, `<ul class="p">${roleList(r)}</ul>`)}</li>`).join("");
  const poleBox = p => {

      <div class="card"><h4 style="margin-top:0">Membres sans pôle (${sansPole.length})</h4><ul style="padding-left:18px;margin:0">${sansPole.map(p => `<li>${op(p)}</li>`).join("") || "<li class='muted'>—</li>"}</ul></div>

function orgInteractions() {
  const vp = $("#vp"), cv = $("#cv");
  let z = 1;
  const setZ = v => { z = Math.min(2, Math.max(0.2, v)); cv.style.transform = `scale(${z})`; cv.style.marginBottom = `${(z - 1) * cv.offsetHeight}px`; cv.style.marginRight = `${(z - 1) * cv.offsetWidth}px`; };
  const fit = () => setZ(Math.min(1, (vp.clientWidth - 16) / cv.offsetWidth));
  $("#zIn").onclick = () => setZ(z + 0.15); $("#zOut").onclick = () => setZ(z - 0.15); $("#z1").onclick = () => setZ(1); $("#zFit").onclick = fit;
  setZ(Math.max(0.7, Math.min(1, (vp.clientWidth - 16) / cv.offsetWidth)));  // lisible d'emblée, centré sur la racine
  vp.scrollLeft = (vp.scrollWidth - vp.clientWidth) / 2;
  vp.addEventListener("wheel", e => { if (!e.ctrlKey) return; e.preventDefault(); setZ(z - Math.sign(e.deltaY) * 0.1); }, { passive: false });
  let drag = null;
  vp.addEventListener("pointerdown", e => { if (e.target.closest("a") || e.button !== 0) return; drag = { x: e.clientX, y: e.clientY, l: vp.scrollLeft, t: vp.scrollTop }; vp.classList.add("drag"); vp.setPointerCapture(e.pointerId); });
  vp.addEventListener("pointermove", e => { if (!drag) return; vp.scrollLeft = drag.l - (e.clientX - drag.x); vp.scrollTop = drag.t - (e.clientY - drag.y); });
  const stop = () => { drag = null; vp.classList.remove("drag"); };
  vp.addEventListener("pointerup", stop); vp.addEventListener("pointercancel", stop);
  const all = () => [...document.querySelectorAll(".op[data-p]")];
  document.querySelector(".layout").addEventListener("mouseover", e => {
    const a = e.target.closest(".op[data-p]");
    all().forEach(x => x.classList.toggle("hl", !!a && x.dataset.p === a.dataset.p));
  });
  $("#ofind").addEventListener("input", e => {
    const q = fold(e.target.value.trim());
    const hits = all().filter(x => q && fold(x.textContent).includes(q));
    all().forEach(x => x.classList.toggle("found", hits.includes(x)));
    $("#ofound").textContent = q ? `${new Set(hits.map(h => h.dataset.p)).size} personne(s), ${hits.length} position(s)` : "";
    if (hits[0]) hits[0].scrollIntoView({ block: "center", inline: "center", behavior: "smooth" });
  });
}

const SEARCH = ID.map(id => ({ id, l: fold(N[id].l), a: fold([N[id].a.alias || "", N[id].a.autres_noms || ""].join(" ")), t: fold(texts(N[id]).join(" ")) }));
function search(q, limit = 8) {
  q = fold(q.trim()); if (!q) return [];
  const words = q.split(/\s+/);
  return SEARCH.map(s => {
    let sc = 0;
    if (s.l === q) sc += 100; else if (s.l.startsWith(q)) sc += 60; else if (s.l.includes(q)) sc += 40;
    if (s.a.includes(q)) sc += 30;
    if (words.every(w => s.l.includes(w) || s.a.includes(w) || s.t.includes(w))) sc += 10; else if (sc === 0) return null;
    if (N[s.id].c === "recette") sc -= 5;
    return { id: s.id, sc };
  }).filter(Boolean).map(x => ({ ...x, sc: x.sc + Math.min(score(x.id), 8) })).sort((a, b) => b.sc - a.sc || sortFr(a.id, b.id)).slice(0, limit).map(x => x.id);
}
function setupSearch() {
  const input = $("#q"), box = $("#suggest");
  let sel = -1, res = [];
  const draw = () => {
    res = search(input.value);
    box.innerHTML = res.map((id, i) => `<a href="${href(id)}" class="${i === sel ? "sel" : ""}" role="option"><span>${esc(lbl(id))}</span>${chip(N[id].c, false)}</a>`).join("")
      + (input.value.trim() ? `<a href="#/recherche/${encodeURIComponent(input.value.trim())}"><span class="muted">Tous les résultats pour « ${esc(input.value.trim())} »</span></a>` : "");
    box.classList.toggle("open", !!input.value.trim());
  };
  input.addEventListener("input", () => { sel = -1; draw(); });
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { sel = Math.min(res.length - 1, sel + 1); draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { sel = Math.max(-1, sel - 1); draw(); e.preventDefault(); }
    else if (e.key === "Enter") { location.hash = sel >= 0 ? href(res[sel]) : "#/recherche/" + encodeURIComponent(input.value.trim()); close(); }
    else if (e.key === "Escape") close();
  });
  const close = () => { box.classList.remove("open"); input.blur(); };
  document.addEventListener("click", e => { if (!e.target.closest(".search")) box.classList.remove("open"); else if (e.target.closest(".suggest a")) { box.classList.remove("open"); input.value = ""; } });
  document.addEventListener("keydown", e => { if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); input.focus(); } });
}

let LABO = (() => { try { const v = JSON.parse(localStorage.getItem("recueil-labo")); return v && Array.isArray(v.poles) ? { poles: v.poles } : { poles: [] }; } catch (e) { return { poles: [] }; } })();
LABO.poles = LABO.poles.filter(x => N[x]);
let SCORE = {}, POURQUOI = {};
function calcScores() {
  SCORE = {}; POURQUOI = {};
  const add = (id, pts, why) => { if (!N[id] || LABO.poles.includes(id)) return; SCORE[id] = (SCORE[id] || 0) + pts; (POURQUOI[id] ||= new Set()).add(why); };
  LABO.poles.forEach(pole => {
    const nom = lbl(pole);
    const membres = neighbors(pole, ["membre_de", "dirige"], "in");
    const direct = neighbors(pole);
    direct.forEach(x => add(x, 6, "rattaché à " + nom));
    membres.forEach(m => neighbors(m, ["porte", "auteur_de", "a_participe"], "out").forEach(x => add(x, 3, "travail d'un membre de " + nom)));
    (D.corpusPole[pole] || []).flatMap(byCat).forEach(x => add(x, 3, "corpus de " + nom));
    MENT_IN[pole].forEach(x => add(x, 2, "cite " + nom));
    const premier = new Set([...direct, ...(D.corpusPole[pole] || []).flatMap(byCat)]);
    premier.forEach(x => neighbors(x).forEach(y => { if (!premier.has(y) && N[y].c !== "personne") add(y, 1, "lié au corpus de " + nom); }));
  });
}
const score = id => SCORE[id] || 0;

// Découpe un texte en morceaux d'au plus n caractères, de préférence entre deux paragraphes, sinon entre deux mots
const decoupe = (t, n) => {
  const out = [];
  while (t.length > n) {
    let i = t.lastIndexOf("\n", n);
    if (i < n / 2) i = t.lastIndexOf(" ", n);
    if (i < n / 2) i = n;
    out.push(t.slice(0, i).trimEnd()); t = t.slice(i).replace(/^\s+/, "");
  }
  return t ? [...out, t] : out;
};
// Nom d'expéditeur du message : Discord refuse ceux qui contiennent « discord » ou « clyde » (le nom reste dans le champ Personnage)
const expediteur = nom => /discord|clyde/i.test(nom) ? "Dépôt de recherche" : ("Dépôt · " + nom).slice(0, 80);
async function envoyerDepot(d, fichiers, progres) {
  const poleNom = d.pole === "autre" ? "Plusieurs pôles / autre" : d.pole ? lbl(d.pole) : "Non précisé";
  // Tout le texte s'affiche dans le salon : la description d'un embed est limitée à 4 096 caractères, la suite part en messages « suite »
  const morceaux = decoupe(d.texte, 3800);
  const lots = lotsFichiers(fichiers);
  const titre = d.titre.slice(0, 150).replace(/[*_~`|>]/g, "");
  const image = lots[0].find(f => /^image\/(png|jpeg|gif|webp)$/.test(f.type));
  const suite = (k, n) => n > 1 ? ` · texte ${k}/${n}` : "";
  const messages = [{
    embeds: [{
      title: d.titre.slice(0, 256), color: 0x356A84, timestamp: new Date().toISOString(),
      description: morceaux[0] || "*(voir les pièces jointes)*",
      fields: [{ name: "Personnage", value: d.nom.slice(0, 80), inline: true }, { name: "Pôle", value: poleNom, inline: true },
               { name: "Type", value: d.type, inline: true }, ...(fichiers.length ? [{ name: "Pièces jointes", value: String(fichiers.length), inline: true }] : [])],
      footer: { text: "Recueil de la Scientifique · dépôt de recherche" + suite(1, morceaux.length) },
      ...(image ? { image: { url: "attachment://" + nomFichier(image.name) } } : {}),
    }], files: lots[0],
  },
  ...morceaux.slice(1).map((m, i) => ({ embeds: [{ color: 0x356A84, description: m, footer: { text: titre + suite(i + 2, morceaux.length) } }], files: [] })),
  ...lots.slice(1).map((lot, i) => ({ content: `Pièces jointes (suite ${i + 2}/${lots.length}) — **${titre}**`, files: lot }))];
  await posterWebhook(D.depot.webhook, expediteur(d.nom), messages, progres);
}
// Dépôt confié au relais de la gestion : il attend dans « Dépôts à valider » que l'administrateur le publie ou le refuse.
// Seules les images suivent (20 Mo au plus) : elles illustreront l'article ; les autres fichiers restent dans le salon.
async function confierDepot(d, fichiers) {
  let poids = 0;
  const images = fichiers.filter(f => /^image\/(png|jpeg|gif|webp)$/.test(f.type) && (poids += f.size) <= 2 * DEPOT_MAX);
  const depot = { nom: d.nom, pole: d.pole, pole_nom: d.pole === "autre" ? "Plusieurs pôles / autre" : d.pole ? lbl(d.pole) : "", type: d.type, titre: d.titre, texte: d.texte };
  return appelRelais({ type: "depot", depot, fichiers: await Promise.all(images.map(async f => ({ nom: nomFichier(f.name), type: f.type, base64: await base64(f) }))) });
}
const base64 = f => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = () => ko(new Error("lecture de " + f.name)); r.readAsDataURL(f); });
// Appel au relais Google Apps Script. Corps en text/plain : pas de requête préalable CORS, que le relais ne sait pas traiter.
async function appelRelais(corps) {
  let r;
  try { r = await fetch(D.depot.relais, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(corps) }); }
  catch (e) { throw new Error("relais injoignable"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) throw new Error(j.erreur || "erreur " + r.status);
  return j;
}
// Lots de pièces jointes : 10 fichiers et 10 Mo au plus par message
function lotsFichiers(fichiers) {
  const lots = [[]]; let poids = 0;
  fichiers.forEach(f => {
    const lot = lots[lots.length - 1];
    if (lot.length && (lot.length >= 10 || poids + f.size > DEPOT_MAX)) { lots.push([f]); poids = f.size; } else { lot.push(f); poids += f.size; }
  });

async function posterWebhook(url, username, messages, progres) {
  for (let k = 0; k < messages.length; k++) {
    progres(k + 1, messages.length);
    if (k) await new Promise(ok => setTimeout(ok, 500));  // le salon accepte environ 5 messages toutes les 2 secondes
    const { files, ...m } = messages[k];
    const fd = new FormData();
    fd.append("payload_json", JSON.stringify({ username, allowed_mentions: { parse: [] }, ...m }));  // aucune mention @everyone possible
    files.forEach((f, i) => fd.append(`files[${i}]`, f, nomFichier(f.name)));
    let r = await fetch(url + "?wait=true", { method: "POST", body: fd });
    if (r.status === 429) {  // trop d'envois d'affilée : on attend le délai demandé, une seule fois
      const j = await r.json().catch(() => ({}));
      await new Promise(ok => setTimeout(ok, Math.min(10, j.retry_after || 2) * 1000));
      r = await fetch(url + "?wait=true", { method: "POST", body: fd });
    }
    if (!r.ok) throw new Error(r.status === 413 ? "pièces jointes trop lourdes" : r.status === 404 ? "envois fermés" : "erreur " + r.status);
  }
}

// Lit le formulaire et prépare la demande : { titre, lignes (message lisible), texte, donnees (demande.json) } ou { erreur, champ }
function demandeGestion(action, cible, fichiers) {
  const par = gVal("par");
  if (!par) return { erreur: "Indiquez qui fait la demande.", champ: "par" };
  const fichePolesRoles = () => ({ statut: gVal("statut"), rang: gVal("rang") || null, poles: gPoles(), roles: listeVirgules(gVal("roles")) });
  const polesLisibles = ps => ps.length ? ps.map(lbl).join(", ") : "aucun";
  if (action === "article") {
    const titre = gVal("titre"), texte = gVal("texte"), auteur = gVal("auteur");
    if (!titre) return { erreur: "Donnez un titre à l'article.", champ: "titre" };
    if (!texte) return { erreur: "Écrivez le texte de l'article.", champ: "texte" };
    const auteurId = byCat("personne").find(p => lbl(p).toLowerCase() === auteur.toLowerCase()) || null;
    const images = fichiers.map(f => ({ src: nomFichier(f.name), legende: titre }));
    return { titre: "Publier un article : " + titre, texte, lignes: [["Auteur", auteur || "non précisé"], ["Date", gVal("date") || "non précisée"], ["Pôles", polesLisibles(gPoles())], ...(gVal("objet") ? [["Objet", gVal("objet")]] : []), ...(gVal("resume") ? [["Résumé", gVal("resume")]] : [])],
      donnees: { id: "article_" + slugFr(titre), titre, date: gVal("date") || null, auteur: auteurId, auteur_nom: auteur || null, objet: gVal("objet") || null,
        poles: gPoles(), resume: gVal("resume") || null, images, sections: sectionsDeTexte(texte), texte_brut: texte } };
  }
  if (action === "membre-ajout") {
    const nom = gVal("nom");
    if (!nom) return { erreur: "Indiquez le nom du nouveau membre.", champ: "nom" };
    const deja = byCat("personne").find(p => lbl(p).toLowerCase() === nom.toLowerCase());
    if (deja) return { erreur: `${lbl(deja)} est déjà dans le Recueil : utilisez « Modifier un membre ».`, champ: "nom" };
    const f = fichePolesRoles();
    return { titre: "Ajouter un membre : " + nom, texte: gVal("remarque"),
      lignes: [["Statut", f.statut], ["Rang", f.rang || "non précisé"], ["Pôles", polesLisibles(f.poles)], ["Rôles", f.roles.join(", ") || "aucun"]],
      donnees: { nom, ...f, remarque: gVal("remarque") || null } };
  }
  if (action === "membre-modif" || action === "membre-retrait") {
    if (!N[cible] || N[cible].c !== "personne") return { erreur: "Choisissez le membre.", champ: "membre" };
    const avant = membreActuel(cible);
    if (action === "membre-retrait") {
      const devient = gVal("devient");
      return { titre: "Retirer un membre : " + avant.nom, texte: gVal("motif"),
        lignes: [["Devient", devient === "retire" ? "retiré du Recueil" : "ancien membre"], ["Pôles actuels", polesLisibles(avant.poles)]],
        donnees: { id: cible, nom: avant.nom, devient, motif: gVal("motif") || null } };
    }
    const apres = { nom: gVal("nom"), ...fichePolesRoles() };
    if (!apres.nom) return { erreur: "Le nom ne peut pas être vide.", champ: "nom" };
    const lisible = (k, v) => k === "poles" ? polesLisibles(v) : Array.isArray(v) ? v.join(", ") || "aucun" : v || "non précisé";
    const NOMS = { nom: "Nom", statut: "Statut", rang: "Rang", poles: "Pôles", roles: "Rôles" };
    const changes = Object.keys(NOMS).filter(k => JSON.stringify(k === "poles" || k === "roles" ? [...(avant[k] || [])].sort() : avant[k] || null)
      !== JSON.stringify(k === "poles" || k === "roles" ? [...(apres[k] || [])].sort() : apres[k] || null));
    if (!changes.length && !gVal("remarque")) return { erreur: "Aucun changement : modifiez au moins un champ.", champ: "nom" };
    return { titre: "Modifier un membre : " + avant.nom, texte: gVal("remarque"),
      lignes: changes.map(k => [NOMS[k], `${lisible(k, avant[k])} → ${lisible(k, apres[k])}`]),
      donnees: { id: cible, avant, apres, changements: changes, remarque: gVal("remarque") || null } };
  }
  if (action === "reglement") {
    const texte = val("g-texte").replace(/\r\n/g, "\n").trim();
    if (texte.length < 20) return { erreur: "Le règlement est vide.", champ: "texte" };
    if (texte === String(D.reglement).trim()) return { erreur: "Aucun changement : modifiez le texte.", champ: "texte" };
    return { titre: "Modifier le règlement", texte: "", lignes: [["Longueur", `${texte.length} caractères`]], donnees: { id: "reglement", texte } };
  }
  const sujet = gVal("sujet"), texte = gVal("texte");
  if (!sujet) return { erreur: "Indiquez le sujet de la demande.", champ: "sujet" };
  if (!texte) return { erreur: "Décrivez votre demande.", champ: "texte" };
  return { titre: sujet, texte, lignes: [], donnees: { sujet, texte } };
}
// Texte d'article -> sections au format des Actualités (## titre, - liste, > citation, ligne vide = paragraphe)
function sectionsDeTexte(t) {
  const out = []; let cur = null;
  const nouvelle = titre => { cur = titre ? { titre } : {}; out.push(cur); };
  for (const brut of t.split("\n")) {
    const l = brut.trim();
    if (/^#{1,3}\s/.test(l)) { nouvelle(l.replace(/^#+\s*/, "")); continue; }
    if (/^>/.test(l)) { out.push({ citation: l.replace(/^>\s*/, "").replace(/^[«"]\s*|\s*[»"]$/g, "") }); cur = null; continue; }
    if (/^[-•*]\s/.test(l)) { if (!cur) nouvelle(); (cur.liste ||= []).push(l.replace(/^[-•*]\s+/, "")); continue; }
    if (!l) { if (cur && cur.texte && !cur.texte.endsWith("\n\n")) cur.texte += "\n\n"; continue; }
    if (!cur || cur.liste) nouvelle();  // un paragraphe après une liste ouvre une nouvelle partie, pour garder l'ordre
    cur.texte = (cur.texte || "") + (cur.texte && !cur.texte.endsWith("\n\n") ? " " : "") + l;
  }
  out.forEach(s => { if (s.texte) s.texte = s.texte.trim(); });
  return out.filter(s => s.texte || s.liste || s.citation || s.titre);
}

  });
}
$("#brandLogo").src = icon("erlenmeyer-konoha");
(() => { // visionneuse plein écran des images d'articles
  const box = $("#lightbox"), img = box.querySelector("img"), cap = box.querySelector("p");
  const close = () => { box.classList.remove("open"); img.removeAttribute("src"); };
  document.addEventListener("click", e => {
    const z = e.target.closest("[data-zoom]");
    if (z) { e.preventDefault(); img.src = z.dataset.zoom; img.alt = z.dataset.cap || ""; cap.textContent = z.dataset.cap || ""; box.classList.add("open"); return; }
    if (box.classList.contains("open") && !e.target.closest(".lightbox img")) close();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && box.classList.contains("open")) close(); });
  window.addEventListener("hashchange", close);
})();
$("#menuBtn").addEventListener("click", () => { const o = $("#sidebar").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", String(o)); });
setupTheme(); buildNav(); setupSearch();
window.addEventListener("hashchange", route);
route();
</script>
